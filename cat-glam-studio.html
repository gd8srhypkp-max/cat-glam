/* ================= 07-state ================= */
/* =====================================================================
   STATE — versioned save object, migrations, export/import, cloud sync (Google Apps Script)
   GAME  — the ONLY place state is mutated. Every reward emits an event the UI listens to.
   ===================================================================== */
const SAVE_VERSION = 2, SAVE_KEY = "cgs_save_v2", LEGACY_KEY = "cgs_save", PID_KEY = "cgs_pid";
const HAS_GAS = (typeof google !== "undefined" && google.script && google.script.run);

function defaultState(){
  return {
    v:SAVE_VERSION, createdAt:Date.now(), updatedAt:Date.now(),
    player:{ name:"", level:1, xp:0, coins:60, stars:0, lifetimeCoins:0, lifetimeXp:0 },
    activeCat:null, cats:{},
    inv:{ items:{}, scenes:{}, foods:{} }, newItems:[],
    challenges:{},
    daily:{ date:null, missions:[], chestClaimed:false, featured:null, picks:[], counters:{}, freeBox:false, challengeBonus:{}, minigame:{}, schoolSessions:0 },
    streak:{ day:0, last:null, best:0 },
    achievements:{}, collections:{}, counters:{}, photos:[],
    onboarding:{ done:false, step:0 },
    settings:{ muted:false, grade:2, motion:"auto", hints:true },
    school:{ xp:0, level:1, sessions:0, best:{} },
    seen:{ features:[], cats:[], welcomeBack:null }
  };
}
function newCatRecord(id,name){
  return { id, name:name||CATS[id].name, owned:true, friendship:1, hearts:0, adoptedAt:Date.now(),
    care:{ hunger:72, clean:80, fun:68, energy:85, last:Date.now() },
    outfit:{ hat:null, ears:null, glasses:null, makeup:null, necklace:null, top:"top_tee", bottom:"bot_skirt", dress:null, costume:null, shoes:"sh_sneak", back:null, hand:null },
    scene:"bg_studio", presets:{}, stats:{ feed:0, bath:0, play:0, pet:0, shows:0, wins:0, school:0, favFed:0 },
    stories:[], gifts:[], badge:false };
}
let S = null;

/* ---------------- SAVE MANAGER ---------------- */
const Save = (()=>{
  const V1_ITEM_MAP = {hbow:"hat_bow",hcrown:"hat_crown",hbeanie:"hat_beanie",hparty:"hat_party",hflower:"hat_flowercrown",hwitch:"hat_witch",hcatear:"hat_catears",
    ebow:"ear_bows",eflower:"ear_flowers",estar:"ear_starstuds",ehoop:"ear_hoops",eheartd:"ear_heartdrops",
    groundp:"gls_round",gheart:"gls_heart",gstar:"gls_star",gsun:"gls_shades",gnerd:"gls_nerdy",gcateye:"gls_cateye",grainbow:"gls_rainbow",gsparkle:"gls_sparkle",
    mblush:"mk_blush",mshadow:"mk_sparkleeyes",mfreckle:"mk_freckles",mstar:"mk_starcheeks",mgloss:"mk_gloss",mberry:"mk_berry",mglitter:"mk_glitter",
    nbell:"nk_bell",npearl:"nk_pearls",nheart:"nk_heart",nbowtie:"nk_bowtie",nscarf:"nk_scarf",
    ttee:"top_tee",tstripe:"top_stripes",thoodie:"top_hoodie",tsweater:"top_sweater",ttank:"top_tank",tsailor:"top_sailor",
    bskirt:"bot_skirt",btutu:"bot_tutu",bjeans:"bot_jeans",bshorts:"bot_shorts",bpolka:"bot_polka",
    dparty:"drs_party",dprincess:"drs_princess",drainbow:"drs_rainbow",dmermaid:"drs_mermaid",doverall:"drs_overalls",dhero:"drs_hero",dballet:"drs_ballet",dsunflower:"drs_sunflower",dcupcake:"drs_cupcake",dstarlight:"drs_starlight",
    ssneak:"sh_sneak",sboot:"sh_boots",sflat:"sh_flats",ssandal:"sh_sandals",sbunny:"sh_bunny",
    xwand:"hd_wand",xballoon:"hd_balloon",xflowers:"hd_bouquet",xwings:"bk_fairywings",xcape:"bk_cape"};
  const V1_FREE = ["hbow","hbeanie","hparty","hcatear","ebow","eflower","groundp","gheart","gsun","gnerd","mblush","mshadow","mfreckle","mgloss","nbell","nheart","nbowtie","nscarf","ttee","tstripe","tsweater","ttank","bskirt","btutu","bjeans","bshorts","dparty","doverall","ssneak","sboot","sflat","ssandal","xballoon","xflowers"];
  const V1_BG_MAP = {studio:"bg_studio",night:"bg_night",garden:"bg_garden",beach:"bg_beach",rainbow:"bg_rainbow",stage:"bg_catwalk",candy:"bg_candy",castle:"bg_castle",party:"bg_party",winter:"bg_winter"};

  function migrateV1(old){ // prototype save → v2 (keeps progress, grants matching items)
    const s=defaultState(); s.migratedFromV1=true;
    s.player.coins=Math.max(60,(old.coins||0)+40); s.player.stars=old.stars||0;
    (old.ownedCats||["snow"]).forEach(id=>{ if(CATS[id]) s.cats[id]=newCatRecord(id, id===old.cat&&old.catName?old.catName:null); });
    if(!Object.keys(s.cats).length) s.cats.snow=newCatRecord("snow");
    s.activeCat=CATS[old.cat]&&s.cats[old.cat]?old.cat:Object.keys(s.cats)[0];
    const grant=id=>{ if(id&&ITEMS.find(i=>i.id===id)) s.inv.items[id]=true; };
    V1_FREE.forEach(o=>grant(V1_ITEM_MAP[o]));
    (old.unlocked||[]).forEach(u=>{ if(u.startsWith("bg:")){ const b=V1_BG_MAP[u.slice(3)]; if(b) s.inv.scenes[b]=true; } else grant(V1_ITEM_MAP[u]); });
    Object.assign(s.inv.scenes,{bg_studio:true,bg_garden:true,bg_beach:true,bg_party:true});
    if(old.streak) s.streak={day:old.streak.day||0,last:old.streak.last||null,best:old.streak.day||0};
    if(old.brain){ s.settings.grade=clamp(old.brain.grade||1,1,5); s.school.level=clamp(old.brain.grade||1,1,6); }
    s.counters.photo=(old.photos||[]).length; s.counters.outfitSave=old.looksMade||0;
    s.onboarding={done:true,step:99};
    // outfit: translate equipped
    const c=s.cats[s.activeCat]; if(old.equipped&&c){ const eq=old.equipped; const map=(k)=>V1_ITEM_MAP[eq[k]]||null;
      c.outfit.hat=map("hat"); c.outfit.ears=map("ears"); c.outfit.glasses=map("glasses"); c.outfit.makeup=map("makeup"); c.outfit.necklace=map("necklace");
      c.outfit.top=map("top"); c.outfit.bottom=map("bottom"); c.outfit.dress=map("dress"); c.outfit.shoes=map("shoes")||"sh_sneak";
      const x=V1_ITEM_MAP[eq.extra]; if(x){ if(x.startsWith("bk_")) c.outfit.back=x; else c.outfit.hand=x; }
      Object.keys(c.outfit).forEach(k=>{ if(c.outfit[k]&&!s.inv.items[c.outfit[k]]) c.outfit[k]=null; });
      c.scene=V1_BG_MAP[eq.background]||"bg_studio"; }
    return s;
  }
  function upgrade(s){ // future-proof: bump versions step by step
    if(!s.v) s.v=2;
    // v2 → v3 migrations would go here: if(s.v===2){ ...; s.v=3; }
    const d=defaultState();
    // fill any missing keys (forward compat with new fields)
    const merge=(dst,src)=>{ for(const k in src){ if(dst[k]===undefined) dst[k]=deepClone(src[k]); else if(src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k])&&dst[k]&&typeof dst[k]==="object"&&!Array.isArray(dst[k])) merge(dst[k],src[k]); } };
    merge(s,d);
    Object.values(s.cats).forEach(c=>{ const n=newCatRecord(c.id||"snow"); merge(c,n); });
    return s;
  }
  function load(){
    try{ const raw=Store.get(SAVE_KEY); if(raw){ return upgrade(JSON.parse(raw)); } }catch(e){ console.warn("save parse failed",e); }
    try{ const old=Store.get(LEGACY_KEY); if(old){ const s=migrateV1(JSON.parse(old)); Store.set(LEGACY_KEY+"_backup",old); return upgrade(s); } }catch(e){ console.warn("v1 migrate failed",e); }
    return null;
  }
  let syncT=null, lastSynced=0, parked=false;
  function setParked(v){ parked=!!v; if(parked) clearTimeout(syncT); }
  function persist(){ if(parked) return; S.updatedAt=Date.now(); try{ Store.set(SAVE_KEY,JSON.stringify(S)); }catch(e){} if(Cloud.available()){ clearTimeout(syncT); syncT=setTimeout(cloudPush,1500); } }
  const save=debounce(persist,120);
  function playerId(){ let id=Store.get(PID_KEY); if(!id){ id="p_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36); Store.set(PID_KEY,id); } return id; }
  function cloudPush(){ if(!Cloud.available()||parked) return; Cloud.call("saveState",playerId(),JSON.stringify(S)).then(r=>{ if(r==="ok"){ lastSynced=Date.now(); Bus.emit("cloud",{ok:true}); } else Bus.emit("cloud",{ok:false,why:String(r||"")}); }).catch(e=>Bus.emit("cloud",{ok:false,why:String(e&&e.message||e)})); }
  function cloudPull(cb){ if(!Cloud.available()) return cb(null); Cloud.call("loadState",playerId()).then(str=>{ let obj=null; try{ obj=str?JSON.parse(str):null; }catch(e){} cb(obj); }).catch(()=>cb(null)); }
  function exportString(){ persist(); return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
  function importString(str){
    let obj=null; str=(str||"").trim();
    try{ obj=JSON.parse(str); }catch(e){ try{ obj=JSON.parse(decodeURIComponent(escape(atob(str)))); }catch(e2){ return {ok:false,error:"That doesn't look like a Cat Glam save."}; } }
    if(!obj||typeof obj!=="object"||!obj.player||!obj.cats) return {ok:false,error:"That save file is missing data."};
    S=upgrade(obj); persist(); return {ok:true};
  }
  function reset(){ Store.del(SAVE_KEY); S=defaultState(); persist(); }
  return { load, save, persist, setParked, exportString, importString, reset, cloudPull, cloudPush, playerId, defaultState, get lastSynced(){return lastSynced;} };
})();

/* ---------------- GAME (central mutation API) ---------------- */
const Game = (()=>{
  const itemById={}; ITEMS.forEach(i=>itemById[i.id]=i);
  const sceneById={}; SCENES.forEach(s=>sceneById[s.id]=s);
  const foodById={}; FOODS.forEach(f=>foodById[f.id]=f);
  let checking=false, pendingCheck=false;

  function item(id){ return itemById[id]; }
  function scene(id){ return sceneById[id]; }
  function activeCat(){ return S.cats[S.activeCat]; }
  function ownedCats(){ return CAT_ORDER.filter(id=>S.cats[id]&&S.cats[id].owned); }
  function owns(id){ return !!S.inv.items[id]; }
  function ownsScene(id){ return !!S.inv.scenes[id]; }
  function foodCount(id){ const f=foodById[id]; if(!f) return 0; if(f.price===0) return Infinity; return S.inv.foods[id]||0; }
  function level(){ return S.player.level; }
  function featureOpen(id){ const f=FEATURES[id]; return !f || S.player.level>=f.lvl; }

  /* --- currencies --- */
  function addCoins(n,src){ n=Math.round(n); if(!n) return; S.player.coins=Math.max(0,S.player.coins+n); if(n>0) S.player.lifetimeCoins+=n; Bus.emit("coins",{n,src}); Save.save(); }
  function spendCoins(n){ if(S.player.coins<n) return false; S.player.coins-=n; Bus.emit("coins",{n:-n,src:"spend"}); Save.save(); return true; }
  function addStars(n,src){ n=Math.round(n); if(!n) return; S.player.stars=Math.max(0,S.player.stars+n); Bus.emit("stars",{n,src}); Save.save(); }
  function spendStars(n){ if(S.player.stars<n) return false; S.player.stars-=n; Bus.emit("stars",{n:-n,src:"spend"}); Save.save(); return true; }

  /* --- XP & levels --- */
  function levelUnlocks(lv){
    const u=[];
    Object.entries(FEATURES).forEach(([id,f])=>{ if(f.lvl===lv) u.push({type:"feature",id,label:f.name,emoji:f.emoji}); });
    Object.entries(MINIGAME_UNLOCK).forEach(([id,l])=>{ if(l===lv) u.push({type:"minigame",id,label:({laser:"Laser Chase",yarn:"Catch the Yarn",memory:"Memory Cards",sort:"Fashion Sort"})[id],emoji:"🎮"}); });
    SHOWS.forEach(s=>{ if(s.lvl===lv) u.push({type:"show",id:s.id,label:s.name,emoji:s.emoji}); });
    CHALLENGES.forEach(c=>{ if(c.lvl===lv) u.push({type:"challenge",id:c.id,label:c.name,emoji:c.emoji}); });
    CAT_ORDER.forEach(id=>{ const c=CATS[id]; if(c.unlock.type==="level"&&c.unlock.n===lv) u.push({type:"cat",id,label:c.name+" can be adopted",emoji:"🐱"}); });
    Object.entries(POSE_UNLOCKS).forEach(([id,p])=>{ if(p.level===lv) u.push({type:"pose",id,label:Art.POSES[id].name+" pose",emoji:Art.POSES[id].emoji}); });
    BOXES.forEach(b=>{ if(b.lvl===lv) u.push({type:"box",id:b.id,label:b.name,emoji:b.emoji}); });
    TOYS.forEach(t=>{ if(t.lvl===lv) u.push({type:"toy",id:t.id,label:t.name,emoji:t.emoji}); });
    const shopN=ITEMS.filter(i=>i.src==="shop"&&(i.lvl||1)===lv).length+SCENES.filter(s=>s.src==="shop"&&(s.lvl||1)===lv).length;
    if(shopN) u.push({type:"shop",id:"shop",label:shopN+" new shop items",emoji:"🛍️"});
    return u;
  }
  function addXP(n,src){
    n=Math.round(n); if(n<=0) return; const p=S.player; p.xp+=n; p.lifetimeXp+=n; Bus.emit("xp",{n,src});
    while(p.level<MAX_LEVEL && p.xp>=xpToNext(p.level)){
      p.xp-=xpToNext(p.level); p.level++;
      const r=LEVEL_REWARDS[p.level]||{coins:50,stars:1};
      p.coins+=r.coins; p.stars+=r.stars; p.lifetimeCoins+=r.coins;
      const unlocks=levelUnlocks(p.level);
      Bus.emit("levelup",{level:p.level,title:LEVEL_TITLES[p.level]||"Legend",rewards:r,unlocks});
      if(S.daily.date) rollDailyContent(); // new level → featured challenge / missions may widen
    }
    Save.save(); scheduleCheck();
  }

  /* --- friendship --- */
  function addHearts(catId,n,src){
    const c=S.cats[catId]; if(!c||n<=0) return; c.hearts+=n; Bus.emit("hearts",{cat:catId,n,src});
    while(c.friendship<FRIEND_MAX && c.hearts>=heartsToNext(c.friendship)){
      c.hearts-=heartsToNext(c.friendship); c.friendship++;
      const r=FRIEND_REWARDS[c.friendship]||{}; const got={level:c.friendship,cat:catId,rewards:[]};
      if(r.coins){ S.player.coins+=r.coins; S.player.lifetimeCoins+=r.coins; got.rewards.push({t:"coins",n:r.coins}); }
      if(r.stars){ S.player.stars+=r.stars; got.rewards.push({t:"stars",n:r.stars}); }
      if(r.pose){ got.rewards.push({t:"pose",id:r.pose}); }
      if(r.story!==undefined){ if(!c.stories.includes(r.story)) c.stories.push(r.story); got.rewards.push({t:"story",i:r.story}); }
      if(r.gift){ const g=CATS[catId].gift; if(g&&!owns(g)){ S.inv.items[g]=true; S.newItems.push(g); c.gifts.push(g); got.rewards.push({t:"item",id:g}); } else if(g){ S.player.coins+=60; got.rewards.push({t:"coins",n:60}); } }
      if(r.badge){ c.badge=true; got.rewards.push({t:"badge"}); }
      Bus.emit("friendup",got);
    }
    if(c.friendship>=FRIEND_MAX) c.hearts=Math.min(c.hearts,heartsToNext(FRIEND_MAX)-1);
    Save.save(); scheduleCheck();
  }

  /* --- inventory --- */
  function grantItem(id,src){
    const it=itemById[id]; if(!it) return {ok:false};
    if(S.inv.items[id]){ const c=RARITY[it.rarity].sell; S.player.coins+=c; S.player.lifetimeCoins+=c; Bus.emit("coins",{n:c,src:"dup"}); Save.save(); return {ok:true,dup:true,coins:c,item:it}; }
    S.inv.items[id]=true; if(!S.newItems.includes(id)) S.newItems.push(id);
    Bus.emit("item",{id,src,item:it}); Save.save(); scheduleCheck(); checkCollections();
    return {ok:true,dup:false,item:it};
  }
  function grantScene(id,src){
    const sc=sceneById[id]; if(!sc) return {ok:false};
    if(S.inv.scenes[id]){ const c=RARITY[sc.rarity].sell; S.player.coins+=c; Bus.emit("coins",{n:c,src:"dup"}); Save.save(); return {ok:true,dup:true,coins:c,scene:sc}; }
    S.inv.scenes[id]=true; Bus.emit("scene",{id,src,scene:sc}); Save.save(); return {ok:true,dup:false,scene:sc};
  }
  function addFood(id,n){ S.inv.foods[id]=(S.inv.foods[id]||0)+n; Save.save(); }
  function useFood(id){ const f=foodById[id]; if(!f) return false; if(f.price===0) return true; if((S.inv.foods[id]||0)<=0) return false; S.inv.foods[id]--; Save.save(); return true; }
  function markSeen(id){ const i=S.newItems.indexOf(id); if(i>=0){ S.newItems.splice(i,1); Save.save(); } }

  /* --- cats --- */
  function catUnlock(id){ // {ok, text, progress:0-1, cost:{coins|stars}}
    const c=CATS[id], u=c.unlock; let ok=false,text="",prog=0;
    if(S.cats[id]&&S.cats[id].owned) return {ok:true,owned:true,text:"Adopted",progress:1};
    switch(u.type){
      case "starter": ok=S.player.level>=2; text=ok?"Ready to adopt":"Reach Level 2"; prog=Math.min(1,S.player.level/2); break;
      case "level": ok=S.player.level>=u.n; text=ok?"Ready to adopt":"Reach Level "+u.n; prog=Math.min(1,S.player.level/u.n); break;
      case "stars": ok=S.player.stars>=u.n; text=ok?"Ready to adopt":`Have ${u.n} ⭐ (you have ${S.player.stars})`; prog=Math.min(1,S.player.stars/u.n); break;
      case "shows": { const n=stat("show"); ok=n>=u.n; text=ok?"Ready to adopt":`Enter ${u.n} fashion shows (${n}/${u.n})`; prog=Math.min(1,n/u.n); break; }
      case "set": { const col=COLLECTIONS.find(x=>x.id===u.id); const have=col.items.filter(owns).length; ok=have>=col.items.length; text=ok?"Ready to adopt":`Complete the ${col.name} Collection (${have}/${col.items.length})`; prog=have/col.items.length; break; }
    }
    const cost=c.stars?{stars:c.stars}:{coins:c.cost||0};
    return {ok,text,progress:prog,cost};
  }
  function adoptCat(id){
    const st=catUnlock(id); if(!st.ok||st.owned) return {ok:false,reason:st.text};
    if(st.cost.stars){ if(!spendStars(st.cost.stars)) return {ok:false,reason:"Not enough stars"}; }
    else if(st.cost.coins){ if(!spendCoins(st.cost.coins)) return {ok:false,reason:"Not enough coins"}; }
    S.cats[id]=newCatRecord(id); Bus.emit("cat",{id}); Save.save(); scheduleCheck(); return {ok:true};
  }
  function setActiveCat(id){ if(S.cats[id]&&S.cats[id].owned){ S.activeCat=id; Bus.emit("activecat",{id}); Save.save(); } }

  /* --- care --- */
  function tickCare(c){
    const now=Date.now(), care=c.care; const mins=Math.min(480,(now-(care.last||now))/60000); if(mins<0.25) return;
    const active=c.id===S.activeCat, k=active?1:0.5, floor=active?15:30;
    care.hunger=Math.max(floor,care.hunger-0.5*mins*k); care.clean=Math.max(floor,care.clean-0.28*mins*k);
    care.fun=Math.max(floor,care.fun-0.42*mins*k); care.energy=Math.min(100,care.energy+0.35*mins); care.last=now;
  }
  function tickAll(){ Object.values(S.cats).forEach(tickCare); Save.save(); }
  function modCare(catId,stat,delta){ const c=S.cats[catId]; if(!c) return 0; const b=c.care[stat]; c.care[stat]=clamp(b+delta,0,100); c.care.last=Date.now(); Bus.emit("care",{cat:catId,stat,delta:c.care[stat]-b}); Save.save(); return c.care[stat]-b; }
  function mood(c){ const k=c.care; return Math.round((k.hunger+k.clean+k.fun+k.energy)/4); }
  function moodInfo(c){ const m=mood(c); return m>=80?{e:"😻",t:"Super happy",m}:m>=60?{e:"😺",t:"Happy",m}:m>=40?{e:"🙂",t:"Okay",m}:{e:"🥺",t:"Needs love",m}; }
  function lowestNeed(c){ const k=c.care; return [["hunger",k.hunger],["clean",k.clean],["fun",k.fun],["energy",k.energy]].sort((a,b)=>a[1]-b[1])[0]; }

  /* --- counters, missions, daily --- */
  function track(counter,n){
    n=n||1; S.counters[counter]=(S.counters[counter]||0)+n; S.daily.counters[counter]=(S.daily.counters[counter]||0)+n;
    (S.daily.missions||[]).forEach(m=>{ if(m.done) return; const def=MISSION_POOL.find(x=>x.id===m.id); if(!def||def.counter!==counter) return;
      if(counter==="catsCared"){ m.progress=Object.keys(S.daily.cared||{}).length; } else m.progress=Math.min(def.goal,(m.progress||0)+n);
      if(m.progress>=def.goal){ m.done=true; S.player.coins+=def.reward.coins; S.player.lifetimeCoins+=def.reward.coins; S.player.xp+=0; Bus.emit("mission",{id:m.id,def}); addXP(def.reward.xp,"mission"); Bus.emit("coins",{n:def.reward.coins,src:"mission"}); } });
    Bus.emit("track",{counter,n}); Save.save(); scheduleCheck();
  }
  function caredFor(catId){ S.daily.cared=S.daily.cared||{}; if(!S.daily.cared[catId]){ S.daily.cared[catId]=true; track("catsCared",1); } }
  function missionsAllDone(){ const m=S.daily.missions||[]; return m.length>0 && m.every(x=>x.done); }
  function claimChest(){ if(!missionsAllDone()||S.daily.chestClaimed) return null; S.daily.chestClaimed=true; S.counters.chests=(S.counters.chests||0)+1;
    const r=Object.assign({},MISSION_CHEST); let item=null; const rng=Math.random();
    if(rng<0.35){ const pool=ITEMS.filter(i=>!owns(i.id)&&(i.src==="shop"||i.src==="box")&&(i.rarity==="cute"||i.rarity==="rare")&&(i.lvl||1)<=S.player.level+1); if(pool.length){ item=pick(pool); S.inv.items[item.id]=true; S.newItems.push(item.id); } }
    addCoins(r.coins,"chest"); addStars(r.stars,"chest"); addXP(r.xp,"chest"); Save.save(); scheduleCheck(); checkCollections(); return {r,item}; }
  function rollDailyContent(){
    const d=S.daily, rng=seeded(dayNum()*7919+S.player.level*31);
    const lv=S.player.level, nCats=ownedCats().length;
    const pool=MISSION_POOL.filter(m=>(m.lvl||1)<=lv && (!m.needCats||nCats>=m.needCats));
    const keep=(d.missions||[]).filter(m=>pool.find(p=>p.id===m.id));
    const ids=new Set(keep.map(m=>m.id));
    const extra=seededShuffle(rng,pool.filter(p=>!ids.has(p.id))).slice(0,3-keep.length).map(p=>({id:p.id,progress:0,done:false}));
    d.missions=keep.concat(extra).slice(0,3);
    const ch=CHALLENGES.filter(c=>c.lvl<=lv); d.featured=seededPick(seeded(dayNum()*131),ch).id;
    const shopPool=ITEMS.filter(i=>i.src==="shop"&&(i.lvl||1)<=lv&&!owns(i.id)); d.picks=seededShuffle(seeded(dayNum()*17+lv),shopPool).slice(0,3).map(i=>i.id);
  }
  function ensureDaily(){
    const t=todayStr(); if(S.daily.date===t){ return false; }
    const first=!S.daily.date;
    S.daily={ date:t, missions:[], chestClaimed:false, featured:null, picks:[], counters:{}, freeBox:false, challengeBonus:{}, minigame:{}, schoolSessions:0, cared:{} };
    rollDailyContent(); Save.save(); if(!first) Bus.emit("newday",{}); return true;
  }
  function featuredChallenge(){ return CHALLENGES.find(c=>c.id===S.daily.featured)||CHALLENGES[0]; }

  /* --- streak --- */
  function streakInfo(){ const st=S.streak, t=todayStr(); if(st.last===t) return {claimable:false,nextDay:st.day,st};
    const cont=st.last&&(dayNum(t)-dayNum(st.last)===1); const nextDay=cont?(st.day>=7?1:st.day+1):1; return {claimable:true,nextDay,st,broken:!!st.last&&!cont&&st.day>0}; }
  function claimStreak(){ const info=streakInfo(); if(!info.claimable) return null; const day=info.nextDay, r=STREAK_REWARDS[day-1];
    S.streak.day=day; S.streak.last=todayStr(); S.streak.best=Math.max(S.streak.best||0,day); const total=(S.streak.total||0)+1; S.streak.total=total;
    addCoins(r.coins,"streak"); if(r.stars) addStars(r.stars,"streak"); addXP(10+day*2,"streak"); if(r.box) S.daily.bonusBox=true; /* day 7 → a bonus mystery box */ Save.save(); scheduleCheck(); return {day,r}; }

  /* --- collections & achievements --- */
  function collectionProgress(col){ const have=col.items.filter(owns).length; return {have,total:col.items.length,done:have>=col.items.length,claimed:!!(S.collections[col.id]&&S.collections[col.id].claimed)}; }
  function checkCollections(){ COLLECTIONS.forEach(col=>{ const p=collectionProgress(col); if(p.done&&!p.claimed){ S.collections[col.id]={claimed:true,date:todayStr()}; const r=col.reward; const got={col,rewards:[]};
      if(r.item&&!owns(r.item)){ S.inv.items[r.item]=true; S.newItems.push(r.item); got.rewards.push({t:"item",id:r.item}); }
      if(r.coins){ S.player.coins+=r.coins; S.player.lifetimeCoins+=r.coins; got.rewards.push({t:"coins",n:r.coins}); }
      if(r.stars){ S.player.stars+=r.stars; got.rewards.push({t:"stars",n:r.stars}); }
      if(r.cat) got.rewards.push({t:"catunlock",id:r.cat});
      Bus.emit("collection",got); if(r.xp) addXP(r.xp,"collection"); Save.save(); } }); scheduleCheck(); }
  function stat(name){
    switch(name){
      case "onboarded": return S.onboarding.done?1:0;
      case "catsOwned": return ownedCats().length;
      case "friendMax": return Math.max(0,...ownedCats().map(id=>S.cats[id].friendship));
      case "itemsOwned": return Object.keys(S.inv.items).length;
      case "legendaryOwned": return ITEMS.filter(i=>i.rarity==="legendary"&&owns(i.id)).length;
      case "setsDone": return COLLECTIONS.filter(c=>collectionProgress(c).done).length;
      case "level": return S.player.level;
      case "streakBest": return S.streak.best||0;
      case "challenge3": return Object.values(S.challenges).filter(c=>c.best>=3).length;
      default: return S.counters[name]||0;
    }
  }
  function scheduleCheck(){ if(checking){ pendingCheck=true; return; } checking=true; setTimeout(()=>{ checking=false; runChecks(); if(pendingCheck){ pendingCheck=false; scheduleCheck(); } },0); }
  function runChecks(){
    ACHIEVEMENTS.forEach(a=>{ if(S.achievements[a.id]) return; if(stat(a.stat)>=a.goal){ S.achievements[a.id]={date:todayStr()}; const r=a.reward||{};
      if(r.coins){ S.player.coins+=r.coins; S.player.lifetimeCoins+=r.coins; } if(r.stars) S.player.stars+=r.stars;
      Bus.emit("achievement",{a}); if(r.xp) addXP(r.xp,"achievement"); Save.save(); } });
  }
  function claimableCount(){ let n=0; if(missionsAllDone()&&!S.daily.chestClaimed) n++; if(streakInfo().claimable) n++; if(featureOpen("mystery")&&(!S.daily.freeBox||S.daily.bonusBox)) n++; return n; }

  return { item, scene, foodById, activeCat, ownedCats, owns, ownsScene, foodCount, level, featureOpen, addCoins, spendCoins, addStars, spendStars, addXP, levelUnlocks,
    addHearts, grantItem, grantScene, addFood, useFood, markSeen, catUnlock, adoptCat, setActiveCat, tickCare, tickAll, modCare, mood, moodInfo, lowestNeed,
    track, caredFor, missionsAllDone, claimChest, ensureDaily, rollDailyContent, featuredChallenge, streakInfo, claimStreak, collectionProgress, checkCollections, stat, runChecks, claimableCount,
    get S(){ return S; } };
})();

/* ---------------- WARDROBE ---------------- */
const Wardrobe = (()=>{
  function items(outfit){ return SLOTS.map(s=>outfit[s]&&Game.item(outfit[s])).filter(Boolean); }
  function count(outfit){ return items(outfit).length; }
  function colorsOf(outfit){ const set=new Set(); items(outfit).forEach(i=>i.colors.forEach(c=>{ if(c==="rainbow"){["red","orange","yellow","green","blue","purple","rainbow"].forEach(x=>set.add(x));} else set.add(c); })); return set; }
  function hasColor(outfit,c){ return items(outfit).some(i=>i.colors.includes(c)||i.colors.includes("rainbow")); }
  function colorItemCount(outfit,cols){ return items(outfit).filter(i=>cols.some(c=>i.colors.includes(c)||(i.colors.includes("rainbow")&&c!=="black"&&c!=="white"&&c!=="brown"))).length; }
  function distinctColors(outfit){ const set=new Set(); items(outfit).forEach(i=>i.colors.forEach(c=>set.add(c))); return set.size; }
  function accessoryCount(outfit){ return ACCESSORY_SLOTS.filter(s=>outfit[s]).length; }
  function rarityPoints(outfit){ return items(outfit).reduce((a,i)=>a+RARITY[i.rarity].pts,0); }
  function setCounts(outfit){ const m={}; items(outfit).forEach(i=>{ if(i.set) m[i.set]=(m[i.set]||0)+1; }); return m; }
  function test(outfit,t){
    const [kind,arg]=t.split(":"); const its=items(outfit);
    switch(kind){
      case "slot": return arg.split("|").some(s=>!!outfit[s]);
      case "tag": return its.some(i=>arg.split("|").some(tg=>i.tags.includes(tg)||i.set===tg));
      case "item": return arg.split("|").some(id=>its.some(i=>i.id===id));
      case "set": return its.some(i=>i.set===arg);
      case "costume": return !!outfit.costume;
      case "rarity": { const order=["common","cute","rare","super","legendary"]; return its.some(i=>order.indexOf(i.rarity)>=order.indexOf(arg)); }
      case "items": return its.length>=parseInt(arg,10);
      case "color": return arg.split("|").some(c=>hasColor(outfit,c));
    }
    return false;
  }
  function equip(cat,slot,id){
    const o=cat.outfit;
    if(id){
      if(slot==="dress"){ o.top=null; o.bottom=null; o.costume=null; }
      if(slot==="costume"){ o.top=null; o.bottom=null; o.dress=null; }
      if(slot==="top"||slot==="bottom"){ o.dress=null; o.costume=null; }
      Game.markSeen(id);
    }
    o[slot]=id; Save.save(); Bus.emit("outfit",{cat:cat.id,slot,id}); if(id) Game.track("equip",1);
  }
  function clear(cat){ SLOTS.forEach(s=>cat.outfit[s]=null); Save.save(); Bus.emit("outfit",{cat:cat.id}); }
  function ownedIn(slot){ return ITEMS.filter(i=>i.cat===slot&&Game.owns(i.id)); }
  function randomOutfit(cat){
    const o={}; SLOTS.forEach(s=>o[s]=null);
    const pickOwned=slot=>{ const l=ownedIn(slot); return l.length?pick(l).id:null; };
    const r=Math.random(); if(r<0.15&&ownedIn("costume").length){ o.costume=pickOwned("costume"); } else if(r<0.5&&ownedIn("dress").length){ o.dress=pickOwned("dress"); } else { o.top=pickOwned("top"); o.bottom=pickOwned("bottom"); }
    o.shoes=pickOwned("shoes"); if(Math.random()<.75) o.hat=pickOwned("hat"); if(Math.random()<.45) o.ears=pickOwned("ears"); if(Math.random()<.5) o.glasses=pickOwned("glasses");
    if(Math.random()<.7) o.makeup=pickOwned("makeup"); if(Math.random()<.6) o.necklace=pickOwned("necklace"); if(Math.random()<.35) o.back=pickOwned("back"); if(Math.random()<.4) o.hand=pickOwned("hand");
    cat.outfit=o; Save.save(); Bus.emit("outfit",{cat:cat.id});
  }
  function savePreset(cat,key){ cat.presets[key]=deepClone(cat.outfit); Save.save(); Game.track("outfitSave",1); }
  function loadPreset(cat,key){ const p=cat.presets[key]; if(!p) return false; cat.outfit=deepClone(p); SLOTS.forEach(s=>{ if(cat.outfit[s]&&!Game.owns(cat.outfit[s])) cat.outfit[s]=null; }); Save.save(); Bus.emit("outfit",{cat:cat.id}); return true; }
  function describe(outfit){ return items(outfit).map(i=>i.name).join(", ")||"nothing yet"; }
  return { items, count, colorsOf, distinctColors, hasColor, colorItemCount, accessoryCount, rarityPoints, setCounts, test, equip, clear, ownedIn, randomOutfit, savePreset, loadPreset, describe };
})();

/* ---------------- FASHION CHALLENGES (explainable scoring) ---------------- */
const Challenges = (()=>{
  const COLOR_EMOJI={pink:"🩷",red:"❤️",orange:"🧡",yellow:"💛",green:"💚",blue:"💙",purple:"💜",black:"🖤",white:"🤍",brown:"🤎",gold:"⭐",rainbow:"🌈"};
  function colorRule(ch){ const c=ch.color;
    if(c.any) return {label:"Wear "+c.any.map(x=>COLOR_EMOJI[x]+" "+x).join(" or "),detail:"1 item = ★★ · 2+ items = ★★★"};
    if(c.all) return {label:"Wear "+c.all.map(x=>COLOR_EMOJI[x]+" "+x).join(" and "),detail:"each color = ★"};
    if(c.distinct) return {label:`Use ${c.distinct}+ different colors`,detail:"1 color = ★ · 2 = ★★ · 3+ = ★★★"};
    if(c.max) return {label:`Only ${c.max} color${c.max>1?"s":""} (4+ items)`,detail:"stay in the color family for ★★★"};
    return {label:"Any colors",detail:""}; }
  function scoreColor(ch,outfit){ const c=ch.color, dist=[...Wardrobe.colorsOf(outfit)].filter(x=>x!=="rainbow").length, n=Wardrobe.count(outfit);
    if(c.any){ const k=Wardrobe.colorItemCount(outfit,c.any); return {stars:k>=2?3:k===1?2:0,note:k?`${k} matching item${k>1?"s":""}`:"no matching colors"}; }
    if(c.all){ const p=c.all.filter(x=>Wardrobe.hasColor(outfit,x)).length; return {stars:Math.round(3*p/c.all.length),note:`${p}/${c.all.length} colors`}; }
    if(c.distinct){ return {stars:Math.min(3,Math.floor(3*dist/c.distinct)),note:`${dist} color${dist===1?"":"s"}`}; }
    if(c.max){ const s=(dist<=c.max&&n>=4)?3:(dist<=c.max+1?2:1); return {stars:s,note:`${dist} color${dist===1?"":"s"}, ${n} items`}; }
    return {stars:3,note:""}; }
  function score(ch,outfit){
    const checks=ch.theme.map(r=>({l:r.l,e:r.e,ok:Wardrobe.test(outfit,r.t)})); const met=checks.filter(c=>c.ok).length;
    const theme={stars:Math.round(3*met/checks.length),checks,note:`${met}/${checks.length} requirements`};
    const color=scoreColor(ch,outfit);
    const ac=Wardrobe.accessoryCount(outfit); const access={stars:Math.min(3,ac),count:ac,note:ac?`${ac} accessor${ac===1?"y":"ies"}`:"no accessories"};
    const total=theme.stars+color.stars+access.stars; const awarded=total>=9?3:total>=6?2:total>=3?1:0;
    return {theme,color,access,total,awarded};
  }
  function unlocked(){ return CHALLENGES.filter(c=>c.lvl<=Game.level()); }
  function record(id){ return S.challenges[id]||{best:0,plays:0}; }
  function isFeatured(id){ return S.daily.featured===id; }
  function bonusAvailable(id){ return isFeatured(id)&&!S.daily.challengeBonus[id]; }
  function enter(ch,cat){
    const res=score(ch,cat.outfit); const rec=S.challenges[ch.id]||(S.challenges[ch.id]={best:0,plays:0}); rec.plays++;
    const newStars=Math.max(0,res.awarded-rec.best); const firstPerfect=res.awarded===3&&rec.best<3;
    const rewards={coins:0,xp:0,stars:0,item:null,bonus:false};
    rewards.coins=Math.round(ch.reward.coins*res.total/9*(rec.best>=res.awarded?0.35:1)); rewards.xp=Math.round(ch.reward.xp*(rec.best>=res.awarded?0.4:1)*Math.max(.34,res.total/9));
    rewards.stars=newStars; if(firstPerfect&&ch.reward.item&&!Game.owns(ch.reward.item)) rewards.item=ch.reward.item;
    if(bonusAvailable(ch.id)){ rewards.bonus=true; rewards.coins+=30; rewards.xp+=20; S.daily.challengeBonus[ch.id]=true; }
    rec.best=Math.max(rec.best,res.awarded); rec.lastDate=todayStr();
    Game.addCoins(rewards.coins,"challenge"); Game.addXP(rewards.xp,"challenge"); if(newStars) Game.addStars(newStars,"challenge"); if(rewards.item) Game.grantItem(rewards.item,"challenge");
    Game.addHearts(cat.id,res.awarded>=2?3:1,"challenge"); cat.stats.challenges=(cat.stats.challenges||0)+1; Game.track("challenge",1); if(res.awarded===3) Game.track("challengePerfect",1);
    Save.save(); return {res,rewards,rec};
  }
  return { score, colorRule, unlocked, record, isFeatured, bonusAvailable, enter, COLOR_EMOJI };
})();

/* ---------------- FASHION SHOWS ---------------- */
const Shows = (()=>{
  function available(){ return SHOWS.filter(s=>s.lvl<=Game.level()); }
  function canEnter(show,cat){ const n=Wardrobe.count(cat.outfit); const why=[];
    if(n<show.minItems) why.push(`Wear at least ${show.minItems} items (${n} now)`);
    if(cat.friendship<show.minFriend) why.push(`Friendship ${show.minFriend}+ (${cat.friendship} now)`);
    if(cat.care.energy<show.energy) why.push(`Needs ${show.energy} energy (${Math.round(cat.care.energy)} now) — take a nap!`);
    return {ok:!why.length,why}; }
  function score(show,cat){
    const o=cat.outfit, pts=Wardrobe.rarityPoints(o), th=show.style;
    const style={pts,stars:pts>=th[2]?3:pts>=th[1]?2:pts>=th[0]?1:0,note:`${pts} style points (${th[2]}+ for ★★★)`};
    const sets=Wardrobe.setCounts(o); const bestSet=Object.entries(sets).sort((a,b)=>b[1]-a[1])[0]; const dist=Wardrobe.distinctColors(o);
    let hs=0; const hn=[]; if(bestSet&&bestSet[1]>=2){ hs+=bestSet[1]>=4?3:bestSet[1]-1; const col=COLLECTIONS.find(c=>c.id===bestSet[0]); hn.push(`${bestSet[1]} ${col?col.name:bestSet[0]} pieces${bestSet[1]>=4?" — full set!":""}`); }
    if(dist<=3&&Wardrobe.count(o)>=3){ hs+=1; hn.push(`${dist} colors — coordinated`); } else hn.push(`${dist} colors${dist>3?" (3 or fewer = bonus)":""}`);
    if(dist<=2&&Wardrobe.count(o)>=4) hs+=1;
    const harmony={stars:Math.min(3,hs),note:hn.join(" · ")};
    const m=Game.mood(cat); let cs=(m>=80?2:m>=55?1:0); const cn=[Game.moodInfo(cat).t+" mood"]; if(cat.friendship>=4){ cs+=1; cn.push("Friendship "+cat.friendship); } else cn.push("Friendship "+cat.friendship+" (4+ for a bonus)");
    const fav=CATS[cat.id].favStyle; if(sets[fav]>=2){ cs+=1; cn.push(`loves the ${fav} look`); }
    const charm={stars:Math.min(3,cs),note:cn.join(" · ")};
    const total=style.stars+harmony.stars+charm.stars; const medal=total>=9?"gold":total>=7?"silver":total>=4?"bronze":"none";
    return {style,harmony,charm,total,medal};
  }
  function enter(show,cat){
    const res=score(show,cat); const r=show.rewards[res.medal]; Game.modCare(cat.id,"energy",-show.energy); Game.modCare(cat.id,"fun",8);
    cat.stats.shows++; if(res.medal==="gold"||res.medal==="silver"){ cat.stats.wins++; Game.track("showsWon",1); } if(res.total>=9) Game.track("showsPerfect",1);
    Game.track("show",1); Game.addCoins(r.coins,"show"); Game.addXP(r.xp,"show"); if(r.stars) Game.addStars(r.stars,"show"); Game.addHearts(cat.id,res.medal==="gold"?5:res.medal==="silver"?4:2,"show");
    S.counters["show_"+show.id]=(S.counters["show_"+show.id]||0)+1; Save.save(); return {res,r};
  }

})();

const Shop = (()=>{

  function price(it){ const base=it.cost||0; return isPick(it.id)?Math.max(5,Math.round(base*0.75)):base; }
  function starPrice(it){ return it.rarity==="legendary"?12:(it.rarity==="super"&&it.cost===0?6:0); }
  function canBuy(it){ if(Game.owns(it.id)) return {ok:false,why:"Owned"}; if(it.src!=="shop") return {ok:false,why:it.src==="box"?"Mystery Closet only":it.src==="set"?"Collection reward":"Special reward"}; if((it.lvl||1)>Game.level()) return {ok:false,why:"Level "+(it.lvl||1)}; return {ok:true}; }
  function buy(it){ const c=canBuy(it); if(!c.ok) return {ok:false,why:c.why}; const p=price(it); if(!Game.spendCoins(p)) return {ok:false,why:`Need ${p-S.player.coins} more 🪙`};
    Game.grantItem(it.id,"shop"); Game.track("buy",1); Game.addXP(3,"buy"); return {ok:true,price:p}; }
  function buyScene(sc){ if(Game.ownsScene(sc.id)) return {ok:false,why:"Owned"}; if((sc.lvl||1)>Game.level()) return {ok:false,why:"Level "+(sc.lvl||1)}; if(sc.src!=="shop") return {ok:false,why:"Mystery Closet only"};
    if(!Game.spendCoins(sc.cost)) return {ok:false,why:`Need ${sc.cost-S.player.coins} more 🪙`}; Game.grantScene(sc.id,"shop"); Game.track("buy",1); Game.addXP(3,"buy"); return {ok:true}; }
  function buyFood(f){ if(!Game.spendCoins(f.price)) return {ok:false,why:`Need ${f.price-S.player.coins} more 🪙`}; Game.addFood(f.id,f.pack); Game.track("buy",1); return {ok:true}; }
  function sectionItems(sec){ const lv=Game.level();
    if(sec==="clothes") return ITEMS.filter(i=>["top","bottom","dress","costume","shoes"].includes(i.cat)&&i.src==="shop");
    if(sec==="accessories") return ITEMS.filter(i=>["hat","ears","glasses","makeup","necklace","back","hand"].includes(i.cat)&&i.src==="shop");
    return []; }
  function affordableNow(){ return ITEMS.filter(i=>canBuy(i).ok&&price(i)<=S.player.coins).sort((a,b)=>price(b)-price(a)); }
  return { isPick, price, starPrice, canBuy, buy, buyScene, buyFood, sectionItems, affordableNow };
})();

/* ---------------- MYSTERY CLOSET ---------------- */
const Mystery = (()=>{
  function boxesOpen(){ return BOXES.filter(b=>b.lvl<=Game.level()); }
  function rollRarity(box){ const r=Math.random()*100; let acc=0; for(const k of ["common","cute","rare","super","legendary"]){ acc+=box.odds[k]; if(r<acc) return k; } return "cute"; }
  function pool(rarity){ return ITEMS.filter(i=>i.rarity===rarity&&(i.src==="shop"||i.src==="box")&&!Game.owns(i.id)&&(i.lvl||1)<=Game.level()+2); }
  function scenePool(rarity){ return SCENES.filter(s=>s.rarity===rarity&&(s.src==="shop"||s.src==="box")&&!Game.ownsScene(s.id)); }
  function open(box,free){ // free: null | "daily" | "bonus"
    if(!free){ if(box.cost.coins){ if(!Game.spendCoins(box.cost.coins)) return {ok:false,why:"Not enough coins"}; } else if(!Game.spendStars(box.cost.stars)) return {ok:false,why:"Not enough stars"}; }
    else if(free==="daily") S.daily.freeBox=true; else S.daily.bonusBox=false;
    const rarity=rollRarity(box); const r=Math.random(); let result;
    const ip=pool(rarity), sp=scenePool(rarity);
    if(r<0.08&&box.id!=="cute"){ const n=ri(1,box.id==="star"?4:2); Game.addStars(n,"box"); result={type:"stars",n,rarity:"rare"}; }
    else if(r<0.2||(!ip.length&&!sp.length)){ const mult={common:1,cute:1.2,rare:1.6,super:2.2,legendary:3}[rarity]; const n=Math.round(ri(box.coinsRange[0],box.coinsRange[1])*mult); Game.addCoins(n,"box"); result={type:"coins",n,rarity}; }
    else if(sp.length&&(!ip.length||Math.random()<0.18)){ const sc=pick(sp); Game.grantScene(sc.id,"box"); result={type:"scene",scene:sc,rarity:sc.rarity}; }
    else { const it=pick(ip); const g=Game.grantItem(it.id,"box"); result={type:"item",item:it,rarity:it.rarity,dup:g.dup,coins:g.coins}; }
    Game.track("box",1); Game.addXP(6,"box"); Save.save(); return {ok:true,result};
  }
  return { boxesOpen, open, pool };
})();

/* ---------------- SCHOOL question generators ---------------- */
const School = (()=>{
  const FR={2:"½",3:"⅓",4:"¼",5:"⅕"};
  function choices4(a,gen){ const set=new Set([a]); let g=0; while(set.size<4&&g++<80){ const c=gen(); if(c!==a&&c!==undefined&&c!==null&&!set.has(c)) set.add(c); } return shuffle([...set]); }
  function math(g){ let q,a; const r=Math.random();
    if(g<=1){ if(r<.45){const x=ri(1,12),y=ri(1,12);q=`${x} + ${y}`;a=x+y;} else if(r<.8){const x=ri(3,20),y=ri(1,x);q=`${x} − ${y}`;a=x-y;} else {const x=ri(2,5),y=ri(1,5);q=`${x} × ${y}`;a=x*y;} }
    else if(g===2){ if(r<.32){const x=ri(10,60),y=ri(10,50);q=`${x} + ${y}`;a=x+y;} else if(r<.55){const x=ri(20,99),y=ri(1,x);q=`${x} − ${y}`;a=x-y;} else if(r<.82){const x=ri(2,9),y=ri(2,9);q=`${x} × ${y}`;a=x*y;} else {const y=ri(2,9),k=ri(2,9);q=`${y*k} ÷ ${y}`;a=k;} }
    else if(g===3){ if(r<.28){const x=ri(40,300),y=ri(20,200);q=`${x} + ${y}`;a=x+y;} else if(r<.48){const x=ri(50,300),y=ri(10,x);q=`${x} − ${y}`;a=x-y;} else if(r<.78){const x=ri(2,12),y=ri(2,12);q=`${x} × ${y}`;a=x*y;} else {const y=ri(2,12),k=ri(2,12);q=`${y*k} ÷ ${y}`;a=k;} }
    else if(g===4){ if(r<.3){const x=ri(11,30),y=ri(3,9);q=`${x} × ${y}`;a=x*y;} else if(r<.5){const y=ri(3,12),k=ri(3,15);q=`${y*k} ÷ ${y}`;a=k;} else if(r<.7){const d=[2,3,4,5][ri(0,3)],k=ri(2,9);q=`${FR[d]} of ${d*k}`;a=k;} else if(r<.86){const x=ri(2,9),y=ri(2,9),z=ri(2,6);q=`${x} + ${y} × ${z}`;a=x+y*z;} else {const x=ri(100,500),y=ri(50,400);q=`${x} + ${y}`;a=x+y;} }
    else { if(r<.28){const x=ri(12,40),y=ri(3,12);q=`${x} × ${y}`;a=x*y;} else if(r<.46){const y=ri(4,12),k=ri(6,18);q=`${y*k} ÷ ${y}`;a=k;} else if(r<.64){const d=[2,3,4,5][ri(0,3)],k=ri(3,12);q=`${FR[d]} of ${d*k}`;a=k;} else if(r<.82){const x=ri(3,12),y=ri(2,9),z=ri(2,9);q=`${x} × ${y} + ${z}`;a=x*y+z;} else {const x=ri(200,900),y=ri(100,x-1);q=`${x} − ${y}`;a=x-y;} }
    const deltas=[1,2,3,4,5,6,10,-1,-2,-3,-4,-5,-6,-10];
    return {subject:"math",prompt:q+" = ?",big:true,answer:a,choices:choices4(a,()=>{const c=a+pick(deltas);return c>=0?c:undefined;}),explain:`${q} = ${a}`};
  }
  function misspell(w){ const i=ri(0,w.length-1), r=Math.random(); const letters="abcdefghijklmnopqrstuvwxyz";
    if(r<.35&&w.length>3) return w.slice(0,i)+w.slice(i+1); // drop
    if(r<.65){ let l=pick(letters); while(l===w[i]) l=pick(letters); return w.slice(0,i)+l+w.slice(i+1); } // swap letter
    if(r<.85&&i<w.length-1) return w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2); // transpose
    return w.slice(0,i)+w[i]+w.slice(i); } // double
  function spelling(g){ const list=SPELL_WORDS[clamp(g,1,5)]; const w=pick(list); const em=WORD_EMOJI[w]||"✏️";
    if(Math.random()<.5){ const ch=choices4(w,()=>misspell(w)); return {subject:"spelling",prompt:`${em} Which spelling is right?`,answer:w,choices:ch,explain:`It's spelled "${w}"`}; }
    const i=ri(0,w.length-1); const blank=w.slice(0,i)+"_"+w.slice(i+1); const letters="abcdefghijklmnopqrstuvwxyz"; const a=w[i];
    return {subject:"spelling",prompt:`${em} Fill the missing letter`,big:true,sub:blank.toUpperCase().split("").join(" "),answer:a,choices:choices4(a,()=>pick(letters)),explain:`${w.toUpperCase()} — the missing letter was "${a.toUpperCase()}"`}; }
  function patterns(g){ const r=Math.random();
    if(r<.5||g<=1){ const set=pick(PATTERN_SETS); const L=g<=1?2:Math.min(set.length,g<=3?3:set.length); const base=set.slice(0,L); const seqLen=g<=2?5:7; const seq=[]; const pat=g>=3&&Math.random()<.4?[0,0,1]:null;
      for(let i=0;i<seqLen+1;i++){ seq.push(pat?base[pat[i%3]%base.length]:base[i%base.length]); }
      const a=seq.pop(); return {subject:"patterns",prompt:"What comes next?",sub:seq.join(" ")+" ❓",answer:a,choices:choices4(a,()=>pick(set.concat(["🍪","🎀","🌟"]))),explain:"The pattern repeats: "+base.join(" ")}; }
    const kind=pick(g<=2?["add"]:g<=3?["add","mul"]:["add","mul","sq"]); let seq=[],a; const st=ri(1,g*3);
    if(kind==="add"){ const d=ri(2,g<=2?5:12); seq=[0,1,2,3,4].map(i=>st+i*d); a=st+5*d; }
    else if(kind==="mul"){ const s=ri(1,3); seq=[0,1,2,3].map(i=>s*Math.pow(2,i)); a=s*16; }
    else { seq=[1,4,9,16,25]; a=36; }
    return {subject:"patterns",prompt:"Which number comes next?",big:true,sub:seq.join(", ")+", ?",answer:a,choices:choices4(a,()=>a+pick([1,2,-1,-2,3,-3,5,-5,10])),explain:kind==="add"?`Add ${seq[1]-seq[0]} each time → ${a}`:kind==="mul"?`Double each time → ${a}`:`Square numbers: 6 × 6 = ${a}`}; }
  function memory(g){ const n=clamp(2+g,3,7); const shown=shuffle(MEMORY_EMOJI).slice(0,n); const others=MEMORY_EMOJI.filter(e=>!shown.includes(e));
    if(Math.random()<.5){ const a=pick(shown); return {subject:"memory",memorize:shown,prompt:"Which one did you see?",answer:a,choices:shuffle([a].concat(shuffle(others).slice(0,3))),explain:"You saw: "+shown.join(" ")}; }
    const a=pick(others); return {subject:"memory",memorize:shown,prompt:"Which one was NOT there?",answer:a,choices:shuffle([a].concat(shuffle(shown).slice(0,3))),explain:"You saw: "+shown.join(" ")}; }
  function question(subject,grade){ const g=clamp(grade,1,5); if(subject==="mixed") subject=pick(["math","spelling","patterns","memory"]);
    return ({math,spelling,patterns,memory})[subject](g); }
  return { question };
})();

const FX = (()=>{
  const layer=()=>$("#fx");
  function float(text,x,y,cls){ if(REDUCED_MOTION){ return; } const e=el(`<div class="fx-float ${cls||""}">${text}</div>`); e.style.left=x+"px"; e.style.top=y+"px"; layer().appendChild(e); setTimeout(()=>e.remove(),1300); }
  function floatAt(target,text,cls){ if(!target) return; const r=target.getBoundingClientRect(); float(text,r.left+r.width/2,r.top+r.height/2-6,cls); }
  function burst(x,y,emojis,n){ if(REDUCED_MOTION) return; emojis=emojis||["✨","💖","⭐"]; for(let i=0;i<(n||8);i++){ const e=el(`<div class="fx-p">${emojis[i%emojis.length]}</div>`); const a=Math.random()*Math.PI*2, d=40+Math.random()*70; e.style.left=x+"px"; e.style.top=y+"px"; e.style.setProperty("--dx",Math.cos(a)*d+"px"); e.style.setProperty("--dy",Math.sin(a)*d-30+"px"); e.style.fontSize=(14+Math.random()*14)+"px"; layer().appendChild(e); setTimeout(()=>e.remove(),900); } }
  function burstAt(target,emojis,n){ if(!target) return; const r=target.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,emojis,n); }
  function confetti(n){ if(REDUCED_MOTION) return; const cols=["#FF6FB5","#FFD23F","#36D6B7","#5BC8FF","#9B6BFF","#FF9A52"]; const w=window.innerWidth; for(let i=0;i<(n||60);i++){ const e=el(`<div class="fx-conf"></div>`); e.style.left=(Math.random()*w)+"px"; e.style.background=cols[i%cols.length]; e.style.animationDelay=(Math.random()*.8)+"s"; e.style.animationDuration=(1.6+Math.random()*1.2)+"s"; e.style.setProperty("--r",(Math.random()*720-360)+"deg"); e.style.setProperty("--x",(Math.random()*120-60)+"px"); layer().appendChild(e); setTimeout(()=>e.remove(),3200); } }
  function flash(){ const e=el(`<div class="fx-flash"></div>`); layer().appendChild(e); setTimeout(()=>e.remove(),450); }
  function shake(target){ if(!target) return; target.classList.remove("shake"); void target.offsetWidth; target.classList.add("shake"); setTimeout(()=>target.classList.remove("shake"),450); }
  function pulse(target){ if(!target) return; target.classList.remove("pulse"); void target.offsetWidth; target.classList.add("pulse"); setTimeout(()=>target.classList.remove("pulse"),500); }
  function flyTo(fromEl,toEl,emoji,n){ if(REDUCED_MOTION||!fromEl||!toEl) return; const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect(); for(let i=0;i<(n||5);i++){ const e=el(`<div class="fx-fly">${emoji}</div>`); e.style.left=(a.left+a.width/2)+"px"; e.style.top=(a.top+a.height/2)+"px"; e.style.setProperty("--tx",(b.left+b.width/2-a.left-a.width/2)+"px"); e.style.setProperty("--ty",(b.top+b.height/2-a.top-a.height/2)+"px"); e.style.animationDelay=(i*.07)+"s"; layer().appendChild(e); setTimeout(()=>e.remove(),900+i*70); } }
  return { float, floatAt, burst, burstAt, confetti, flash, shake, pulse, flyTo };
})();

/* ---------------- LIVE CAT controller (idle life + speech) ---------------- */
function LiveCat(container,opts){
  const self={container,opts:opts||{},cat:null,timers:[],expr:null,pose:"stand",dead:false};
  if(!self.opts.minor) LiveCat.current=self;
  self.render=function(o){ o=o||{}; const cat=self.cat=o.cat||Game.activeCat(); if(!cat) return;
    const dirt=cat.care.clean<45?(45-cat.care.clean)/45:0;
    container.innerHTML=Art.cat({cat:cat.id,outfit:o.outfit||cat.outfit,scene:o.scene===undefined?null:o.scene,live:true,pose:o.pose||self.pose,expr:o.expr||self.expr||undefined,dirt:o.noDirt?0:dirt,cls:"special-"+CATS[cat.id].special});
    self.svg=$("svg",container); return self; };
  self.setExpr=function(expr,ms){ self.expr=expr; self.render(self.lastOpts); if(ms){ clearTimeout(self.exprT); self.exprT=setTimeout(()=>{ if(self.dead) return; self.expr=null; self.render(self.lastOpts); },ms); } };
  self.show=function(o){ self.lastOpts=o; return self.render(o); };
  self.look=function(x,y){ const p=self.svg&&$(".p-pupils",self.svg); if(!p) return; p.style.transform=`translate(${clamp(x,-9,9)}px,${clamp(y,-7,7)}px)`; self.svg.classList.add("tracking"); };
  self.unlook=function(){ const p=self.svg&&$(".p-pupils",self.svg); if(p) p.style.transform=""; if(self.svg) self.svg.classList.remove("tracking"); };
  self.anim=function(cls,ms){ if(!self.svg) return; self.svg.classList.remove(cls); void self.svg.offsetWidth; self.svg.classList.add(cls); setTimeout(()=>self.svg&&self.svg.classList.remove(cls),ms||600); };
  self.say=function(text,ms){ const root=self.opts.speechRoot||container.parentElement; let b=$(":scope > .speech",root); if(!b){ b=el(`<div class="speech"></div>`); root.appendChild(b); } b.textContent=text; b.classList.add("show"); clearTimeout(self.sayT); self.sayT=setTimeout(()=>b.classList.remove("show"),ms||2200); };
  self.idle=function(){ // random life: look around, occasional special FX, idle chatter
    self.timers.push(setInterval(()=>{ if(self.dead||!self.svg||self.svg.classList.contains("tracking")) return; if(Math.random()<.5){ const p=$(".p-pupils",self.svg); if(p){ p.style.transition="transform .4s"; p.style.transform=`translate(${ri(-7,7)}px,${ri(-3,4)}px)`; setTimeout(()=>{ if(p.isConnected&&!self.svg.classList.contains("tracking")) p.style.transform=""; },1400); } } },3800));
    self.timers.push(setInterval(()=>{ if(self.dead||!self.svg) return; const sp=CATS[self.cat.id].special; if(Math.random()<.45){ self.anim("do-"+sp,1400); if(sp==="sparkle"||sp==="stars"||sp==="shimmer") FX.burstAt(container,["✨","⭐"],4); if(sp==="bubbles") FX.burstAt(container,["🫧","💗"],4); if(sp==="float") FX.burstAt(container,["🌸","✨"],3); } },7000));
    if(self.opts.chatter!==false) self.timers.push(setInterval(()=>{ if(self.dead||document.hidden) return; if(Math.random()<.6) self.say(Speech.needLine(self.cat)||Speech.line(self.cat,"idle"),2600); },12000));
    return self; };
  self.destroy=function(){ self.dead=true; self.timers.forEach(clearInterval); clearTimeout(self.sayT); clearTimeout(self.exprT); if(LiveCat.current===self) LiveCat.current=null; };
  return self;
}

/* =====================================================================
   ROOMS — decorative SVG scenery for each screen (viewBox 0 0 400 300, slice-fitted)
   ===================================================================== */
const Rooms = (()=>{

/* shared: petting (used by home + care) */
function petCat(live,cat,pointEl,evt){
  const daily=S.daily.counters.pet||0;
  Sfx.purr(); live.anim("do-pet",500);
  const x=evt?evt.clientX:null, y=evt?evt.clientY:null; if(x!=null) FX.burst(x,y,["💖","💕","✨"],5); else FX.burstAt(pointEl,["💖","💕"],5);
  live.setExpr(pick(["happy","love","happy"]),900);
  if(Math.random()<.45) live.say(Speech.line(cat,"pet"),1600);
  cat.stats.pet++; Game.track("pet",1);
  if(daily<10){ Game.addHearts(cat.id,1,"pet"); if(daily===0||daily===4||daily===9) FX.float("+1 💖",x||window.innerWidth/2,(y||300)-30,"heart"); }
  const coinsToday=S.daily.counters.petCoins||0;
  if(coinsToday<3&&Math.random()<.08){ S.daily.counters.petCoins=coinsToday+1; const n=ri(2,5); Game.addCoins(n,"pet"); live.say(pick(["Ooh, I found a coin! 🪙","A shiny thing for you! 🪙"]),1800); }
  if(daily>=10&&daily%10===0) live.say("So many cuddles! 🥰",1500);
}

UI.screen("home",{
  build(node){ node.innerHTML=`<div class="body home">
      <div class="home-scene" id="homeScene">${Rooms.home()}
        <div class="scene-top"><div class="moodpill" id="homeMood"></div><button class="streakpill" id="homeStreak"></button></div>
        <div class="stage-wrap"><div class="stage" id="homeStage"><div class="cat-live" id="homeCat"></div></div></div>
        <div class="scene-bottom"><button class="catname" id="homeCatName"></button><div class="friendmini" id="homeFriend"></div></div>
        <div class="tap-hint" id="tapHint">👆 tap to pet</div>
      </div>
      <div class="nextup" id="nextUp"></div>
      <div class="daily-row">
        <button class="dcard missions" id="cardMissions"></button>
        <button class="dcard challenge" id="cardChallenge"></button>
      </div>
      <div class="tiles" id="tiles"></div>
      <button class="lvlcard" id="lvlCard"></button>
      <div class="foot">🐾 Cat Glam Studio</div></div>`;
    node.addEventListener("click",e=>{
      const t=e.target.closest("[data-go]"); if(t){ const go=t.dataset.go; if(t.classList.contains("locked")){ Sfx.wrong(); FX.shake(t); UI.toast(`🔒 Unlocks at Level ${FEATURES[go]?FEATURES[go].lvl:"?"}`); return; } Sfx.tab(); UI.go(go,t.dataset.mode?{mode:t.dataset.mode}:{}); return; }
      if(e.target.closest("#homeStreak")){ Sfx.tap(); openStreak(); return; }
      if(e.target.closest("#homeCatName")){ Sfx.tap(); UI.go("cathouse"); return; }
      if(e.target.closest("#cardMissions")){ Sfx.tap(); if(!Game.featureOpen("missions")){ UI.toast("🔒 Missions unlock at Level 2"); return; } UI.go("missions"); return; }
      if(e.target.closest("#cardChallenge")){ Sfx.tap(); UI.go("studio",{mode:"challenge:"+Game.featuredChallenge().id}); return; }
      if(e.target.closest("#lvlCard")){ Sfx.tap(); UI.openProfile(); return; }
    });
    $("#homeStage",node).addEventListener("pointerdown",e=>{ if(!this.live) return; petCat(this.live,Game.activeCat(),$("#homeStage",node),e); const h=$("#tapHint",node); if(h) h.classList.add("hide"); });
  },
  enter(node){
    Game.ensureDaily(); Game.tickAll(); const cat=Game.activeCat();
    $("#homeScene",node).querySelector(".room").outerHTML=Rooms.home();
    if(this.live) this.live.destroy(); this.live=new LiveCat($("#homeCat",node),{speechRoot:$("#homeScene",node)}).show({}).idle();
    setTimeout(()=>{ if(UI.current==="home"&&this.live) this.live.say(Speech.needLine(cat)||Speech.line(cat,"greet"),2600); },600);
    this.refresh(node); this.unsub=[Bus.on("coins",()=>this.refreshCards(node)),Bus.on("mission",()=>this.refreshCards(node)),Bus.on("care",()=>this.refreshMood(node)),Bus.on("hearts",()=>this.refreshMood(node)),Bus.on("levelup",()=>setTimeout(()=>this.refresh(node),50))];
    if(S.settings.hints&&(S.counters.pet||0)<3) $("#tapHint",node).classList.remove("hide"); else $("#tapHint",node).classList.add("hide");
  },
  leave(){ if(this.live){ this.live.destroy(); this.live=null; } (this.unsub||[]).forEach(u=>u()); },
  refreshMood(node){ const cat=Game.activeCat(); const mi=Game.moodInfo(cat); $("#homeMood",node).innerHTML=`<span>${mi.e}</span> ${mi.t}`; $("#homeFriend",node).innerHTML=`💖 ${cat.friendship} ${C.bar(cat.hearts/heartsToNext(cat.friendship)*100,"pink")}`; },
  refreshCards(node){
    const ms=S.daily.missions||[], done=ms.filter(m=>m.done).length, chest=Game.missionsAllDone()&&!S.daily.chestClaimed;
    const mOpen=Game.featureOpen("missions");
    $("#cardMissions",node).innerHTML=mOpen?`<div class="dc-ico">${chest?"🎁":"🎯"}</div><div class="dc-mid"><b>Daily Missions</b><small>${chest?"Chest ready — tap to open!":done===3?"All done for today!":`${done}/3 complete`}</small>${C.bar(done/3*100,"mint")}</div>${chest?'<span class="rdot">!</span>':""}`
      :`<div class="dc-ico">🔒</div><div class="dc-mid"><b>Daily Missions</b><small>Unlocks at Level 2</small></div>`;
    const f=Game.featuredChallenge(), rec=Challenges.record(f.id), bonus=Challenges.bonusAvailable(f.id);
    $("#cardChallenge",node).innerHTML=`<div class="dc-ico">${f.emoji}</div><div class="dc-mid"><b>Challenge</b><small>${esc(f.name)}</small><small>${bonus?"+30 🪙 today":"done today ✓"}</small>${C.stars(rec.best)}</div>${bonus?'<span class="rdot">!</span>':""}`;
    const nu=NextUp.suggest(); const nuEl=$("#nextUp",node);
    if(nu&&S.settings.hints){ nuEl.innerHTML=`<span class="nu-ico">${nu.emoji}</span><div class="nu-txt"><small>What's next?</small><b>${esc(nu.text)}</b></div><button class="bigbtn mini pink" data-go="${nu.go==="streak"?"home":nu.go}" ${nu.mode?`data-mode="${nu.mode}"`:""} id="nuBtn">${nu.cta}</button>`; nuEl.classList.remove("hide");

    else nuEl.classList.add("hide");
    const si=Game.streakInfo(); $("#homeStreak",node).innerHTML=`🔥 ${si.claimable?"<b>Gift!</b>":`<b>${S.streak.day}</b> day${S.streak.day===1?"":"s"}`}`; $("#homeStreak",node).classList.toggle("due",si.claimable);

/* daily streak modal */
function openStreak(){
  const info=Game.streakInfo(); const st=S.streak;
  const cells=STREAK_REWARDS.map((r,i)=>{ const d=i+1; const claimed=info.claimable?(info.broken?false:d<info.nextDay):d<=st.day; const isToday=info.claimable&&d===info.nextDay;
    return `<div class="day ${isToday?"today":claimed?"claimed":"locked"}"><div class="dn">Day ${d}</div><div class="dr">${r.box?"🎁":r.stars?"🌟":"🪙"}</div><div class="da">${r.coins}🪙${r.stars?` +${r.stars}⭐`:""}</div></div>`; }).join("");
  const ov=UI.modal({title:"Daily Gift 🔥",html:`<p class="center">Come back every day for bigger gifts. Day 7 = a bonus mystery box!</p>${info.broken?'<p class="center small">Your streak reset — let\'s start a new one! 💪</p>':""}<div class="streak-row">${cells}</div>`,
    buttons:[{label:info.claimable?`🎀 Claim Day ${info.nextDay}!`:"✅ Come back tomorrow!",cls:info.claimable?"pink":"ghost",keep:true,act:(o)=>{ if(!info.claimable) return false; const r=Game.claimStreak(); Sfx.chest(); FX.confetti(30); FX.burstAt($(".day.today",o),["🪙","⭐","✨"],8); UI.toast(`Day ${r.day}! +${r.r.coins} 🪙${r.r.stars?` +${r.r.stars} ⭐`:""}${r.r.box?" + bonus box 🎁":""}`,2600); setTimeout(()=>{ o.close(); if(UI.current==="home") UI.rebuild("home"); },700); return false; }}]});
}

  /* ---------- BATH (soap → scrub → rinse) ---------- */
  bath(){ const c=this.cat(); this.mode="bath"; this.setBusy(true); const room=$("#careRoom",this.node); room.classList.add("bathing"); const L=this.layer(); const st=()=>$("#careStage",this.node).getBoundingClientRect(), rm=()=>room.getBoundingClientRect();
    L.appendChild(el(`<div class="tub"></div>`)); this.live.setExpr("wow",1200); Sfx.splash();
    let phase=1, popped=0, scrubbed=0, rinsed=0; const NB=6, ND=4, NR=3; const total=NB+ND*2+NR; const step=()=>this.prog((popped+scrubbed+rinsed)/total*100);
    this.hint("🫧 Pop the bubbles to soap up!"); step();
    const spawnBubble=()=>{ if(this.mode!=="bath"||phase!==1) return; const s=st(),r=rm(); const b=el(`<div class="bubble">🫧</div>`); b.style.left=(s.left-r.left+s.width*(0.1+Math.random()*0.8))+"px"; b.style.top=(s.top-r.top+s.height*(0.25+Math.random()*0.55))+"px"; b.style.fontSize=(26+Math.random()*16)+"px";
      b.addEventListener("pointerdown",e=>{ e.stopPropagation(); if(b._d||phase!==1) return; b._d=1; popped++; Sfx.bubble(); FX.burst(e.clientX,e.clientY,["🫧","✨"],4); b.remove(); const foam=el(`<div class="foam"></div>`); foam.style.left=b.style.left; foam.style.top=b.style.top; L.appendChild(foam); step(); if(Math.random()<.3) this.live.setExpr("happy",700);
        if(popped>=NB) startScrub(); else spawnBubble(); });
      L.appendChild(b); this.after(2400,()=>{ if(b.isConnected&&!b._d){ b.remove(); spawnBubble(); } }); };
    for(let i=0;i<3;i++) this.after(i*250,spawnBubble);

      [[0.34,0.5],[0.62,0.56],[0.66,0.24],[0.4,0.22]].forEach(([fx,fy],i)=>{ const d=el(`<div class="dirt"><span></span></div>`); d.style.left=(s.left-r.left+s.width*fx)+"px"; d.style.top=(s.top-r.top+s.height*fy)+"px"; let hits=0;

        if(rinsed>=NR){ sh.remove(); finish(); } }); };
    const finish=()=>{ if(phase!==3) return; phase=4; $$(".foam,.dirt",L).forEach(x=>x.remove()); this.hint(""); Sfx.win(); FX.burstAt($("#careStage",this.node),["✨","🌟","💖"],12);

  play(toy){ const c=this.cat(); this.mode="play"; this.setBusy(true); const room=$("#careRoom",this.node); room.classList.add("playing"); const L=this.layer(); const st=()=>$("#careStage",this.node).getBoundingClientRect(), rm=()=>room.getBoundingClientRect();

    else if(toy.id==="mouse"){ const spawn=()=>{ if(this.mode!=="play") return; $$(".mouse",L).forEach(m=>m.remove()); const cb=catBox(); const m=el(`<div class="mouse">🐭</div>`); m.style.left=(cb.x-cb.w*.2+Math.random()*cb.w*1.3)+"px"; m.style.top=(cb.y+cb.h*(0.3+Math.random()*0.55))+"px"; if(Math.random()<.5) m.style.transform="scaleX(-1)";
        m.addEventListener("pointerdown",e=>{ e.stopPropagation(); m.remove(); Sfx.catch(); FX.burst(e.clientX,e.clientY,["💨","✨"],4); bump(1); this.live.anim("do-jump",500); this.live.setExpr("wow",400); }); L.appendChild(m); }; spawn(); this.every(950,spawn); }
    else if(toy.id==="feather"){ const f=el(`<div class="feather">🪶</div>`); const cb=catBox(); f.style.left=(cb.x+cb.w*.85)+"px"; f.style.top=(cb.y+cb.h*.3)+"px"; L.appendChild(f); let last=0;
      const move=e=>{ const r=rm(); const x=e.clientX-r.left,y=e.clientY-r.top; f.style.left=x+"px"; f.style.top=y+"px"; const cb=catBox(); this.live.look((x-(cb.x+cb.w/2))/cb.w*22,(y-(cb.y+cb.h*.3))/cb.h*18); if(x>cb.x&&x<cb.x+cb.w&&y>cb.y&&y<cb.y+cb.h&&Date.now()-last>500){ last=Date.now(); bump(1); Sfx.tick(); this.live.anim("do-wiggle",400); FX.burst(e.clientX,e.clientY,["💖","✨"],2); } };
      L.onpointermove=move; L.onpointerdown=move; }
    else if(toy.id==="ball"){ const cb=catBox(); const b=el(`<div class="ball">🎾</div>`); b.style.left=(cb.x+cb.w*.1)+"px"; b.style.top=(cb.y+cb.h*.8)+"px"; L.appendChild(b); let busy=false;
      b.addEventListener("pointerdown",e=>{ e.stopPropagation(); if(busy) return; busy=true; const cb=catBox(); const left=parseFloat(b.style.left)<cb.x+cb.w/2; b.classList.add(left?"toss-r":"toss-l"); Sfx.whoosh(); this.after(350,()=>{ this.live.anim("do-jump",600); Sfx.boing(); bump(1); }); this.after(900,()=>{ b.classList.remove("toss-r","toss-l"); b.style.left=(left?cb.x+cb.w*.9:cb.x+cb.w*.1)+"px"; busy=false; }); }); }
    const finish=()=>{ if(this.mode!=="play") return; const gain=Math.round(12+Math.min(goal,score)/goal*28); const fav=CATS[c.id].favActivity; const isFav=fav==="play"||fav==="play"+toy.id.charAt(0).toUpperCase()+toy.id.slice(1);
      Game.modCare(c.id,"fun",gain); Game.modCare(c.id,"energy",-6); Game.addHearts(c.id,(score>=goal?3:2)+(isFav?2:0),"play"); Game.addXP(5+Math.round(score/goal*5),"play"); c.stats.play++; Game.track("play",1); Game.caredFor(c.id);
      this.hint(""); Sfx.win(); FX.burstAt($("#careStage",this.node),["💖","🎉","✨"],10); this.live.unlook(); this.live.setExpr("happy",1800); this.live.say(Speech.line(c,"played"),2200);
      L.onpointermove=null; L.onpointerdown=null; $$(".laser,.yarn,.mouse,.feather,.ball,.play-timer",L).forEach(x=>x.remove()); this.timers.forEach(t=>{clearTimeout(t);clearInterval(t);}); this.timers=[]; this.after(1400,()=>this.endMode()); };
  },
  /* ---------- SLEEP ---------- */
  sleep(){ const c=this.cat(); this.mode="sleep"; this.setBusy(true); const room=$("#careRoom",this.node); room.classList.add("sleeping"); const L=this.layer();
    this.live.pose="sleep"; this.live.show({pose:"sleep"}); Sfx.zzz(); this.hint("😴 Shh… napping"); 
    L.appendChild(el(`<div class="zzz"><span>z</span><span>Z</span><span>Z</span></div><div class="moonlight">🌙</div>`)); const wake=el(`<button class="chipbtn wake">⏰ Wake up</button>`); L.appendChild(wake);
    const start=c.care.energy, need=100-start, dur=Math.max(2500,Math.min(7000,need*70)); const t0=Date.now();
    const iv=this.every(120,()=>{ const p=Math.min(1,(Date.now()-t0)/dur); c.care.energy=start+need*p; this.refreshStats(); this.prog(p*100); if(p>=1){ clearInterval(iv); done(true); } });
    wake.addEventListener("click",()=>{ clearInterval(iv); done(false); });
    const done=(full)=>{ if(this.mode!=="sleep") return; Game.modCare(c.id,"energy",0); Game.modCare(c.id,"hunger",-3); Game.addHearts(c.id,full?2:1,"sleep"); Game.addXP(full?4:2,"sleep"); Game.track("sleep",1); Game.caredFor(c.id);
      this.live.pose="stand"; this.live.show({}); this.live.setExpr("happy",1500); this.live.say(full?"Yawn! All rested! ⚡":"Mmm… five more minutes? ⚡",2000); Sfx.sparkle(); this.endMode(); };
  }
});

const WARDROBE_TABS=[{k:"hat",e:"👒",l:"Hats"},{k:"ears",e:"🎀",l:"Ears"},{k:"glasses",e:"🕶️",l:"Glasses"},{k:"makeup",e:"💄",l:"Makeup"},{k:"necklace",e:"💎",l:"Neck"},{k:"top",e:"👕",l:"Tops"},{k:"bottom",e:"🩳",l:"Bottoms"},{k:"dress",e:"👗",l:"Dresses"},{k:"costume",e:"🦄",l:"Costumes"},{k:"shoes",e:"👟",l:"Shoes"},{k:"back",e:"🦋",l:"Back"},{k:"hand",e:"🪄",l:"Hand"},{k:"scene",e:"🏞️",l:"Scene"}];

UI.screen("studio",{ title:"Glam Studio",
  build(node){ node.innerHTML=`<div class="body studio">

    node.addEventListener("click",e=>{
      const a=e.target.closest("[data-act]"); if(a){ this.action(a.dataset.act,a); return; }

      const none=e.target.closest("[data-none]"); if(none){ Sfx.pop(); if(this.tab==="scene") return; Wardrobe.equip(this.cat(),this.tab,null); this.renderCat(); this.renderItems(); this.updateChallengeBar(); return; }

    });

  },
  cat(){ return Game.activeCat(); },
  enter(node,p){ this.node=node; this.mode=null; this.challenge=null; this.stickers=[]; this.pose="stand"; this.tab=this.tab||"hat"; Game.ensureDaily();
    if(this.live) this.live.destroy(); this.live=new LiveCat($("#studioCat",node),{chatter:false,speechRoot:$("#studioTop",node)}); this.renderCat(); this.live.idle();

  hidePanels(){ ["#challengeBar","#presetsBar","#photoPanel"].forEach(s=>$(s,this.node).classList.add("hide")); $("#wardrobe",this.node).classList.remove("hide"); $("#studioFabs",this.node).classList.remove("hide"); $(".challenge-fab",this.node).classList.remove("hide"); $("#studioTop",this.node).classList.remove("photo"); this.mode=null; },
  renderCat(){ const c=this.cat(); this.live.pose=this.pose; this.live.show({scene:null,pose:this.pose,noDirt:true}); const sb=$("#studioScene",this.node); if(sb&&sb.dataset.scene!==c.scene){ sb.dataset.scene=c.scene; sb.innerHTML=Art.sceneThumb(c.scene); } },
  renderTabs(){ const t=$("#wtabs",this.node); t.innerHTML=WARDROBE_TABS.map(x=>{ const n=x.k==="scene"?0:ITEMS.filter(i=>i.cat===x.k&&S.newItems.includes(i.id)&&Game.owns(i.id)).length; return `<button class="wtab ${this.tab===x.k?"on":""}" data-tab="${x.k}"><span class="we">${x.e}</span>${x.l}${n?`<i class="ndot">${n}</i>`:""}</button>`; }).join(""); const on=$(".wtab.on",t); if(on) on.scrollIntoView({inline:"center",block:"nearest"}); },

    box.innerHTML=`<button class="tile none ${isNone?"eq":""}" data-none="1"><span class="me">🚫</span><small>None</small></button>`+owned.map(i=>C.itemTile(i,{equipped:c.outfit[this.tab]===i.id})).join("")+`<button class="tile more" data-act="shopTab"><span class="me">🛍️</span><small>Get more</small></button>`;
  },
  tapItem(id){ const c=this.cat(); const it=Game.item(id); const was=c.outfit[it.cat]===id; Wardrobe.equip(c,it.cat,was?null:id); Sfx.equip(); this.live.anim("do-bounce",500); this.renderCat(); this.renderItems(); this.renderTabs(); this.updateChallengeBar();
    if(!was){ FX.burstAt($("#studioStage",this.node),["✨","💖"],4); if(Math.random()<.5) this.live.say(Speech.line(c,it.cat==="hat"?"hat":"outfit"),1500); } },
  tapScene(id){ const c=this.cat(); c.scene=id; Save.save(); Sfx.equip(); this.renderCat(); this.renderItems(); },
  action(k,btn){ const c=this.cat();
    switch(k){
      case "surprise": Sfx.pop(); Wardrobe.randomOutfit(c); this.live.anim("do-twirl",900); this.renderCat(); this.renderItems(); this.updateChallengeBar(); this.live.say("Ooh, surprise me! 🎲",1400); break;

      case "presets": Sfx.tab(); if(!Game.featureOpen("presets")){ UI.toast("🔒 Outfit presets unlock at Level 2"); return; } this.togglePresets(); break;

      case "sticker": this.addSticker(btn.dataset.id); break;
      case "clearStickers": Sfx.pop(); this.stickers=[]; this.renderStickers(); break;
    } },
  /* ---------- presets ---------- */
  togglePresets(){ const bar=$("#presetsBar",this.node); if(!bar.classList.contains("hide")){ bar.classList.add("hide"); return; } this.renderPresets(); bar.classList.remove("hide"); },
  renderPresets(){ const c=this.cat(); $("#presetsBar",this.node).innerHTML=`<div class="pb-t">🧷 Outfit presets <small>tap to wear · hold Save to overwrite</small></div><div class="pb-row">${PRESET_SLOTS.map(s=>{ const p=c.presets[s.k]; return `<div class="preset ${p?"has":""}"><button class="pthumb" data-preset="${s.k}" data-op="wear">${p?Art.cat({cat:c.id,outfit:p,expr:"happy"}):`<span class="pe">${s.e}</span>`}</button><small>${s.l}</small><button class="psave" data-preset="${s.k}" data-op="save">${p?"Save":"+ Save"}</button></div>`; }).join("")}</div>`; },

  openChallengeList(){ const list=Challenges.unlocked(); const locked=CHALLENGES.filter(c=>c.lvl>Game.level()).slice(0,2);

  updateChallengeBar(){ if(this.mode!=="challenge"||!this.challenge) return; const ch=this.challenge, c=this.cat(), res=Challenges.score(ch,c.outfit); const cr=Challenges.colorRule(ch);

      const rw=out.rewards; $("#jrewards",ov).innerHTML=UI.rewardChips({coins:rw.coins,xp:rw.xp,stars:rw.stars,item:rw.item})+(rw.bonus?'<div class="bonus">🌟 Daily challenge bonus!</div>':"");
      if(r.awarded===3){ Sfx.fanfare(); FX.confetti(60); this.live.say(Speech.line(c,"win"),2000); } else if(r.awarded>=1){ Sfx.win(); } else { Sfx.lose(); this.live.say(Speech.line(c,"lose"),2000); }
      $(".mbtns",ov).style.visibility="visible"; },3200); },
  /* ---------- photo mode ---------- */
  startPhoto(){ this.hidePanels(); this.mode="photo"; $("#wardrobe",this.node).classList.add("hide"); $("#studioFabs",this.node).classList.add("hide"); $(".challenge-fab",this.node).classList.add("hide"); $("#studioTop",this.node).classList.add("photo"); $("#photoPanel",this.node).classList.remove("hide"); this.ptab=this.ptab||"scene"; this.renderPhotoPanel(); this.renderStickers(); this.live.say("Say cheese! 📸",1500); },

  renderPhotoPanel(){ const c=this.cat(); const p=$("#photoPanel",this.node); const tabs=[["scene","🏞️ Scene"],["pose","🐱 Pose"],["stickers","✨ Stickers"]];
    let body=""; if(this.ptab==="scene"){ body=`<div class="prow">${SCENES.filter(s=>Game.ownsScene(s.id)).map(s=>`<button class="ptile ${c.scene===s.id?"on":""}" data-act="photoScene" data-id="${s.id}">${Art.sceneThumb(s.id)}<small>${esc(s.name)}</small></button>`).join("")}</div>`; }

  answer(btn){ const ss=this.session; if(!ss||ss.locked) return; ss.locked=true; const q=ss.cur; const val=btn.dataset.c; const ok=String(val)===String(q.answer); const fb=$("#ssFb",this.node); ss.answers.push(ok);

const GAMES=[

  build(node){ node.innerHTML=`<div class="body playroom">${Rooms.playroom()}<div class="pr-list" id="prList"></div><div class="arena hide" id="arena"></div></div>`;

  enter(node){ this.node=node; this.stop(); this.renderList(); },
  leave(){ this.stop(); UI.setBusy(false); },
  renderList(){ $("#arena",this.node).classList.add("hide"); const l=$("#prList",this.node); l.classList.remove("hide"); const mg=S.daily.minigame||{};
    l.innerHTML=`<div class="pr-intro">🎮 Play for coins & XP · full rewards for the first 3 plays of each game per day</div><div class="game-grid">${GAMES.map(g=>{ const best=(S.counters["best_"+g.id]||0); const plays=mg[g.id]||0; const locked=g.lvl>Game.level(); return `<button class="gamecard ${locked?"locked":""}" data-game="${g.id}"><span class="ge">${locked?"🔒":g.emoji}</span><b>${g.name}</b><small>${locked?"Unlocks at Level "+g.lvl:esc(g.desc)}</small>${locked?"":`<div class="gmeta"><span>🏆 best ${best}</span><span>${plays<3?`${3-plays} bonus play${3-plays===1?"":"s"}`:"bonus used"}</span></div>`}</button>`; }).join("")}</div><div class="pr-note">🛁 Bubble Bath lives in the Care Room — it counts as play too!</div>`; },
  stop(){ (this.timers||[]).forEach(t=>{clearTimeout(t);clearInterval(t);}); this.timers=[]; if(this.raf) cancelAnimationFrame(this.raf); this.raf=null; this.running=false; const a=$("#arena",this.node); if(a){ a.onpointermove=null; a.onpointerdown=null; } },
  after(ms,fn){ const t=setTimeout(fn,ms); this.timers.push(t); return t; }, every(ms,fn){ const t=setInterval(fn,ms); this.timers.push(t); return t; },
  launch(game){ this.stop(); $("#prList",this.node).classList.add("hide"); const a=$("#arena",this.node); a.classList.remove("hide"); a.className="arena g-"+game.id; UI.setBusy(true);
    a.innerHTML=`<div class="ar-top"><span class="ar-score">⭐ <b id="arScore">0</b></span><span class="ar-time" id="arTime">${game.secs?"⏱ "+game.secs:""}</span><button class="iconbtn small" data-quit="1">✕</button></div><div class="ar-field" id="arField"></div><div class="ar-count" id="arCount">3</div>`;
    let n=3; const cnt=$("#arCount",a); Sfx.tick(); const iv=this.every(700,()=>{ n--; if(n<=0){ clearInterval(iv); cnt.textContent="GO!"; Sfx.win(); this.after(400,()=>{ cnt.classList.add("hide"); this.running=true; this["game_"+game.id](game); }); } else { cnt.textContent=n; Sfx.tick(); } }); },
  setScore(s){ this.score=s; const e=$("#arScore",this.node); if(e) e.textContent=s; },
  timer(game,onEnd){ let t=game.secs; const te=$("#arTime",this.node); this.every(1000,()=>{ if(!this.running) return; t--; te.textContent="⏱ "+Math.max(0,t); if(t<=5&&t>0) Sfx.tick(); if(t<=0){ this.running=false; onEnd(); } }); },
  finish(game,score,extra){ this.stop(); const mg=S.daily.minigame||(S.daily.minigame={}); const plays=mg[game.id]||0; mg[game.id]=plays+1; const full=plays<3; const c=Game.activeCat();
    let coins=0; if(game.id==="memory") coins=Math.max(6,30-Math.max(0,extra.moves-8)*2); else coins=Math.min(40,Math.round(score*(game.id==="yarn"?2:game.id==="sort"?2:1.6)));
    if(!full) coins=Math.round(coins*0.3); const xp=8+Math.min(20,Math.round(score/2)); const best=S.counters["best_"+game.id]||0; const isBest=score>best; if(isBest) S.counters["best_"+game.id]=score;
    Game.addCoins(coins,"minigame"); Game.addXP(xp,"minigame"); Game.track("minigame",1); Game.modCare(c.id,"fun",10); Game.addHearts(c.id,1,"minigame"); Save.save();
    if(isBest&&best>0){ Sfx.fanfare(); FX.confetti(40); } else Sfx.win();
    UI.modal({cls:"celebrate",noClose:true,onClose:()=>UI.setBusy(false),html:`<div class="big-emoji">${game.emoji}</div><h2>${game.name}</h2><div class="score-big">${score}${game.id==="memory"?` <small>(${extra.moves} flips)</small>`:""}</div>${isBest&&best>0?'<div class="bonus">🏆 New best score!</div>':`<small>best ${Math.max(best,score)}</small>`}${UI.rewardChips({coins,xp,hearts:1})}${full?"":'<small class="rc-note">Bonus plays used for today — reduced coins</small>'}`,buttons:[{label:"🔁 Play again",cls:"sky",act:()=>this.launch(game)},{label:"🎮 Other games",cls:"ghost",act:()=>this.renderList()}]}); },
  /* --- Laser Chase --- */
  game_laser(game){ const f=$("#arField",this.node); let score=0,combo=0,interval=1100; this.setScore(0); const dot=el(`<div class="laserdot"></div>`); f.appendChild(dot);
    const move=()=>{ const r=f.getBoundingClientRect(); dot.style.left=(8+Math.random()*84)+"%"; dot.style.top=(8+Math.random()*84)+"%"; dot.classList.remove("hit"); };
    let auto; const sched=()=>{ auto=this.after(interval,()=>{ if(!this.running) return; combo=0; move(); sched(); }); };
    dot.addEventListener("pointerdown",e=>{ if(!this.running) return; e.stopPropagation(); score++; combo++; if(combo%5===0){ score+=2; FX.float("+2 combo!",e.clientX,e.clientY-20,"coin"); Sfx.star(); } else Sfx.laser(); FX.burst(e.clientX,e.clientY,["✨","💥"],3); this.setScore(score); dot.classList.add("hit"); clearTimeout(auto); interval=Math.max(520,interval-18); this.after(120,()=>{ move(); sched(); }); });
    f.onpointerdown=()=>{ if(this.running) Sfx.miss(); }; move(); sched(); this.timer(game,()=>this.finish(game,score)); },
  /* --- Catch the Yarn --- */
  game_yarn(game){ const f=$("#arField",this.node); let score=0; this.setScore(0); const basket=el(`<div class="basket">🧺</div>`); f.appendChild(basket); let bx=50; basket.style.left="50%";
    const setX=(clientX)=>{ const r=f.getBoundingClientRect(); bx=clamp((clientX-r.left)/r.width*100,8,92); basket.style.left=bx+"%"; };
    f.onpointermove=e=>{ if(e.buttons||e.pointerType==="touch") setX(e.clientX); }; f.onpointerdown=e=>setX(e.clientX);
    const items=[]; let speed=2.4, t0=performance.now();
    const spawn=()=>{ if(!this.running) return; const r=Math.random(); const kind=r<.12?"fish":r<.2?"sock":"yarn"; const e=el(`<div class="fall ${kind}">${kind==="fish"?"🐟":kind==="sock"?"🧦":"🧶"}</div>`); const x=8+Math.random()*84; e.style.left=x+"%"; f.appendChild(e); items.push({e,x,y:-8,kind,v:(speed+Math.random()*1.2)/60}); this.after(Math.max(420,900-score*12),spawn); };
    spawn();
    const loop=()=>{ if(!this.running) return; for(let i=items.length-1;i>=0;i--){ const it=items[i]; it.y+=it.v*100; it.e.style.top=it.y+"%"; if(it.y>=84&&it.y<96){ if(Math.abs(it.x-bx)<11){ items.splice(i,1); it.e.remove(); if(it.kind==="yarn"){ score++; Sfx.catch(); } else if(it.kind==="fish"){ score+=3; Sfx.star(); FX.floatAt(basket,"+3 🐟","coin"); } else { Sfx.miss(); FX.floatAt(basket,"eww 🧦",""); } this.setScore(score); FX.burstAt(basket,["✨"],2); continue; } } if(it.y>110){ items.splice(i,1); it.e.remove(); } } this.raf=requestAnimationFrame(loop); };
    this.raf=requestAnimationFrame(loop); this.timer(game,()=>{ items.forEach(it=>it.e.remove()); this.finish(game,score); }); },
  /* --- Memory Cards --- */
  game_memory(game){ const f=$("#arField",this.node); const pairs=shuffle(MEMORY_EMOJI).slice(0,6); const deck=shuffle(pairs.concat(pairs)); let open=[],moves=0,matched=0,lock=false; this.setScore(0); $("#arTime",this.node).textContent="🔁 0 flips";
    f.innerHTML=`<div class="memgrid">${deck.map((e,i)=>`<button class="mcard" data-i="${i}"><span class="front">${e}</span><span class="back">🐾</span></button>`).join("")}</div>`;
    $$(".mcard",f).forEach(card=>card.addEventListener("click",()=>{ if(!this.running||lock||card.classList.contains("up")) return; card.classList.add("up"); Sfx.flip(); open.push(card);
      if(open.length===2){ moves++; $("#arTime",this.node).textContent="🔁 "+moves+" flips"; lock=true; const [a,b]=open; if(deck[+a.dataset.i]===deck[+b.dataset.i]){ matched++; this.setScore(matched); Sfx.correct(); FX.burstAt(b,["✨","💖"],4); a.classList.add("done"); b.classList.add("done"); open=[]; lock=false; if(matched===6){ this.running=false; this.after(500,()=>this.finish(game,Math.max(1,30-Math.max(0,moves-6)*2),{moves})); } } else { this.after(750,()=>{ a.classList.remove("up"); b.classList.remove("up"); open=[]; lock=false; }); } } })); },
  /* --- Fashion Sort --- */
  game_sort(game){ const f=$("#arField",this.node); let score=0,lock=false; this.setScore(0); const cats=["hat","glasses","necklace","top","bottom","dress","shoes","hand","back","costume"];
    const pool=ITEMS.filter(i=>cats.includes(i.cat)); const next=()=>{ if(!this.running) return; const it=pick(pool); const others=shuffle(cats.filter(c=>c!==it.cat)).slice(0,2); const opts=shuffle([it.cat].concat(others));
      f.innerHTML=`<div class="sortcard r-${it.rarity}"><div class="sc-thumb">${Art.itemThumb(it)}</div><b>${esc(it.name)}</b></div><div class="sortopts">${opts.map(c=>`<button class="bigbtn sky" data-c="${c}">${SLOT_META[c].emoji} ${SLOT_META[c].label}</button>`).join("")}</div>`; lock=false;
      $$("[data-c]",f).forEach(b=>b.addEventListener("click",()=>{ if(lock||!this.running) return; lock=true; if(b.dataset.c===it.cat){ score++; this.setScore(score); Sfx.correct(); FX.burstAt(b,["✅","✨"],3); this.after(220,next); } else { Sfx.wrong(); FX.shake(b); b.classList.add("wrongopt"); this.after(500,next); } })); };
    next(); this.timer(game,()=>this.finish(game,score)); }
});

  ov.addEventListener("click",e=>{ const t=e.target.closest("[data-item]"); if(!t) return; const it=Game.item(t.dataset.item); ov.close(); if(Game.owns(it.id)){ Wardrobe.equip(Game.activeCat(),it.cat,it.id); Sfx.equip(); UI.go("studio"); } else if(Shop.canBuy(it).ok){ UI.go("shop",{tab:["top","bottom","dress","costume","shoes"].includes(it.cat)?"clothes":"accessories",slot:it.cat}); } else UI.toast(it.src==="box"?"🎁 Find this in the Mystery Closet!":"🏅 Earned from a challenge or friendship gift"); });
  return ov; }
