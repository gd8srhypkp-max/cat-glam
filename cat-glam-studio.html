<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2B1F4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cat Glam Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style id="cgs-style">
/* ===== Cat Glam Studio — base system ===== */
:root{
  --pink:#FF6FB5;--pink-deep:#F0479A;--yellow:#FFD23F;--mint:#36D6B7;--sky:#5BC8FF;--purple:#9B6BFF;--orange:#FF9A52;--teal:#22C9A8;--lav:#B18CFF;--red:#FF6B8A;
  --ink:#4A3466;--ink-soft:#8A74B0;--ink-faint:#B8A9CF;--cream:#FFF7FB;--card:#FFFFFF;--line:#F0E4F7;
  --shadow:0 10px 26px rgba(122,70,150,.20);--shadow-sm:0 4px 12px rgba(122,70,150,.16);--radius:22px;--app-w:560px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:"Baloo 2","Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#2B1F4A;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;font-size:15px;line-height:1.3;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#5A3D8A 0,transparent 45%),radial-gradient(circle at 80% 90%,#3B2A6E 0,transparent 45%),#2B1F4A;z-index:0;}
h1,h2,h3{font-family:"Fredoka",sans-serif;font-weight:700;margin:0;line-height:1.15;}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;padding:0;font-size:inherit;}
button:disabled{opacity:.55;cursor:default;filter:grayscale(.3);}
input,textarea{font-family:inherit;}
small{font-size:.82em;}
.hide{display:none !important;}
.center{text-align:center;}
.spacer{flex:1;}

/* ---- app frame ---- */
#app{position:fixed;inset:0;display:flex;justify-content:center;z-index:1;}
#frame{width:100%;max-width:var(--app-w);height:100%;position:relative;transform:translateZ(0);display:flex;flex-direction:column;background:linear-gradient(160deg,#FFF4FA 0%,#F3EEFF 55%,#EAFBFF 100%);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.35);}
@media (min-width:600px){#frame{border-radius:28px;height:calc(100% - 24px);margin-top:12px;}}
#screens{flex:1;position:relative;min-height:0;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;animation:screenIn .3s ease;}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;padding:10px 14px calc(22px + var(--safe-b));}
.body::-webkit-scrollbar{width:6px}.body::-webkit-scrollbar-thumb{background:#DCCDEB;border-radius:8px}
.body > .room{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.body > *:not(.room){position:relative;z-index:1;}
.room{display:block;}
body[data-screen="onboard"] #hudbar{display:none;}

/* ---- HUD ---- */
#hudbar{flex:0 0 auto;padding-top:var(--safe-t);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.7);z-index:5;}
.hud{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:58px;}
.hud-back{font-size:30px;font-weight:700;width:40px;height:40px;line-height:1;color:var(--pink-deep);}
body.is-home .hud-back{display:none !important;}
body:not(.is-home) .hud-level{display:none;}
.hud-title{font-family:"Fredoka";font-weight:700;font-size:19px;color:var(--ink);display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
body:not(.is-home) .hud-title{display:block;}
.hud-level{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0;flex:1;}
.lvl{width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,#FFD23F,#FF9A52);display:flex;align-items:center;justify-content:center;font-family:"Fredoka";font-weight:700;font-size:19px;color:#7A4D00;box-shadow:var(--shadow-sm),inset 0 -3px 0 rgba(0,0,0,.12);flex:0 0 auto;}
.lvl-mid{flex:1;min-width:70px;max-width:150px;}
.lvl-title{font-family:"Fredoka";font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar{position:relative;height:10px;border-radius:999px;background:#EEE3F6;overflow:hidden;}
.bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF8FC6,#9B6BFF);transition:width .5s cubic-bezier(.2,.8,.2,1);}
.bar>i{position:absolute;inset:0;font-style:normal;font-size:9px;font-weight:700;color:#fff;text-align:center;line-height:10px;text-shadow:0 1px 2px rgba(0,0,0,.35);}
.bar.xp{height:8px;background:#E9DDF3;}.bar.xp>span{background:linear-gradient(90deg,#5BC8FF,#9B6BFF);}
.bar.big{height:16px}.bar.big>i{line-height:16px;font-size:11px}
.bar.pink>span{background:linear-gradient(90deg,#FF8FC6,#FF5FAC)}.bar.mint>span{background:linear-gradient(90deg,#5CE6CB,#22C9A8)}.bar.yellow>span{background:linear-gradient(90deg,#FFDD63,#FFB318)}
.bar.red>span{background:linear-gradient(90deg,#FF8FA8,#FF5C7A)}.bar.purple>span{background:linear-gradient(90deg,#B18CFF,#8A52FF)}.bar.set>span{background:var(--sc,#FF6FB5)}.bar.odd{height:8px;flex:1}.bar.odd>span{background:currentColor}
.pill{display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:6px 11px;font-weight:700;font-size:15px;box-shadow:var(--shadow-sm);transition:transform .15s;white-space:nowrap;}
.pill.coin{color:#C98A00}.pill.star{color:#7A4FD6}.pill .ico{font-size:15px}
.pill.pulse{animation:pulse .45s ease;}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.iconbtn{width:40px;height:40px;border-radius:50%;background:#fff;font-size:18px;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;transition:transform .12s;flex:0 0 auto;}
.iconbtn:active{transform:scale(.9)}
.iconbtn.small{width:34px;height:34px;font-size:15px}.iconbtn.tiny{width:26px;height:26px;font-size:12px;box-shadow:none;background:#F6EEFB}

/* ---- buttons ---- */
.bigbtn{border-radius:18px;padding:13px 18px;font-family:"Fredoka";font-weight:700;font-size:17px;color:#fff;box-shadow:var(--shadow),inset 0 -3px 0 rgba(0,0,0,.14);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s;min-height:48px;text-align:center;line-height:1.1;}
.bigbtn:active{transform:translateY(2px) scale(.98);box-shadow:var(--shadow-sm)}
.bigbtn.pink{background:linear-gradient(180deg,#FF8FC6,#FF5FAC)}.bigbtn.mint{background:linear-gradient(180deg,#5CE6CB,#22C9A8)}.bigbtn.purple{background:linear-gradient(180deg,#B18CFF,#8A52FF)}
.bigbtn.sky{background:linear-gradient(180deg,#7FD6FF,#3FB7FF)}.bigbtn.yellow{background:linear-gradient(180deg,#FFDD63,#FFC318);color:#7A5300}.bigbtn.orange{background:linear-gradient(180deg,#FFB570,#FF8C3A)}
.bigbtn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}.bigbtn.danger{color:#E03B5A}
.bigbtn.full{width:100%}.bigbtn.mini{padding:9px 14px;font-size:14px;min-height:40px;border-radius:14px;}
.chipbtn{background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink);box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:6px;transition:transform .1s;min-height:36px;}
.chipbtn:active{transform:scale(.93)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;box-shadow:var(--shadow-sm);color:var(--ink);}
.chip.coin{color:#C98A00}.chip.xp{color:#3F8BD6}.chip.star{color:#7A4FD6}.chip.heart{color:#E0457A}.chip.item{color:#22A88F}
.chip.on{background:linear-gradient(180deg,#FF8FC6,#FF5FAC);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:8px 0;}
.chips-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;}.chips-row::-webkit-scrollbar{display:none}
.chips-row .chip{white-space:nowrap;flex:0 0 auto;}
.starrow .st{color:#D9CCE8;font-size:15px;letter-spacing:1px;}.starrow .st.on{color:#FFB318;text-shadow:0 1px 0 #fff;}
.rpill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;color:#fff;background:#9AA3B3;}
.rpill.r-cute{background:var(--pink)}.rpill.r-rare{background:#3FB7FF}.rpill.r-super{background:var(--purple)}.rpill.r-legendary{background:linear-gradient(90deg,#F2A900,#FF7A1E)}
.price{font-weight:700;color:#C98A00;font-size:13px}.price.sale s{color:var(--ink-faint);font-weight:600;margin-right:3px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px;}
.sec h3{font-size:16px;color:var(--ink);}.sec-r{font-size:12px;font-weight:700;color:var(--ink-soft);}
.empty{text-align:center;color:var(--ink-soft);font-weight:600;padding:26px 16px;background:rgba(255,255,255,.6);border-radius:var(--radius);}
.empty .em{font-size:40px;margin-bottom:6px;}
.name-input{width:100%;font-family:"Baloo 2";font-size:20px;font-weight:600;text-align:center;border:3px solid #F0CDE6;border-radius:14px;padding:11px;color:var(--ink);outline:none;margin:10px 0;background:#fff;}
.name-input:focus{border-color:var(--pink);}

/* ---- tiles (items) ---- */
.tile{position:relative;width:76px;min-height:96px;border-radius:16px;background:#fff;box-shadow:var(--shadow-sm);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;padding:4px 3px 4px;transition:transform .12s;flex:0 0 auto;overflow:hidden;}
.tile:active{transform:scale(.93)}
.tile .thumb{width:64px;height:64px;border-radius:12px;background:#FBF6FF;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.tile .thumb svg{width:100%;height:100%;}
.tile .nm{font-size:10px;font-weight:700;color:var(--ink);text-align:center;line-height:1.1;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tile.r-cute{border-color:#FFD6EA}.tile.r-rare{border-color:#BFE6FF}.tile.r-super{border-color:#DCCBFF;box-shadow:0 4px 14px rgba(155,107,255,.35)}.tile.r-legendary{border-color:#FFE082;box-shadow:0 4px 16px rgba(255,196,0,.45);background:linear-gradient(180deg,#fff,#FFF6DA)}
.tile.eq{border-color:var(--pink);box-shadow:0 6px 16px rgba(255,111,181,.45);}
.tile .chk{position:absolute;top:4px;right:4px;background:var(--pink);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;}
.tile .newdot{position:absolute;top:4px;left:4px;background:var(--mint);color:#fff;border-radius:999px;font-size:8px;font-weight:700;padding:2px 5px;}
.tile .tag{position:absolute;bottom:20px;right:3px;background:var(--yellow);color:#7A5300;border-radius:999px;padding:1px 6px;font-size:10px;font-weight:700;box-shadow:var(--shadow-sm);}
.tile .tag.own{background:var(--mint);color:#fff;}
.tile .lock{position:absolute;inset:0;background:rgba(90,61,122,.25);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.4);}
.tile.locked .thumb{filter:grayscale(.6);opacity:.7}
.shop-grid .tile:not(.owned):not(.locked) .thumb,.coll-body .tile:not(.owned) .thumb{opacity:.95}
.coll-body .tile:not(.owned) .thumb{filter:grayscale(1);opacity:.35}
.coll-body .tile:not(.owned)::after{content:"🔒";position:absolute;top:24px;left:0;right:0;text-align:center;font-size:18px;}
.tile.none .me,.tile.more .me{font-size:26px;margin-top:14px;}.tile.none small,.tile.more small{font-size:10px;font-weight:700;color:var(--ink-soft);margin-top:8px;}
.tile.more{background:linear-gradient(180deg,#FFF6DA,#FFE9A8);}
.tile.scene .thumb svg{object-fit:cover;}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:9px;justify-items:center;}
.shop-grid.small{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px;}
.shop-grid .tile{width:100%;max-width:96px;}
.shop-grid .tile .thumb{width:100%;height:auto;aspect-ratio:1;}

/* ---- portrait / cards ---- */
.portrait{width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:var(--shadow);margin:0 auto 6px;overflow:hidden;border:4px solid #fff;}
.portrait svg{width:100%;height:100%;}
.friend{display:flex;flex-direction:column;gap:4px;}.friend .fl{font-weight:700;font-size:13px;color:#E0457A;}.friend .fmax{font-weight:700;color:#FFB318;font-size:12px}
.itemcard{display:inline-flex;flex-direction:column;align-items:center;gap:5px;background:#fff;border-radius:20px;padding:12px 18px;box-shadow:var(--shadow);border:4px solid #EEE3F6;margin:6px auto;}
.itemcard.r-cute{border-color:#FFD6EA}.itemcard.r-rare{border-color:#BFE6FF}.itemcard.r-super{border-color:#DCCBFF;box-shadow:0 10px 30px rgba(155,107,255,.4)}.itemcard.r-legendary{border-color:#FFE082;box-shadow:0 10px 34px rgba(255,196,0,.5);background:linear-gradient(180deg,#fff,#FFF6DA)}
.itemcard .ic-thumb{width:120px;height:120px;border-radius:16px;background:#FBF6FF;overflow:hidden;}.itemcard .ic-thumb svg{width:100%;height:100%;}
.itemcard .ic-name{font-family:"Fredoka";font-weight:700;font-size:18px;}.itemcard .ic-sub{font-size:12px;font-weight:700;color:var(--ink-soft);}.itemcard .ic-big{font-size:64px;line-height:1;}

/* ---- toast / modal ---- */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:var(--shadow);opacity:0;transition:all .3s;z-index:300;pointer-events:none;font-size:14px;text-align:center;max-width:min(92vw,520px);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#modals{position:fixed;inset:0;z-index:200;pointer-events:none;}
.overlay{position:absolute;inset:0;background:rgba(58,36,88,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .22s;pointer-events:auto;}
.overlay.show{opacity:1;}
.modal{position:relative;background:var(--cream);border-radius:26px;box-shadow:0 20px 50px rgba(0,0,0,.35);width:min(430px,100%);max-height:min(88vh,calc(100% - 20px));overflow-y:auto;padding:22px 18px 16px;text-align:center;transform:scale(.8);transition:transform .25s cubic-bezier(.2,1.4,.4,1);}
.overlay.show .modal{transform:scale(1);}
.modal.wide{width:min(520px,100%);}
.modal h2{font-size:22px;color:var(--pink-deep);margin:4px 0 8px;}
.modal p{margin:6px 0;font-weight:600;color:var(--ink);}
.modal .mclose{position:absolute;top:10px;right:10px;width:34px;height:34px;font-size:15px;z-index:2;}
.mbtns{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
.modal.celebrate{background:linear-gradient(180deg,#FFF7FB,#F6EEFF);}
.big-emoji{font-size:64px;line-height:1;margin:2px 0 6px;animation:popIn .5s cubic-bezier(.2,1.5,.4,1);}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.lvl-big{font-family:"Fredoka";font-weight:700;font-size:38px;background:linear-gradient(90deg,#FF6FB5,#9B6BFF,#5BC8FF);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ach-t{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);}
.unlocks{background:#fff;border-radius:16px;padding:10px 12px;margin-top:8px;text-align:left;}
.unlocks .ul-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:4px;}
.unlocks .ul{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;padding:3px 0;}
.quote{font-style:italic;color:var(--pink-deep);}.bio{font-size:14px;color:var(--ink-soft);font-weight:600;}
.cat-hero{width:170px;margin:0 auto;}.cat-hero svg{width:100%;height:auto;}.cat-hero.small{width:130px}
.settings .setrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--shadow-sm);margin-bottom:9px;text-align:left;}
.settings .se{font-size:24px}.settings .st{flex:1;line-height:1.15}.settings .st small{color:var(--ink-soft);font-weight:600;display:block}
.toggle{width:52px;height:30px;border-radius:999px;background:#D8CCE8;position:relative;transition:background .2s;flex:0 0 auto;}
.toggle span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.toggle.on{background:var(--mint)}.toggle.on span{left:25px}
.seg{display:flex;gap:4px;}.seg button{width:32px;height:32px;border-radius:10px;background:#F1E8F7;font-weight:700;}.seg button.on{background:var(--purple);color:#fff;}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 0 9px;}
.ver{font-size:11px;color:var(--ink-faint);margin-top:8px;}
.savebox{width:100%;height:110px;border:2px solid #E4D6F4;border-radius:12px;padding:8px;font-size:11px;font-family:monospace;resize:none;background:#fff;color:var(--ink);}
.filein{margin-top:8px;font-size:13px;width:100%;}
.profile .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;}
.profile .pgrid div{background:#fff;border-radius:14px;padding:8px 4px;box-shadow:var(--shadow-sm);}
.profile .pgrid b{display:block;font-family:"Fredoka";font-size:20px;color:var(--pink-deep);}.profile .pgrid small{color:var(--ink-soft);font-weight:700;font-size:11px;}
.next-unlock{background:#fff;border-radius:14px;padding:10px;font-size:13px;font-weight:600;color:var(--ink-soft);text-align:left;}

/* ---- FX layer ---- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden;}
.fx-float{position:absolute;transform:translate(-50%,-50%);font-family:"Fredoka";font-weight:700;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 8px rgba(0,0,0,.2);animation:floatUp 1.2s ease-out forwards;white-space:nowrap;}
.fx-float.coin{color:#FFD23F}.fx-float.xp{color:#7FD6FF}.fx-float.star{color:#D9C2FF}.fx-float.heart{color:#FF8FC6}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.fx-p{position:absolute;transform:translate(-50%,-50%);animation:particle .85s ease-out forwards;}
@keyframes particle{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2)}}
.fx-conf{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:conf linear forwards;}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
.fx-flash{position:absolute;inset:0;background:#fff;animation:flash .45s ease-out forwards;}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.fx-fly{position:absolute;transform:translate(-50%,-50%);font-size:20px;animation:fly .8s cubic-bezier(.3,.7,.4,1) forwards;}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.5);opacity:.6}}
.shake{animation:shake .45s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---- stage & live cat ---- */
.stage-wrap{position:relative;display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%;}
.home-scene .stage-wrap,.care-room .stage-wrap,.studio-top .stage-wrap{width:auto;height:auto;}
.stage{position:relative;height:100%;aspect-ratio:360/560;max-width:100%;}
.cat-live,.cat-live svg{position:absolute;inset:0;width:100%;height:100%;}
.cat-svg .p-head,.cat-svg .p-eyes,.cat-svg .p-tail,.cat-svg .p-earL,.cat-svg .p-earR,.cat-svg .cat-root,.cat-svg .p-pupils{transform-box:view-box;}
.cat-svg .p-head{transform-origin:180px 235px;}.cat-svg .p-eyes{transform-origin:180px 150px;}.cat-svg .p-tail{transform-origin:236px 432px;}

/* ---- voice chat ---- */

.care-layer>*{pointer-events:auto;}
.care-room.playing .care-layer{pointer-events:auto;}
.care-hint{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--pink-deep);font-size:13px;box-shadow:var(--shadow-sm);z-index:4;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
.care-hint.show{opacity:1;}
.care-progress{position:absolute;bottom:10px;left:14%;right:14%;height:8px;border-radius:999px;background:rgba(255,255,255,.7);overflow:hidden;z-index:4;display:none;}
.care-progress.show{display:block;}.care-progress span{display:block;height:100%;background:linear-gradient(90deg,#FF8FC6,#9B6BFF);transition:width .25s;}
.care-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 0 4px;flex:0 0 auto;}
.care-actions button{border-radius:18px;padding:9px 4px;font-family:"Fredoka";font-weight:700;font-size:13px;color:#fff;box-shadow:var(--shadow-sm),inset 0 -3px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s,opacity .2s;min-height:62px;}
.care-actions button:active{transform:scale(.94);}
.care-actions .em{font-size:24px;line-height:1;}
.care-actions .feed{background:linear-gradient(180deg,#FF8FC6,#FF5FAC)}.care-actions .bath{background:linear-gradient(180deg,#7FD6FF,#3FB7FF)}.care-actions .play{background:linear-gradient(180deg,#5CE6CB,#22C9A8)}.care-actions .sleep{background:linear-gradient(180deg,#B18CFF,#8A52FF)}
.care-actions.busy button{opacity:.45;pointer-events:none;}
.care-foot{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding-top:8px;flex:0 0 auto;}
.tray{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(255,255,255,.96);border-radius:18px;padding:8px 8px 10px;box-shadow:var(--shadow);z-index:5;animation:trayUp .3s ease;}
.tray-t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:0 4px 6px;}
.tray-t small{color:var(--ink-soft);font-weight:600;flex:1;font-size:11px;}
.tray-x{width:28px;height:28px;border-radius:50%;background:#F1E8F7;font-size:13px;display:flex;align-items:center;justify-content:center;}
.tray-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none;}.tray-row::-webkit-scrollbar{display:none}
.food{position:relative;flex:0 0 auto;width:68px;border-radius:14px;background:#FBF6FF;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;padding:7px 2px 5px;gap:1px;border:2px solid transparent;transition:transform .1s;}
.food:active{transform:scale(.93);}
.food .fe{font-size:28px;line-height:1;}.food small{font-size:10px;font-weight:700;white-space:nowrap;}.food .cnt{font-size:9px;font-weight:700;color:var(--ink-soft);}
.food.fav{border-color:#FFD23F;background:#FFF6DA;}.food.none{opacity:.55;}
.favstar{position:absolute;top:-7px;right:-4px;font-size:13px;}
.fly-food{position:absolute;font-size:34px;transform:translate(-50%,-50%);transition:all .45s ease;z-index:5;pointer-events:none;line-height:1;}
.tub{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:72%;height:22%;border-radius:20px 20px 40px 40px;background:linear-gradient(180deg,#CDEEFF,#8FD8FF);box-shadow:inset 0 8px 0 rgba(255,255,255,.55),var(--shadow-sm);z-index:1;pointer-events:none;}
.bubble{position:absolute;transform:translate(-50%,-50%);cursor:pointer;animation:bubbleFloat 2.4s ease-in-out infinite;z-index:6;line-height:1;}
.foam{position:absolute;width:36px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.5);z-index:5;pointer-events:none;}
.dirt{position:absolute;width:46px;height:36px;transform:translate(-50%,-50%);z-index:6;cursor:pointer;}
.dirt span{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#8A6E5A,#6B5445);opacity:.85;transition:transform .2s,opacity .2s;}
.dirt.h1 span{transform:scale(.6);opacity:.5;}
.shower{position:absolute;top:44px;right:16px;font-size:46px;z-index:6;animation:bob 1s ease-in-out infinite;line-height:1;}
.drop{position:absolute;font-size:18px;animation:dropFall .9s ease-in forwards;z-index:5;pointer-events:none;}
.play-timer{position:absolute;top:8px;right:10px;background:#fff;border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;box-shadow:var(--shadow-sm);z-index:5;pointer-events:none;}
.laser{position:absolute;width:16px;height:16px;border-radius:50%;background:#FF2D55;box-shadow:0 0 12px 4px rgba(255,45,85,.6);transform:translate(-50%,-50%);z-index:6;pointer-events:none;}
.yarn{position:absolute;font-size:40px;transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.2,.8,.3,1),transform .5s;z-index:6;cursor:pointer;line-height:1;}
.mouse{position:absolute;font-size:36px;z-index:6;animation:popIn .2s ease;line-height:1;cursor:pointer;}
.feather{position:absolute;font-size:38px;transform:translate(-50%,-80%) rotate(-30deg);z-index:6;pointer-events:none;line-height:1;}
.ball{position:absolute;font-size:36px;transform:translate(-50%,-50%);z-index:6;line-height:1;cursor:pointer;}
.ball.toss-r{animation:tossR .9s ease-in-out;}.ball.toss-l{animation:tossL .9s ease-in-out;}
.zzz{position:absolute;top:16%;left:56%;z-index:5;pointer-events:none;}
.zzz span{position:absolute;font-family:"Fredoka";font-weight:700;color:#fff;animation:zfloat 2.1s ease-in-out infinite;}
.zzz span:nth-child(1){font-size:18px;left:0}.zzz span:nth-child(2){font-size:24px;left:16px;animation-delay:.7s}.zzz span:nth-child(3){font-size:30px;left:36px;animation-delay:1.4s}
.moonlight{position:absolute;top:14px;right:16px;font-size:36px;z-index:5;pointer-events:none;animation:twinkle 3s infinite;}
.wake{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:6;}

/* ===== STUDIO ===== */
.body.studio{display:flex;flex-direction:column;padding:0;overflow:hidden;}
.studio-top{position:relative;flex:1;min-height:0;overflow:hidden;}
.studio-top .room{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
.scene-bg{position:absolute;inset:0;z-index:0;}
.scene-bg svg{width:100%;height:100%;display:block;}
.vanity{position:absolute;left:0;right:0;top:0;height:34px;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));}
.vanity i{position:absolute;top:6px;width:12px;height:12px;border-radius:50%;background:#FFE27A;box-shadow:0 0 10px 3px rgba(255,226,122,.7);animation:twinkle 2.6s ease-in-out infinite;}
.studio-top .stage-wrap{position:absolute;inset:10px 0 6px;z-index:1;}
.sticker-layer{position:absolute;inset:0;z-index:3;pointer-events:none;}
.sticker{position:absolute;transform:translate(-50%,-50%);font-size:34px;pointer-events:auto;cursor:grab;touch-action:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));line-height:1;}
.studio-fabs{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:4;}
.fab{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:var(--shadow-sm);font-size:19px;display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.fab:active{transform:scale(.9);}
.challenge-fab{position:absolute;left:8px;top:8px;z-index:4;background:linear-gradient(180deg,#B18CFF,#8A52FF);color:#fff;border-radius:999px;padding:10px 14px;font-family:"Fredoka";font-weight:700;font-size:14px;box-shadow:var(--shadow);min-height:40px;}
.wardrobe{flex:0 0 auto;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:3px solid #fff;padding:6px 6px calc(8px + var(--safe-b));}
.wtabs{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;}.wtabs::-webkit-scrollbar{display:none}
.wtab{position:relative;flex:0 0 auto;border-radius:14px;padding:6px 9px;font-weight:700;font-size:11px;background:#fff;color:var(--ink-soft);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;min-height:46px;transition:transform .1s;}
.wtab:active{transform:scale(.93);}
.wtab .we{font-size:18px;line-height:1.1;}
.wtab.on{background:linear-gradient(180deg,#FF8FC6,#FF5FAC);color:#fff;}
.wtab .ndot{position:absolute;top:-4px;right:-2px;margin:0;}
.witems{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 4px;scrollbar-width:none;min-height:104px;}.witems::-webkit-scrollbar{display:none}
.challenge-bar,.presets-bar,.photo-panel{flex:0 0 auto;background:#fff;border-top:3px solid #E9DDF3;padding:8px 10px calc(8px + var(--safe-b));}
.challenge-bar{max-height:46%;overflow-y:auto;}
.cb-head{display:flex;align-items:center;gap:8px;}
.cb-head .che{font-size:26px;line-height:1;}.cb-head>div{flex:1;min-width:0;}.cb-head b{display:block;font-size:15px;}.cb-head small{color:var(--ink-soft);font-weight:600;font-size:12px;}
.cb-reqs{display:flex;flex-direction:column;gap:5px;margin:6px 0;}
.req{background:#FBF6FF;border-radius:12px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;font-size:12px;}
.req b{width:100%;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
.rq{font-weight:700;color:var(--ink-soft);}.rq.ok{color:#22A88F;}
.req small{width:100%;color:var(--ink-faint);font-weight:600;font-size:11px;}
.cb-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cb-total{font-family:"Fredoka";font-weight:700;font-size:16px;}
.pb-t{font-weight:700;font-size:13px;margin-bottom:6px;}.pb-t small{color:var(--ink-soft);font-weight:600;margin-left:6px;font-size:11px;}
.pb-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;}
.preset{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;width:78px;}
.pthumb{width:68px;height:68px;border-radius:14px;background:#FBF6FF;box-shadow:var(--shadow-sm);overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid transparent;}
.preset.has .pthumb{border-color:#E4D6F4;}
.pthumb svg{width:100%;height:100%;}.pthumb .pe{font-size:28px;}
.preset small{font-size:11px;font-weight:700;}
.psave{font-size:10px;font-weight:700;color:#fff;background:var(--purple);border-radius:999px;padding:3px 9px;min-height:22px;}
.ptabs{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.ptabs button[data-ptab]{border-radius:999px;padding:7px 11px;font-weight:700;font-size:12px;background:#F1E8F7;color:var(--ink-soft);min-height:32px;}
.ptabs button.on{background:var(--purple);color:#fff;}
.prow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px;}.prow::-webkit-scrollbar{display:none}
.ptile{flex:0 0 auto;width:66px;height:66px;border-radius:14px;background:#FBF6FF;box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:3px solid transparent;position:relative;}
.ptile svg{width:100%;height:100%;position:absolute;inset:0;}
.ptile small{position:relative;z-index:1;font-size:9px;font-weight:700;background:rgba(255,255,255,.88);border-radius:999px;padding:1px 5px;margin-top:auto;margin-bottom:3px;white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis;}
.ptile.on{border-color:var(--pink);}.ptile.pose .pe{font-size:26px;line-height:1;}.ptile.st{font-size:30px;}.ptile.locked{opacity:.6;}
.phint{display:block;text-align:center;color:var(--ink-soft);font-weight:600;margin-top:4px;font-size:11px;}
.shutter{margin-top:8px;width:100%;border-radius:16px;padding:12px;background:linear-gradient(180deg,#FF8FC6,#FF5FAC);color:#fff;font-family:"Fredoka";font-weight:700;font-size:17px;box-shadow:var(--shadow);min-height:48px;}
.studio-top.noui ~ .photo-panel{transform:translateY(calc(100% - 52px));}
.photo-panel{transition:transform .3s;}
.chlist{display:flex;flex-direction:column;gap:7px;text-align:left;}
.chrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:9px 10px;box-shadow:var(--shadow-sm);width:100%;text-align:left;}
.chrow.feat{background:linear-gradient(120deg,#FFF1C9,#FFE0EE);}.chrow.locked{opacity:.6;}
.che{font-size:28px;line-height:1;}
.chm{flex:1;min-width:0;}.chm b{display:block;font-size:14px;}.chm small{display:block;color:var(--ink-soft);font-weight:600;font-size:12px;}
.featpill{font-style:normal;background:#FFD23F;color:#7A5300;border-radius:999px;padding:1px 7px;font-size:10px;margin-left:4px;}
.chgo{font-size:22px;color:var(--ink-faint);}
.res-cat{width:150px;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);}
.res-cat svg{width:100%;height:auto;display:block;}
.polaroid{display:inline-block;background:#fff;padding:8px 8px 6px;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.18);transform:rotate(-2deg);width:180px;}
.polaroid.big{width:min(300px,80vw);transform:none;}
.ph-frame{position:relative;aspect-ratio:360/560;border-radius:4px;overflow:hidden;background:#eee;}
.ph-frame svg{width:100%;height:100%;display:block;}
.ph-st{position:absolute;transform:translate(-50%,-50%);font-size:22px;line-height:1;}
.polaroid.big .ph-st{font-size:34px;}
.ph-cap{display:flex;justify-content:space-between;align-items:baseline;padding-top:6px;font-family:"Fredoka";}
.ph-cap b{font-size:14px;color:var(--pink-deep);}.ph-cap small{font-size:10px;color:var(--ink-faint);}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;justify-items:center;}
.polaroid.card{width:100%;max-width:170px;transform:rotate(0);}
.polaroid.card:nth-child(odd){transform:rotate(-1.5deg);}.polaroid.card:nth-child(even){transform:rotate(1.2deg);}
.ph-open{display:block;width:100%;text-align:left;}
.ph-acts{display:flex;justify-content:space-around;padding-top:4px;}
.ph-acts button{font-size:16px;width:34px;height:34px;border-radius:50%;background:#F6EEFB;}
.ph-acts button.on{background:#FFE0EE;}

/* ===== SHOP ===== */
.shop-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;}.shop-tabs::-webkit-scrollbar{display:none}
.stab{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:5px;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;background:rgba(255,255,255,.92);color:var(--ink-soft);box-shadow:var(--shadow-sm);min-height:38px;white-space:nowrap;}
.stab.on{background:linear-gradient(180deg,#FF8FC6,#FF5FAC);color:#fff;}
.shop-tip{margin-top:14px;background:rgba(255,255,255,.8);border-radius:14px;padding:10px;font-size:12px;font-weight:600;color:var(--ink-soft);}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.foodcard{position:relative;background:#fff;border-radius:18px;padding:12px 10px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;border:3px solid transparent;}
.foodcard.fav{border-color:#FFD23F;background:#FFF9E6;}
.foodcard .fe{font-size:36px;line-height:1;}.foodcard small{color:var(--ink-soft);font-weight:600;font-size:11px;}
.fstats{font-size:12px;font-weight:700;color:#22A88F;}
.foodcard .own{font-size:10px;}
.freepill{background:#D6F7EC;color:#1E9C82;border-radius:999px;padding:4px 10px;font-weight:700;font-size:11px;}
.foodcard .favstar{position:static;font-size:11px;font-weight:700;color:#C98A00;}
.setlist{display:flex;flex-direction:column;gap:8px;}
.setrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px;box-shadow:var(--shadow-sm);width:100%;text-align:left;border-left:6px solid var(--sc,#FF6FB5);}
.setrow.done{background:linear-gradient(90deg,#fff,#FFF6DA);}
.setrow .se{font-size:28px;line-height:1;}
.sm{flex:1;min-width:0;}.sm b{display:block;font-size:14px;margin-bottom:4px;}
.sr{display:flex;flex-direction:column;align-items:center;gap:2px;}.sr small{font-size:10px;font-weight:700;color:var(--ink-soft);}
.sr-thumb{width:50px;height:50px;border-radius:12px;background:#FBF6FF;overflow:hidden;border:2px solid #EEE3F6;}
.sr-thumb svg{width:100%;height:100%;}
.sr-thumb.r-legendary{border-color:#FFD23F;box-shadow:0 0 10px rgba(255,196,0,.5);}.sr-thumb.r-super{border-color:#DCCBFF;}
.setreward{display:flex;align-items:center;gap:10px;background:#FFF6DA;border-radius:16px;padding:10px;margin-top:10px;text-align:left;}
.setreward.done{background:#EAFBF5;}
.setreward .sr-thumb{width:64px;height:64px;flex:0 0 auto;}
.modal.preview{padding:0;overflow:hidden;}
.pv-stage{background:linear-gradient(180deg,#F3E6FF,#FFE9F4);height:280px;display:flex;justify-content:center;}
.pv-stage svg{height:100%;width:auto;}
.pv-info{padding:12px 16px 4px;}
.pv-meta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0;}
.setpill{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--sc,#9B6BFF);color:#fff;}
.pv-desc{font-size:13px;color:var(--ink-soft);font-weight:600;}
.pv-colors{display:flex;gap:4px;justify-content:center;margin:4px 0;}
.modal.preview .mbtns{padding:0 16px 16px;}
.modal.preview .mclose{background:rgba(255,255,255,.92);}

/* ===== MYSTERY ===== */
.body.mystery{display:flex;flex-direction:column;align-items:center;}
.my-wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;}
.my-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mybox{position:relative;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:18px;padding:10px 6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:86px;}
.mybox .be{font-size:30px;line-height:1;}.mybox b{font-family:"Fredoka";font-size:13px;}.mybox small{font-size:11px;opacity:.85;font-weight:700;}
.mybox.on{background:rgba(255,255,255,.96);color:var(--ink);border-color:#FFD23F;box-shadow:0 0 18px rgba(255,210,63,.5);}
.mybox.locked{opacity:.5;}
.freetag{position:absolute;top:-8px;right:-4px;background:var(--mint);color:#fff;border-radius:999px;font-size:9px;font-style:normal;font-weight:700;padding:2px 6px;}
.my-stage{height:200px;display:flex;align-items:flex-end;justify-content:center;position:relative;}
.box{position:relative;width:150px;height:130px;}
.box .base{position:absolute;left:10px;right:10px;bottom:0;height:86px;border-radius:12px;background:linear-gradient(180deg,#FF8FC6,#F0479A);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 10px 30px rgba(0,0,0,.35);}
.box .base::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:20px;margin-left:-10px;background:#FFD23F;}
.box .lid{position:absolute;left:0;right:0;top:26px;height:34px;border-radius:10px;background:linear-gradient(180deg,#FFB7DC,#FF6FB5);box-shadow:0 4px 0 rgba(0,0,0,.1);transform-origin:left bottom;transition:transform .5s cubic-bezier(.3,1.4,.4,1);z-index:2;}
.box .lid::before{content:"🎀";position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:30px;}
.box.glam .base{background:linear-gradient(180deg,#B18CFF,#7A4FD6)}.box.glam .lid{background:linear-gradient(180deg,#D9C2FF,#9B6BFF)}.box.glam .lid::before{content:"💎"}
.box.star .base{background:linear-gradient(180deg,#FFE27A,#FFB318)}.box.star .lid{background:linear-gradient(180deg,#FFF3B0,#FFD23F)}.box.star .lid::before{content:"⭐"}
.box .glow{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,120,.85),rgba(255,230,120,0) 70%);opacity:0;transition:opacity .6s;pointer-events:none;z-index:1;}
.box.glow .glow{opacity:1;animation:pulse 1s infinite;}
.box.shake{animation:boxShake .4s ease infinite;}
.box.open .lid{transform:rotate(-115deg) translateY(-10px);}
.box.open .base{filter:brightness(1.15);}
.my-open .lockmsg{color:#fff;font-weight:700;text-align:center;}
.my-note{display:block;text-align:center;color:rgba(255,255,255,.75);font-weight:600;margin-top:6px;font-size:12px;}
.my-odds{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 12px;color:#fff;}
.odds-t{font-weight:700;font-size:13px;margin-bottom:6px;}
.odd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin:3px 0;}
.odd>span{width:82px;}.odd b{width:36px;text-align:right;}
.odd .bar{background:rgba(255,255,255,.2);}
.odd.r-common{color:#C9D0DA}.odd.r-cute{color:#FF9EC4}.odd.r-rare{color:#7FD6FF}.odd.r-super{color:#C8A4FF}.odd.r-legendary{color:#FFE27A}
.my-odds small{display:block;color:rgba(255,255,255,.7);font-weight:600;margin-top:4px;font-size:11px;}
.flipin{animation:flipIn .7s cubic-bezier(.2,1.2,.4,1);}
@keyframes flipIn{0%{transform:rotateY(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}

/* ===== SHOW ===== */
.body.show{padding:0;display:flex;flex-direction:column;overflow:hidden;}
.show-pick{position:relative;flex:1;overflow-y:auto;padding:10px 12px calc(20px + var(--safe-b));}
.show-pick .room{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
.show-pick>*:not(.room){position:relative;z-index:1;}
.sp-cat{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.12);border-radius:20px;padding:8px;color:#fff;}
.sp-stage{width:110px;height:170px;flex:0 0 auto;}.sp-stage svg{width:100%;height:100%;}
.sp-info{min-width:0;}.sp-info b{font-family:"Fredoka";font-size:20px;display:block;}.sp-info small{display:block;opacity:.85;font-weight:600;margin:2px 0 8px;font-size:12px;}
.sp-shows{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none;}.sp-shows::-webkit-scrollbar{display:none}
.spshow{flex:0 0 auto;width:112px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:8px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:84px;}
.spshow .se{font-size:26px;line-height:1;}.spshow b{font-family:"Fredoka";font-size:13px;}.spshow small{font-size:10px;opacity:.85;font-weight:700;}
.spshow.on{background:#fff;color:var(--ink);border-color:#FFD23F;}.spshow.locked{opacity:.5;}
.sp-detail{background:rgba(255,255,255,.96);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.sp-detail p{margin:0;font-weight:600;color:var(--ink-soft);font-size:13px;}
.sp-reqs{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;}
.sp-judges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;}
.sp-judges div{background:#FBF6FF;border-radius:12px;padding:6px;}
.sp-judges small{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);}
.sp-hint{color:var(--ink-faint);font-weight:600;font-size:11px;}
.sp-why{background:#FFF1F4;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700;color:#C43A5A;}
.runway-wrap{position:relative;flex:1;overflow:hidden;background:#12092A;}
.rw-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#3B2A6E,#12092A 70%);transition:filter .8s;}
.runway-wrap.dim .rw-bg{filter:brightness(.45);}
.runway-wrap.lights .rw-bg{filter:brightness(1.05);}
.rw-spot{position:absolute;top:-10%;width:60%;height:120%;background:linear-gradient(180deg,rgba(255,220,120,.4),rgba(255,220,120,0) 70%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);opacity:0;transition:opacity .8s;transform-origin:50% 0;}
.rw-spot.l{left:-10%}.rw-spot.r{right:-10%;background:linear-gradient(180deg,rgba(255,120,200,.4),transparent 70%)}
.runway-wrap.lights .rw-spot{opacity:1;animation:spotSweep 4s ease-in-out infinite alternate;}
.rw-spot.r{animation-delay:-2s;}
.rw-stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.6;animation:twinkle 2s infinite;}
.rw-floor{position:absolute;left:50%;bottom:0;width:72%;height:78%;transform:translateX(-50%);background:linear-gradient(180deg,#FFB7DC,#FF6FB5);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);box-shadow:0 -10px 40px rgba(255,111,181,.5);}
.rw-floor::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,#fff 0 16px,transparent 16px 34px);opacity:.6;}
.rw-model{position:absolute;left:50%;bottom:6%;width:52%;max-width:300px;transform:translateX(-50%) scale(.3);opacity:0;z-index:3;}
.rw-model svg{width:100%;height:auto;display:block;}
.rw-model.walking{animation:walk 5s cubic-bezier(.4,0,.6,1) forwards;}
.rw-model.posing{opacity:1;transform:translateX(-50%) scale(1.05);animation:posePop .5s ease;}
@keyframes walk{0%{bottom:56%;transform:translateX(-50%) scale(.3);opacity:0}10%{opacity:1}25%{transform:translateX(-52%) scale(.45) rotate(-2deg)}50%{transform:translateX(-48%) scale(.68) rotate(2deg)}75%{transform:translateX(-52%) scale(.9) rotate(-2deg)}100%{bottom:6%;transform:translateX(-50%) scale(1.05);opacity:1}}
.rw-curtain{position:absolute;top:0;bottom:0;width:52%;background:repeating-linear-gradient(90deg,#C4245A 0 14px,#A81C4C 14px 28px);z-index:4;transition:transform 1.1s cubic-bezier(.6,0,.3,1);box-shadow:0 0 30px rgba(0,0,0,.5);}
.rw-curtain.l{left:0}.rw-curtain.r{right:0}
.runway-wrap.open .rw-curtain.l{transform:translateX(-100%)}.runway-wrap.open .rw-curtain.r{transform:translateX(100%)}
.rw-crowd{position:absolute;left:0;right:0;bottom:0;height:16%;display:flex;justify-content:space-around;align-items:flex-end;z-index:5;pointer-events:none;}
.rw-crowd i{width:7%;height:70%;border-radius:40% 40% 10% 10%;background:#0A0518;animation:crowdBob 1s ease-in-out infinite;}
.rw-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6;}
.rw-flash.on{animation:flash .35s ease-out;}
.rw-caption{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.94);border-radius:999px;padding:7px 16px;font-family:"Fredoka";font-weight:700;font-size:15px;color:var(--pink-deep);opacity:0;transition:opacity .3s;z-index:7;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;}
.rw-caption.show{opacity:1;}
.rw-skip{position:absolute;top:12px;right:10px;z-index:8;}
.judges{position:absolute;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;padding:10px;background:linear-gradient(180deg,transparent 15%,rgba(18,9,42,.88) 55%);}
.jd-panel{width:100%;max-width:460px;background:var(--cream);border-radius:22px;padding:14px;text-align:center;animation:slideUp .5s cubic-bezier(.2,1.2,.4,1);max-height:88%;overflow-y:auto;}
.jd-panel h2{color:var(--pink-deep);font-size:20px;}
.jmedal{margin:4px 0;}
.medal-big{font-size:54px;line-height:1;animation:popIn .5s cubic-bezier(.2,1.5,.4,1);}
.jmedal b{font-family:"Fredoka";font-size:20px;color:var(--ink);}
.jbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;}
.jbtns .bigbtn{padding:10px 4px;font-size:13px;min-height:44px;}

/* ===== SCHOOL ===== */
.sc-head{display:flex;gap:8px;align-items:stretch;margin-bottom:10px;}
.sc-brain{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border-radius:16px;padding:8px 10px;box-shadow:var(--shadow-sm);min-width:0;}
.sc-brain>div{flex:1;min-width:0;}
.sb-ico{font-size:26px;line-height:1;}
.sc-brain b{display:block;font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-grade{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.94);border-radius:16px;padding:6px 8px;box-shadow:var(--shadow-sm);max-width:118px;}
.sc-grade small{width:100%;text-align:center;font-size:10px;font-weight:700;color:var(--ink-soft);}
.sc-grade button{width:28px;height:28px;border-radius:8px;background:#F1E8F7;font-weight:700;font-size:12px;}
.sc-grade button.on{background:var(--yellow);color:#7A5300;}
.sc-intro{background:rgba(255,255,255,.92);border-radius:14px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink-soft);text-align:center;margin-bottom:10px;}
.subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.subj{background:#fff;border-radius:18px;padding:12px 10px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;border:3px solid transparent;transition:transform .1s;min-height:120px;}
.subj:active{transform:scale(.96);}
.subj .se{font-size:32px;line-height:1;}.subj b{font-family:"Fredoka";font-size:15px;}.subj small{font-size:11px;color:var(--ink-soft);font-weight:600;}
.sc-session{display:flex;flex-direction:column;gap:6px;}
.ss-top{display:flex;align-items:center;gap:8px;}
.ss-dots{flex:1;display:flex;gap:4px;}
.ss-dots i{flex:1;height:8px;border-radius:999px;background:#E4D6F4;}
.ss-dots i.ok{background:var(--mint)}.ss-dots i.no{background:#FF8FA8}.ss-dots i.cur{background:var(--yellow)}
.ss-streak{font-weight:700;color:#FF7A1E;min-width:40px;text-align:right;}
.ss-cat{width:120px;height:150px;margin:-4px auto -34px;position:relative;z-index:1;}
.ss-cat svg{width:100%;height:100%;}
.ss-card{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow);text-align:center;position:relative;z-index:2;}
.ss-subject{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);}
.ss-q{font-family:"Fredoka";font-weight:700;font-size:22px;margin:8px 0 4px;}
.ss-q.big{font-size:34px;}
.ss-sub{font-family:"Fredoka";font-weight:700;font-size:24px;letter-spacing:2px;color:var(--purple);margin-bottom:6px;word-break:break-word;}
.ss-choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 6px;}
.choice{border-radius:16px;background:#FBF6FF;box-shadow:var(--shadow-sm),inset 0 -3px 0 rgba(0,0,0,.06);padding:14px 8px;font-family:"Fredoka";font-weight:700;font-size:20px;color:var(--ink);transition:transform .1s;min-height:56px;word-break:break-word;}
.choice:active{transform:scale(.95);}
.choice.right{background:var(--mint);color:#fff;animation:catBounce .4s;}
.choice.wrong{background:#FF8FA8;color:#fff;}
.ss-fb{min-height:24px;font-weight:700;font-size:14px;}
.ss-fb .good{color:#22A88F}.ss-fb .bad{color:#E0457A}
.ss-memo{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:38px;margin:10px 0;}
.ss-count{font-family:"Fredoka";font-size:30px;font-weight:700;color:var(--purple);}
.rc-head{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);}

/* ===== PLAYROOM ===== */
.body.playroom{position:relative;}
.pr-intro{background:rgba(255,255,255,.92);border-radius:14px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink-soft);text-align:center;margin-bottom:10px;}
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gamecard{position:relative;background:#fff;border-radius:20px;padding:12px 10px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-height:150px;transition:transform .1s;}
.gamecard:active{transform:scale(.96);}
.gamecard .ge{font-size:38px;line-height:1;}.gamecard b{font-family:"Fredoka";font-size:15px;}.gamecard small{font-size:11px;color:var(--ink-soft);font-weight:600;}
.gmeta{display:flex;gap:8px;font-size:10px;font-weight:700;color:var(--ink-soft);margin-top:auto;}
.gamecard.locked{opacity:.65;}
.pr-note{text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:12px;}
.arena{position:absolute;inset:0;background:linear-gradient(160deg,#E4F9FF,#F4E9FF);display:flex;flex-direction:column;z-index:3;}
.ar-top{display:flex;align-items:center;gap:8px;padding:8px 12px;font-weight:700;font-size:15px;}
.ar-score b{color:var(--pink-deep);font-family:"Fredoka";font-size:18px;}
.ar-time{flex:1;text-align:center;}
.ar-field{position:relative;flex:1;margin:0 10px calc(12px + var(--safe-b));border-radius:20px;background:rgba(255,255,255,.7);overflow:hidden;touch-action:none;}
.ar-count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Fredoka";font-size:80px;font-weight:700;color:var(--pink-deep);pointer-events:none;text-shadow:0 4px 0 #fff;z-index:5;}
.laserdot{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#FF2D55 32%,rgba(255,45,85,.35) 60%,transparent 70%);box-shadow:0 0 16px 4px rgba(255,45,85,.4);cursor:pointer;transition:left .12s,top .12s;}
.laserdot.hit{animation:pulse .2s;}
.basket{position:absolute;bottom:2%;font-size:52px;transform:translateX(-50%);z-index:2;pointer-events:none;line-height:1;}
.fall{position:absolute;top:-8%;font-size:34px;transform:translateX(-50%);pointer-events:none;line-height:1;}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;height:100%;align-content:center;}
.mcard{position:relative;aspect-ratio:3/4;border-radius:14px;perspective:600px;}
.mcard .front,.mcard .back{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .4s;box-shadow:var(--shadow-sm);}
.mcard .back{background:linear-gradient(180deg,#B18CFF,#8A52FF);}
.mcard .front{background:#fff;transform:rotateY(180deg);}
.mcard.up .back{transform:rotateY(180deg)}.mcard.up .front{transform:rotateY(0)}
.mcard.done .front{background:#D6F7EC;}
.sortcard{margin:14px auto 10px;width:150px;background:#fff;border-radius:18px;padding:10px;box-shadow:var(--shadow-sm);text-align:center;border:3px solid #EEE3F6;}
.sortcard.r-rare{border-color:#BFE6FF}.sortcard.r-super{border-color:#DCCBFF}.sortcard.r-legendary{border-color:#FFE082}
.sortcard .sc-thumb{width:100%;aspect-ratio:1;border-radius:12px;background:#FBF6FF;overflow:hidden;}
.sortcard .sc-thumb svg{width:100%;height:100%;}
.sortcard b{display:block;margin-top:4px;font-size:14px;}
.sortopts{display:flex;flex-direction:column;gap:8px;padding:0 14px;}
.sortopts .bigbtn{font-size:15px;}
.wrongopt{filter:grayscale(.5);opacity:.6;}

/* ===== COLLECTION ===== */
.coll-summary{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow-sm);margin-bottom:10px;}
.cs-ico{font-size:30px;line-height:1;}.cs-mid{flex:1;}.cs-mid b{display:block;margin-bottom:4px;}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;}
.catcell{background:#fff;border-radius:18px;padding:8px 6px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;}
.cc-art{width:80px;height:100px;overflow:hidden;}.cc-art svg{width:100%;height:100%;}
.cc-art.sil svg{filter:brightness(0) opacity(.22);}
.catcell b{font-family:"Fredoka";font-size:13px;}.catcell small{font-size:10px;color:var(--ink-soft);font-weight:700;line-height:1.15;}
.achlist{display:flex;flex-direction:column;gap:8px;}
.ach{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:9px 10px;box-shadow:var(--shadow-sm);text-align:left;}
.ach.done{background:linear-gradient(90deg,#fff,#EAFBF5);}
.ach .ae{font-size:26px;line-height:1;}
.ach>div{flex:1;min-width:0;}
.ach b{display:block;font-size:13px;}.ach small{display:block;font-size:11px;color:var(--ink-soft);font-weight:600;}
.ach .bar{margin-top:4px;height:8px;}
.achk{width:26px;height:26px;border-radius:50%;background:var(--mint);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;}
.ach .ar{flex:0 0 auto;font-size:11px;font-weight:700;color:#C98A00;text-align:right;}

/* ===== CAT HOUSE ===== */
.body.cathouse{padding:10px 0 calc(12px + var(--safe-b));display:flex;flex-direction:column;overflow:hidden;}
.ch-scroller{flex:1;min-height:0;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 14px 10px;scrollbar-width:none;}
.ch-scroller::-webkit-scrollbar{display:none}
.chcard{flex:0 0 min(84vw,340px);scroll-snap-align:center;background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border:3px solid transparent;}
.chcard.active{border-color:var(--pink);}
.chc-art{position:relative;height:42%;min-height:190px;background:#F6EEFB;display:flex;justify-content:center;flex:0 0 auto;}
.chc-art svg{height:100%;width:auto;}
.chc-art .sil{height:100%;}.chc-art .sil svg{filter:brightness(0) opacity(.18);}
.chc-art .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Fredoka";font-size:80px;font-weight:700;color:var(--ink-faint);}
.activetag{position:absolute;top:8px;left:8px;background:var(--pink);color:#fff;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;}
.bfbadge{position:absolute;top:8px;right:8px;background:#FFD23F;color:#7A5300;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;}
.chc-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1;}
.chc-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.chc-name b{font-family:"Fredoka";font-size:20px;color:var(--pink-deep);}
.chc-name small{width:100%;color:var(--ink-soft);font-weight:700;font-size:12px;}
.chc-mood{font-weight:700;font-size:13px;}
.chc-chips{display:flex;gap:5px;flex-wrap:wrap;}
.chc-chips .chip{font-size:11px;padding:3px 8px;}
.chc-bio{margin:0;font-size:13px;color:var(--ink-soft);font-weight:600;}
.chc-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;}
.chc-btns .bigbtn{flex:1;}
.chc-req{background:#FBF6FF;border-radius:12px;padding:8px 10px;font-size:12px;}
.chc-req b{display:block;margin-bottom:4px;}
.ch-dots{display:flex;justify-content:center;gap:5px;padding:4px 0 0;flex:0 0 auto;}
.ch-dots i{width:7px;height:7px;border-radius:50%;background:#D8CCE8;transition:transform .2s;}
.ch-dots i.on{background:var(--pink);transform:scale(1.35);}.ch-dots i.lk{background:#EEE5F5;}
.stories{display:flex;flex-direction:column;gap:8px;text-align:left;}
.story{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow-sm);}
.story.locked{opacity:.6;}.story b{color:var(--pink-deep);}.story p{margin:4px 0 0;font-size:13px;}

/* ===== MISSIONS ===== */
.chestcard{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,#FFF1C9,#FFE0EE);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow-sm);margin-bottom:10px;}
.chestcard.ready{background:linear-gradient(120deg,#FFE27A,#FFC318);animation:pulse 1.8s infinite;}
.chestcard.claimed{opacity:.8;}
.chest-ico{font-size:34px;line-height:1;}
.chestcard>div{flex:1;min-width:0;}
.chestcard b{display:block;font-size:14px;}.chestcard small{font-size:11px;font-weight:600;color:var(--ink-soft);}
.mlist{display:flex;flex-direction:column;gap:8px;}
.mission,.streakcard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:9px 10px;box-shadow:var(--shadow-sm);width:100%;text-align:left;position:relative;}
.mission.done{background:linear-gradient(90deg,#fff,#EAFBF5);}
.mission .me,.streakcard .me{font-size:26px;line-height:1;}
.mm{flex:1;min-width:0;}
.mm b{display:block;font-size:13px;}.mm small{display:block;font-size:11px;color:var(--ink-soft);font-weight:600;}
.mm .bar{margin:4px 0;height:8px;}
.streakcard{margin-top:10px;}
.streakcard.ready{background:linear-gradient(120deg,#FFF1C9,#FFE0EE);}
.streakcard .rdot{position:static;}
.ms-note{display:block;text-align:center;color:var(--ink-soft);font-weight:600;margin-top:12px;font-size:12px;}

/* ===== ONBOARDING ===== */
.body.onboard{display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#FFE3F1,#EBDCFF 60%,#DDF6FF);}
.ob-card{width:100%;max-width:440px;background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:20px 18px;text-align:center;animation:popIn .4s cubic-bezier(.2,1.3,.4,1);max-height:100%;overflow-y:auto;}
.ob-title{font-family:"Fredoka";font-weight:700;font-size:46px;line-height:1;background:linear-gradient(90deg,#FF6FB5,#9B6BFF,#5BC8FF);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 10px;}
.ob-cats{display:flex;justify-content:center;}
.ob-mini{width:100px;animation:bob 3s ease-in-out infinite;}.ob-mini svg{width:100%;height:auto;}
.ob-p{font-weight:600;color:var(--ink-soft);margin:8px 0 14px;}

<script id="cgs-guard">/* Boot guard — lives in its own <script> so it still runs when the main game script fails to parse.

(function(){
  var EXPECTED=570150, BUILD="2026-09-29";
  var errs=[], shown=false; window.__cgsErrors=errs;
  window.addEventListener("error",function(e){ try{ errs.push({msg:String(e.message||"unknown error"),line:e.lineno||0,col:e.colno||0,stack:(e.error&&e.error.stack)||""}); }catch(x){} setTimeout(check,60); });

  document.addEventListener("DOMContentLoaded",function(){ setTimeout(check,6000); });
  window.addEventListener("load",function(){ setTimeout(check,6000); });
  setTimeout(check,12000);
  function check(){ if(shown||window.__cgsBooted) return; var hard=[]; for(var i=0;i<errs.length;i++) if(!errs[i].soft) hard.push(errs[i]); if(!hard.length&&document.readyState==="loading") return; if(!hard.length&&!timedOut()) return; shown=true; render(hard[0]); }
  var t0=+new Date(); function timedOut(){ return (+new Date()-t0)>5500; }
  function esc(s){ return String(s).replace(/&/g,"&"+"amp;").replace(/</g,"&"+"lt;").replace(/>/g,"&"+"gt;"); }
  function render(e){
    var sc=document.getElementById("cgs-main"), text=sc?String(sc.text||sc.textContent||""):"", len=text.length;
    var complete=/CGS-END/.test(text.slice(-300)), storage="no";
    try{ localStorage.setItem("__cgs_g","1"); localStorage.removeItem("__cgs_g"); storage="yes"; }catch(x){ storage="blocked ("+(x&&x.name||"error")+")"; }
    var inFrame=false; try{ inFrame=window.top!==window.self; }catch(x){ inFrame=true; }
    var host=""; try{ host=location.host; }catch(x){}
    var gas=!!(window.google&&window.google.script&&window.google.script.run);
    var reason, fix;
    if(!sc){ reason="Only the styling arrived — the page does not contain the game code at all."; fix="The HTML file that is being served is missing its script part. Use the whole cat-glam-studio.html file, or serve it from Google Drive with HTML_FILE_ID in Code.gs."; }
    else if(!complete||len<EXPECTED*0.9){ reason="The game code is incomplete: "+len.toLocaleString()+" of "+EXPECTED.toLocaleString()+" characters arrived, so the copy into the Apps Script editor was probably cut short."; fix="Easiest fix: upload cat-glam-studio.html to Google Drive, put its file ID in <b>HTML_FILE_ID</b> at the top of Code.gs and save. Or paste the file again and make sure the very end (…/*CGS-END*/) is there."; }
    else if(e&&/already been declared/i.test(e.msg)){ reason="A name in the game code clashes with the page it is embedded in: "+esc(e.msg)+"."; fix="Please send these details to the developer."; }
    else if(e&&/SyntaxError/i.test(e.msg)){ reason="The game code arrived complete but was changed on the way ("+esc(e.msg)+", line "+e.line+")."; fix="Serve the original file from Google Drive using <b>HTML_FILE_ID</b> in Code.gs instead of pasting it into the editor."; }
    else if(e){ reason="Something went wrong while starting: "+esc(e.msg)+(e.line?" (line "+e.line+")":"")+"."; fix="Try reloading. If it keeps happening, copy the details below and send them to the developer."; }
    else { reason="No error was reported, but the game never appeared."; fix="Try reloading the page. If it keeps happening, copy the details below and send them to the developer."; }
    var details=["Cat Glam Studio build "+BUILD, "error: "+(e?e.msg+" @ line "+e.line+":"+e.col:"none"), "code: "+len+" / "+EXPECTED+" chars, end marker "+(complete?"present":"MISSING"),
      "host: "+host+(inFrame?" (in iframe)":""), "google.script: "+(gas?"yes":"no"), "localStorage: "+storage, "mode: "+document.compatMode, "ua: "+navigator.userAgent, e&&e.stack?"stack: "+e.stack.split("\n").slice(0,4).join(" | "):""].join("\n");
    var card=document.createElement("div"); card.id="cgs-guard-card";
    card.setAttribute("style","position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;overflow:auto;background:#2B1F4A;color:#fff;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px;box-sizing:border-box");
    card.innerHTML='<div style="max-width:560px;margin:0 auto;background:#fff;color:#2B1F4A;border-radius:22px;padding:22px 20px;box-shadow:0 12px 40px rgba(0,0,0,.35)">'+
      '<div style="font-size:44px;line-height:1;text-align:center">😿</div><h2 style="margin:10px 0 6px;text-align:center;font-size:22px">Cat Glam Studio couldn\'t start</h2>'+
      '<p style="margin:8px 0"><b>Why:</b> '+reason+'</p><p style="margin:8px 0"><b>Fix:</b> '+fix+'</p>'+
      '<textarea readonly style="width:100%;height:150px;box-sizing:border-box;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:2px solid #E6DFF5;border-radius:12px;padding:10px;color:#4A3F6B;background:#FAF8FF;resize:vertical">'+esc(details)+'</textarea>'+
      '<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button id="cgsGuardCopy" style="flex:1;min-width:140px;padding:12px;border:0;border-radius:14px;background:#7C5CFF;color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer">📋 Copy details</button>'+
      '<button id="cgsGuardReload" style="flex:1;min-width:140px;padding:12px;border:0;border-radius:14px;background:#FF6FA5;color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer">🔄 Try again</button></div></div>';
    (document.body||document.documentElement).appendChild(card);
    var ta=card.querySelector("textarea");
    card.querySelector("#cgsGuardCopy").onclick=function(){ ta.select(); try{ document.execCommand("copy"); }catch(x){} if(navigator.clipboard){ try{ navigator.clipboard.writeText(details); }catch(x){} } this.textContent="✅ Copied"; };
    card.querySelector("#cgsGuardReload").onclick=function(){ location.reload(); };
  }
})();

<script id="cgs-main">
/* Cat Glam Studio v2 — built 2026-09-29
   Single-file game. Modules: Util · Audio · Data · Art · State/Save · Game · Systems · UI · Rooms · Screens · Onboarding · Voice · Boot */
(function(){

/* ================= 00-util ================= */
"use strict";
/* =====================================================================
   UTIL — tiny helpers, event bus, deterministic randomness, dates
   ===================================================================== */
const ITEM_DRAWS = {};   // filled by the drawing modules
const SCENE_DRAWS = {};
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
const ESC_MAP={"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;",'"':"&"+"quot;","'":"&"+"#39;"}; // split so no HTML processor can "decode" them inside the script
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>ESC_MAP[c]); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
/* mulberry32 — deterministic PRNG for daily rotations */
function seeded(seed){ let a=seed>>>0; return function(){ a+=0x6D2B79F5; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function seededPick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function seededShuffle(rng,arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayNum(s){ const d=s?new Date(s+"T00:00:00"):new Date(); return Math.floor(d.getTime()/864e5); }
function fmt(n){ n=Math.round(n); return n>=10000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":String(n); }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function debounce(fn,ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);}; }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

/* event bus — systems emit, UI listens */
const Bus = (()=>{ const m={}; return {
  on(ev,fn){ (m[ev]=m[ev]||[]).push(fn); return ()=>Bus.off(ev,fn); },
  off(ev,fn){ if(m[ev]) m[ev]=m[ev].filter(f=>f!==fn); },
  emit(ev,data){ (m[ev]||[]).slice().forEach(f=>{ try{f(data);}catch(e){console.error("Bus["+ev+"]",e);} }); }
};})();

/* safe storage (localStorage may be unavailable in some webviews) */
const Store=(()=>{ let ok=false,mem={};
  try{ localStorage.setItem("__cgs_t","1"); localStorage.removeItem("__cgs_t"); ok=true; }catch(e){}
  return { ok,
    get(k){ try{ return ok?localStorage.getItem(k):(mem[k]??null);}catch(e){return mem[k]??null;} },
    set(k,v){ try{ if(ok) localStorage.setItem(k,v); else mem[k]=v; }catch(e){ mem[k]=v; } },
    del(k){ try{ if(ok) localStorage.removeItem(k); delete mem[k]; }catch(e){} } };
})();

/* =====================================================================

   ===================================================================== */
const Sfx = (() => {
  let ctx=null, master=null, muted=false, noiseBuf=null;
  function ac(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination);}catch(e){} }
    if(ctx&&ctx.state==="suspended") ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(f,d,type,v,opts){
    if(muted) return; const c=ac(); if(!c) return; opts=opts||{};
    const o=c.createOscillator(), g=c.createGain(); o.type=type||"sine"; o.frequency.value=f;
    if(opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide,c.currentTime+d);
    g.gain.value=0; o.connect(g); g.connect(master);
    const n=c.currentTime+(opts.at||0);
    g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(v||.18,n+(opts.attack||.012)); g.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.start(n); o.stop(n+d+.02);
  }
  function noise(d,v,opts){ // filtered noise burst (applause, splash, camera)
    if(muted) return; const c=ac(); if(!c) return; opts=opts||{};
    if(!noiseBuf){ noiseBuf=c.createBuffer(1,c.sampleRate*1.5,c.sampleRate); const data=noiseBuf.getChannelData(0); for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1; }
    const src=c.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const f=c.createBiquadFilter(); f.type=opts.type||"bandpass"; f.frequency.value=opts.freq||1800; f.Q.value=opts.q||.8;
    const g=c.createGain(); const n=c.currentTime+(opts.at||0);

    src.connect(f); f.connect(g); g.connect(master); src.start(n); src.stop(n+d+.05);
  }
  const seq=(notes,step,d,type,v)=>notes.forEach((f,i)=>tone(f,d,type,v,{at:i*step}));
  const api={
    unlock(){ ac(); },
    setMuted(m){ muted=!!m; if(!muted) api.tap(); },

    star(){ seq([1046,1318,1568,2093],.07,.16,"sine",.14); },
    xp(){ tone(740,.08,"triangle",.09); tone(880,.1,"triangle",.09,{at:.05}); },
    buy(){ tone(660,.08,"triangle",.14); tone(880,.08,"triangle",.14,{at:.08}); tone(1320,.18,"triangle",.14,{at:.16}); },
    unlock(){ seq([784,988,1175,1568],.08,.22,"triangle",.16); tone(2093,.4,"sine",.1,{at:.34}); },
    correct(){ tone(880,.1,"triangle",.16); tone(1175,.16,"triangle",.16,{at:.09}); },
    wrong(){ tone(330,.16,"sawtooth",.07); tone(262,.22,"sawtooth",.06,{at:.12}); },
    levelup(){ seq([523,659,784,1047,1319,1568],.09,.3,"triangle",.18); tone(2093,.7,"sine",.14,{at:.6}); noise(.5,.06,{freq:3000,at:.6}); },
    heart(){ tone(1046,.09,"sine",.1); tone(1318,.12,"sine",.1,{at:.07}); },
    purr(){ if(muted) return; const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
      o.type="sawtooth"; o.frequency.value=48; l.frequency.value=22; lg.gain.value=18; l.connect(lg); lg.connect(o.frequency);
      g.gain.value=0; o.connect(g); g.connect(master); const n=c.currentTime; g.gain.linearRampToValueAtTime(.09,n+.05); g.gain.linearRampToValueAtTime(.0001,n+.7); o.start(n); l.start(n); o.stop(n+.75); l.stop(n+.75); },
    nom(){ tone(300,.07,"square",.08); tone(240,.07,"square",.08,{at:.1}); tone(300,.07,"square",.08,{at:.2}); },
    splash(){ noise(.35,.14,{freq:900,q:.5}); tone(500,.2,"sine",.08,{slide:200}); },

    zzz(){ tone(392,.25,"sine",.06); tone(330,.3,"sine",.05,{at:.25}); },
    whoosh(){ noise(.3,.1,{freq:1200,type:"lowpass",attack:.05}); },
    camera(){ noise(.05,.25,{freq:4000,q:1.5,attack:.003}); tone(2500,.04,"square",.05); },
    applause(){ for(let i=0;i<14;i++) noise(.12,.06+Math.random()*.05,{freq:2200+Math.random()*1200,q:.6,at:i*.11+Math.random()*.04}); },
    cheer(){ api.applause(); seq([784,988,1175],.1,.25,"triangle",.1); },

/* ================= 06b-cloud ================= */
/* =====================================================================
   CLOUD — one way to call the Apps Script backend (loadState / saveState / voiceAvailable / getVoiceToken)
   · inside the Apps Script page: google.script.run
   · anywhere else (the game hosted at its own address, or the own-window copy after its opener closed):
     fetch() to the web app's /exec link (POST, text/plain body → no CORS preflight; Apps Script answers JSON)
   The link comes from window.CGS_API_URL (injected by Code.gs, or baked into the file) or from Settings.
   ===================================================================== */
const Cloud=(()=>{
  const KEY="cgs_api";
  function frameRun(){ try{ return (typeof google!=="undefined"&&google&&google.script&&google.script.run)?google.script.run:null; }catch(e){ return null; } }
  function url(){ return String(Store.get(KEY)||window.CGS_API_URL||"").trim(); }
  function setUrl(u){ u=String(u||"").trim(); if(u) Store.set(KEY,u); else Store.del(KEY); }
  function looksLikeLink(u){ return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/(exec|dev)\/?$/.test(String(u||"").trim())||/^https:\/\/script\.google\.com\/a\/macros\/[^/]+\/s\/[\w-]+\/(exec|dev)\/?$/.test(String(u||"").trim()); }
  function available(){ return !!(frameRun()||url()); }
  function mode(){ return frameRun()?"frame":url()?"link":"none"; }
  function call(fn,...args){
    const run=frameRun();
    if(run) return new Promise((res,rej)=>{ let done=false; const t=setTimeout(()=>{ if(!done){ done=true; rej(new Error("The cloud didn't answer.")); } },15000);
      try{ run.withSuccessHandler(v=>{ if(done) return; done=true; clearTimeout(t); res(v); }).withFailureHandler(e=>{ if(done) return; done=true; clearTimeout(t); rej(new Error(String(e&&e.message||e))); })[fn](...args); }
      catch(e){ if(!done){ done=true; clearTimeout(t); rej(e); } } });
    const u=url(); if(!u) return Promise.reject(new Error("No cloud link."));
    const ctrl=("AbortController" in window)?new AbortController():null; const timer=ctrl?setTimeout(()=>ctrl.abort(),20000):null;
    return fetch(u,{ method:"POST", body:JSON.stringify({fn,args}), headers:{"Content-Type":"text/plain;charset=utf-8"}, redirect:"follow", signal:ctrl?ctrl.signal:undefined })
      .then(async r=>{ const txt=await r.text(); let j=null; try{ j=JSON.parse(txt); }catch(e){}
        if(!j||typeof j!=="object"){ if(/accounts\.google\.com|Sign in|<html/i.test(txt)) throw new Error("The cloud link needs the web app deployed with access set to 'Anyone'."); throw new Error("The cloud link didn't answer with game data (HTTP "+r.status+")."); }
        if(!j.ok) throw new Error(j.error||"Cloud error."); return j.result; })
      .catch(e=>{ throw (e&&e.name==="AbortError")?new Error("The cloud link took too long to answer."):(e instanceof TypeError?new Error("Could not reach the cloud link (offline, or a blocked connection)."):e); })
      .finally(()=>{ if(timer) clearTimeout(timer); });
  }
  return { url, setUrl, looksLikeLink, available, mode, call, get inFrame(){ return !!frameRun(); } };
})();

/* ================= 03b-draws-extras ================= */
/* ITEM_DRAWS — costumes, shoes, back accessories, hand items */
(() => {
const {HEART, STAR, RAINBOW, bow, star, heart, dot, sparkles, onesieBase, hoodBase, flatsBase, sneakerBase, bootsBase, tallBootsBase, sandalsBase, slippersBase, wingsBase, capeBase, round, rainbowStops} = Art.H;

/* ---- local helpers ---- */
const M = s => `<g transform="translate(360 0) scale(-1 1)">${s}</g>`;            // mirrored copy (left → right)
const both = s => s + M(s);
const pair = s => `<g transform="translate(164 492)">${s}</g><g transform="translate(196 492)">${s}</g>`;             // same shape on both paws
const pairM = s => `<g transform="translate(164 492)">${s}</g><g transform="translate(196 492) scale(-1 1)">${s}</g>`; // mirrored on the right paw
const line = (d,c,w,o) => `<path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"${o?` opacity="${o}"`:""}/>`;
// onesie pieces (legs first so a stroke never shows where legs meet the torso)
const TORSO = "M138 246 Q116 252 112 282 L118 372 Q180 392 242 372 L248 282 Q244 252 222 246 Q180 238 138 246 Z";
