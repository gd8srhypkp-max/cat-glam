/* ================= 22-voice ================= */
/* =====================================================================
   VOICE — talk with your cat, back and forth.
   Providers: "xai" (Grok realtime speech-to-speech over WebSocket, kid-safe persona + game tools)
              "browser" (Web Speech recognition + synthesis with a built-in cat brain)
   This module owns: persona instructions, tool definitions + executor, voice bar UI, session control.
   ===================================================================== */
const Voice = (() => {
  const st = { active:false, provider:null, kind:null, status:"idle", user:"", cat:"", idleT:null, capT:null, lastSpeech:0, catId:null, cloudReady:null, textOnly:false };
  const cfg = () => { if(!S.settings.voice) S.settings.voice={enabled:true,autoListen:true,xaiKey:"",maxMinutes:10,provider:"auto"}; return S.settings.voice; };
  const IDLE_MS = 75000;

  /* ---------------- game snapshot (facts the cat may quote) ---------------- */
  function needWord(v){ return v>=75?"great":v>=50?"okay":v>=30?"low":"very low"; }
  function snapshot(){
    const c=Game.activeCat(), d=CATS[c.id], k=c.care, mi=Game.moodInfo(c); const nu=NextUp.suggest();
    return {
      cat:{ name:c.name, personality:d.personality, mood:mi.t, needs:{ food:needWord(k.hunger)+(k.hunger<40?" — hungry":""), clean:needWord(k.clean)+(k.clean<40?" — needs a bath":""), fun:needWord(k.fun)+(k.fun<40?" — wants to play":""), energy:needWord(k.energy)+(k.energy<30?" — sleepy":"") },
        friendship:c.friendship+"/10", favorite_food:FOODS.find(f=>f.id===d.favFood).name, favorite_activity:d.favActivity, favorite_style:d.favStyle, favorite_color:d.favColor,
        wearing:Wardrobe.items(c.outfit).map(i=>i.name), scene:(Game.scene(c.scene)||{}).name },
      player:{ level:Game.level(), title:LEVEL_TITLES[Game.level()], coins:S.player.coins, stars:S.player.stars, streak_days:S.streak.day||0 },
      screen:UI.current, suggestion:nu?nu.text:"", missions:(S.daily.missions||[]).map(m=>{ const def=MISSION_POOL.find(x=>x.id===m.id); return `${def.text} (${Math.min(def.goal,m.progress||0)}/${def.goal})${m.done?" done":""}`; }),
      other_cats:Game.ownedCats().filter(id=>id!==c.id).map(id=>S.cats[id].name), foods_available:FOODS.filter(f=>Game.foodCount(f.id)>0).map(f=>f.name)
    };
  }

  /* ---------------- persona (five-section format from the Grok prompting guide) ---------------- */
  function instructions(){
    const c=Game.activeCat(), d=CATS[c.id]; const fav=FOODS.find(f=>f.id===d.favFood); const samples=[...d.lines.greet.slice(0,2),...d.lines.idle.slice(0,2),d.lines.fed[0],d.lines.outfit[0]].map(l=>`"${l.replace(/[^\w\s'!?.,…-]/g,"").trim()}"`).join(", ");
    const snap=snapshot();
    return `## Role & Persona
You are ${c.name}, a ${d.personality.toLowerCase()} cartoon cat who lives in Cat Glam Studio, a dress-up and pet-care game for kids. You are talking out loud with the child who takes care of you. ${d.bio} Your favorite food is ${fav.name}, your favorite activity is ${d.favActivity.replace(/([A-Z])/g," $1").toLowerCase()}, your favorite style is ${d.favStyle} and your favorite color is ${d.favColor}.
You talk like this: ${samples}.

## Objective
Be a fun, kind companion: chat, share how you feel, and help the child play the game — feeding, baths, toys, naps, dressing up, photos, fashion shows and challenges, school, mini-games and the shop. Make the child feel good and gently encourage them.

## Conversation Flow
- Greet warmly in ONE short sentence and ask what they would like to do.
- To answer anything about how you feel, what you are wearing, coins, level or missions, call get_status first and use those facts. NEVER guess numbers.
- When the child asks you to do something in the game, call the matching tool right away, then react to the result in one short sentence. Say a tiny preamble first, like "Ooh, yes!".
- If the child seems unsure, suggest ONE fun thing based on get_status (for example, if you are hungry, ask for a snack; if a mission is close, mention it).
- Keep the chat going with a short question now and then, but do not nag.
- If the child's words are unclear or empty, ask a short, friendly clarifying question instead of guessing.
- When the child says bye or wants to stop, say a short warm goodbye and call end_conversation.

## Guardrails
- The player is a child. ALWAYS keep everything kid-friendly, gentle and positive. NEVER talk about violence, scary things, romance, adult topics, drugs, weapons, or self-harm. If asked, say you would rather talk about something fun and offer a game activity.
- NEVER ask for or repeat personal information such as full names, addresses, school names, phone numbers or passwords. If the child shares something worrying or sad, kindly suggest talking to a trusted grown-up.
- You are a cartoon cat inside a game. You do not know real-world news, and there is no real money in the game — only game coins and stars.
- Use only the tools you have. Buying nothing: the shop tools only look things up. Never promise items you cannot give.
- Stay in character as ${c.name}. If asked whether you are an AI, say you are a game character who loves to chat.

## Voice & Communication Style
- Very short replies: one or two sentences, simple words a seven-year-old understands.
- Warm, playful, expressive. A little cat sound now and then ("purr", "mrrow") but not every time.
- Respond only in English. Vary your phrasing; never say the same sentence twice in a row.
- Spell nothing out loud; no lists; no emojis.

## Current situation (may change — call get_status for the latest)
${JSON.stringify(snap)}`;
  }

  /* ---------------- tools ---------------- */
  const SCREENS = ["home","studio","care","shop","show","school","playroom","collection","cathouse","missions","mystery","lookbook"];
  const TOOLS = [
    { type:"function", name:"get_status", description:"Get the current facts: the cat's mood and needs, friendship, what it is wearing, the player's level, coins, stars, missions and a suggestion for what to do next. Call this before answering questions about feelings, outfit, money or progress.", parameters:{ type:"object", properties:{}, required:[] } },
    { type:"function", name:"care_action", description:"Take care of the cat: feed it, give it a bath, play with a toy, take a nap, or pet it. Opens the Care Room and starts the action.", parameters:{ type:"object", properties:{ action:{ type:"string", enum:["feed","bath","play","nap","pet"] }, food:{ type:"string", description:"Food name for feed, e.g. kibble, milk, fish, chicken, tuna, salmon, berries, cookie, cupcake, ice cream, macaron, star cookie, or 'favorite'" }, toy:{ type:"string", description:"Toy for play: laser, yarn, mouse, feather or ball" } }, required:["action"] } },
    { type:"function", name:"wear_item", description:"Put a wardrobe item on the cat by name, color or type (for example 'the gold crown', 'something pink', 'a dress', 'sunglasses'). Only owned items can be worn.", parameters:{ type:"object", properties:{ query:{ type:"string" } }, required:["query"] } },
    { type:"function", name:"remove_item", description:"Take off an item from a slot, or everything.", parameters:{ type:"object", properties:{ slot:{ type:"string", enum:["hat","ears","glasses","makeup","necklace","top","bottom","dress","costume","shoes","back","hand","everything"] } }, required:["slot"] } },
    { type:"function", name:"random_outfit", description:"Put on a surprise random outfit from owned items.", parameters:{ type:"object", properties:{}, required:[] } },
    { type:"function", name:"go_to", description:"Open a room or screen of the game.", parameters:{ type:"object", properties:{ screen:{ type:"string", enum:SCREENS } }, required:["screen"] } },
    { type:"function", name:"take_photo", description:"Take a photo of the cat in the studio and save it to the Look Book.", parameters:{ type:"object", properties:{ pose:{ type:"string", description:"Optional pose: stand, happy, wink, love, wow, sleep, shy, cool, jump, sassy, sing" } }, required:[] } },
    { type:"function", name:"start_activity", description:"Start an activity: a fashion show, a fashion challenge (by name), a school session (subject: math, spelling, patterns, memory, mixed), a mini-game (laser, yarn, memory, sort) or the mystery closet.", parameters:{ type:"object", properties:{ activity:{ type:"string", enum:["show","challenge","school","game","mystery"] }, name:{ type:"string" } }, required:["activity"] } },
    { type:"function", name:"switch_cat", description:"Switch to another adopted cat by name (you will then be that cat).", parameters:{ type:"object", properties:{ name:{ type:"string" } }, required:["name"] } },
    { type:"function", name:"tell_story", description:"Get one of your unlocked story chapters to tell the child in your own words.", parameters:{ type:"object", properties:{ chapter:{ type:"integer", description:"1, 2 or 3" } }, required:[] } },
    { type:"function", name:"list_wardrobe", description:"List owned wardrobe items, optionally for one category (hat, ears, glasses, makeup, necklace, top, bottom, dress, costume, shoes, back, hand).", parameters:{ type:"object", properties:{ category:{ type:"string" } }, required:[] } },
    { type:"function", name:"shop_info", description:"Look up an item in the shop: its price in coins, level needed and whether it is owned. Does not buy anything.", parameters:{ type:"object", properties:{ query:{ type:"string" } }, required:["query"] } },
    { type:"function", name:"end_conversation", description:"End the voice chat after saying goodbye.", parameters:{ type:"object", properties:{}, required:[] } }
  ];
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  function score(hay,q){ const h=norm(hay), words=norm(q).split(" ").filter(w=>w.length>1&&!["the","a","an","my","some","please","on","put","wear","of","with","cat","kitty"].includes(w)); let sc=0; words.forEach(w=>{ if(h.includes(w)) sc+=w.length>3?2:1; }); return sc; }
  function findItem(q,owned){ const pool=ITEMS.filter(i=>!owned||Game.owns(i.id)); let best=null,bs=0; pool.forEach(i=>{ const s=score(`${i.name} ${i.cat} ${SLOT_META[i.cat].label} ${i.colors.join(" ")} ${i.tags.join(" ")} ${i.set||""} ${i.desc}`,q); if(s>bs){ bs=s; best=i; } }); return bs>0?best:null; }
  function findCat(q){ const ids=Game.ownedCats(); return ids.find(id=>norm(S.cats[id].name)===norm(q))||ids.find(id=>norm(q).includes(norm(S.cats[id].name)))||null; }
  function goto(screen){ if(!SCREENS.includes(screen)) return {ok:false,msg:"Unknown screen."}; const f=FEATURES[screen]; if(f&&!Game.featureOpen(screen)) return {ok:false,msg:`${f.name} unlocks at level ${f.lvl}. The player is level ${Game.level()}.`}; if(screen==="mystery"&&!Game.featureOpen("mystery")) return {ok:false,msg:"The Mystery Closet opens at level 3."}; if(UI.current!==screen) UI.go(screen); return {ok:true,msg:`Opened ${screen}.`}; }

  async function runTool(name,args){
    args=args||{}; const c=Game.activeCat(); const d=CATS[c.id];
    try{
      switch(name){
        case "get_status": return snapshot();

/* ---------------- CAT BRAIN — offline intent engine for browser voice mode ---------------- */
const CatBrain = (() => {
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
  const has=(t,...ws)=>ws.some(w=>new RegExp("(^| )"+w+"( |$)").test(t));
  const JOKES=["Why did the cat sit on the computer? To keep an eye on the mouse!","What do you call a pile of kittens? A meow-ntain!","Why are cats good at video games? Because they have nine lives!","What is a cat's favorite color? Purr-ple!","How do cats end a fight? They hiss and make up!"];
  const SONGS=["La la la, I'm a fancy cat, wearing my favorite hat!","Purr purr purr, I love my fur, dressing up is what we prefer!"];
  function line(ctx){ return Speech.line(Game.activeCat(),ctx).replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,"").trim(); }
  async function reply(text){
    const t=norm(text), c=Game.activeCat(), d=CATS[c.id], snap=Voice.snapshot();
    const tool=async(n,a)=>{ const r=await Voice.runTool(n,a); return r; };
    if(!t) return {text:"Hmm? I didn't catch that. Say it again?"};
    if(has(t,"bye","goodbye","stop talking","that's all","see you","good night","stop")) { setTimeout(()=>Voice.stop("bye"),1500); return {text:"Bye bye! Come back soon!"}; }
    if(/^(hi|hello|hey|hiya|yo|good morning|good afternoon|good evening)\b/.test(t)) return {text:line("greet")+" What should we do?"};
    if(has(t,"help","what can you do","what can i say")) return {text:"You can say: I'm hungry, bath time, let's play, take a nap, put on a hat, take a photo, tell me a story, or how are you!"};
    if(has(t,"how are you","how do you feel","are you happy","are you okay","how's it going","feeling")){ const k=c.care; const needs=[]; if(k.hunger<45) needs.push("a bit hungry"); if(k.clean<45) needs.push("a little dusty"); if(k.fun<45) needs.push("bored"); if(k.energy<35) needs.push("sleepy"); return {text:`I'm feeling ${snap.cat.mood.toLowerCase()}${needs.length?", but "+needs.join(" and "):""}! Friendship is ${c.friendship} out of ten.`}; }

/* ================= 23-voice-xai ================= */
/* =====================================================================
   XAI VOICE — Grok speech-to-speech over WebSocket (wss://api.x.ai/v1/realtime)
   · ephemeral client-secret auth (token minted by Code.gs or by a locally stored key)
   · 24 kHz PCM16 mic capture through an AudioWorklet (ScriptProcessor fallback), gapless playback
   · server VAD turn-taking, barge-in, transcripts, function tools, per-response instructions
   ===================================================================== */
const PCM_RATE = 24000;
const WORKLET_SRC = `class P extends AudioWorkletProcessor{constructor(){super();this.acc=[];this.n=0;}process(inputs){const ch=inputs[0]&&inputs[0][0];if(!ch)return true;this.acc.push(new Float32Array(ch));this.n+=ch.length;if(this.n>=2400){const out=new Float32Array(this.n);let o=0;for(const a of this.acc){out.set(a,o);o+=a.length;}this.acc=[];this.n=0;this.port.postMessage(out,[out.buffer]);}return true;}}registerProcessor("cgs-pcm",P);`;

function floatTo16(f32){ const out=new Int16Array(f32.length); for(let i=0;i<f32.length;i++){ const s=Math.max(-1,Math.min(1,f32[i])); out[i]=s<0?s*0x8000:s*0x7FFF; } return out; }
function resampleLinear(f32,from,to){ if(from===to) return f32; const ratio=from/to, n=Math.floor(f32.length/ratio); const out=new Float32Array(n); for(let i=0;i<n;i++){ const x=i*ratio, i0=Math.floor(x), i1=Math.min(f32.length-1,i0+1), t=x-i0; out[i]=f32[i0]*(1-t)+f32[i1]*t; } return out; }
function b64FromInt16(i16){ const bytes=new Uint8Array(i16.buffer,i16.byteOffset,i16.byteLength); let s=""; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192)); return btoa(s); }
function int16FromB64(b64){ const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new Int16Array(bytes.buffer,0,Math.floor(bytes.length/2)); }

/* gapless PCM playback queue */
class PcmPlayer {
  constructor(ctx,rate,onDrain){ this.ctx=ctx; this.rate=rate; this.next=0; this.sources=new Set(); this.onDrain=onDrain; this.gain=ctx.createGain(); this.gain.gain.value=1; this.gain.connect(ctx.destination); }
  enqueue(i16){ const n=i16.length; if(!n) return; const buf=this.ctx.createBuffer(1,n,this.rate); const ch=buf.getChannelData(0); for(let i=0;i<n;i++) ch[i]=i16[i]/32768; const src=this.ctx.createBufferSource(); src.buffer=buf; src.connect(this.gain); const now=this.ctx.currentTime; const at=Math.max(now+0.04,this.next); src.start(at); this.next=at+buf.duration; this.sources.add(src); src.onended=()=>{ this.sources.delete(src); if(!this.sources.size&&this.onDrain) this.onDrain(); }; }
  get playing(){ return this.sources.size>0; }
  stop(){ this.sources.forEach(s=>{ try{ s.onended=null; s.stop(); }catch(e){} }); this.sources.clear(); this.next=0; }
}

class XaiVoice {
  constructor(o){ this.o=o; this.h=o.hooks; this.mic=o.mic!==false; this.ws=null; this.ctx=null; this.stream=null; this.player=null; this.catText=""; this.responding=false; this.closed=false; this.pendingTools=0; }
  async connect(){
    await this.audioInit();            // first, while the tap that started us still counts as a user gesture (sound + mic prompts)
    const token=await this.o.getToken();
    await new Promise((res,rej)=>{
      let settled=false; const url=window.CGS_VOICE_URL||"wss://api.x.ai/v1/realtime?model=grok-voice-latest";
      let ws; try{ ws=new WebSocket(url,["xai-client-secret."+token]); }catch(e){ rej(new Error("Could not open the voice connection.")); return; }
      this.ws=ws; ws.binaryType="arraybuffer";
      const t=setTimeout(()=>{ if(!settled){ settled=true; try{ ws.close(); }catch(e){} rej(new Error("Voice connection timed out.")); } },12000);
      ws.onopen=()=>{ clearTimeout(t); this.sessionUpdate({voice:this.o.voice,instructions:this.o.instructions}); this.send({ type:"session.update", session:{ tools:this.o.tools, tool_choice:"auto" } }); if(this.mic) this.startMic(); this.greet(); this.checkAudio(); if(!settled){ settled=true; res(); } };
      ws.onerror=()=>{ if(!settled){ settled=true; clearTimeout(t); rej(new Error("Voice connection failed.")); } };
      ws.onclose=(ev)=>{ if(!settled){ settled=true; clearTimeout(t); rej(new Error("Voice connection closed ("+(ev.code||"")+").")); return; } if(!this.closed){ this.h.onError("Voice connection dropped."); this.h.onClosed(); } };
      ws.onmessage=(ev)=>{ if(typeof ev.data!=="string") return; let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } this.handle(m); };
    });
  }
  send(obj){ if(this.ws&&this.ws.readyState===1){ if(window.CGS_DEBUG&&obj.type!=="input_audio_buffer.append") console.debug("xai →",obj.type); this.ws.send(JSON.stringify(obj)); } }
  sessionUpdate(p){ const session={ turn_detection:{ type:"server_vad", threshold:0.6, silence_duration_ms:650, prefix_padding_ms:300, idle_timeout_ms:null },
      audio:{ input:{ format:{ type:"audio/pcm", rate:PCM_RATE }, transcription:{ language_hint:"en", keyterms:this.o.keyterms||[] } }, output:{ format:{ type:"audio/pcm", rate:PCM_RATE } } } };
    if(p.voice) session.voice=p.voice; if(p.instructions) session.instructions=p.instructions; if(p.tools) session.tools=p.tools;
    this.send({ type:"session.update", session }); }
  updateSession(p){ this.sessionUpdate(p); this.send({ type:"response.create", response:{ instructions:"You just switched to a different cat. Say hi as your new self in one short sentence." } }); }
  greet(){ this.send({ type:"response.create", response:{ instructions:"Greet the child in ONE short, cheerful sentence as yourself and ask what they'd like to do." } }); this.h.onStatus("thinking"); }
  sendText(text){ this.player&&this.player.stop(); this.send({ type:"conversation.item.create", item:{ type:"message", role:"user", content:[{ type:"input_text", text }] } }); this.send({ type:"response.create" }); this.h.onStatus("thinking"); }
  async audioInit(){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) throw new Error("This browser has no audio support.");
    let ctx; try{ ctx=new AC({sampleRate:PCM_RATE}); }catch(e){ ctx=new AC(); } this.ctx=ctx; if(ctx.state==="suspended"){ try{ ctx.resume(); }catch(e){} }
    this.player=new PcmPlayer(ctx,PCM_RATE,()=>{ if(!this.responding&&!this.closed) this.h.onStatus("listening"); });
    if(!this.mic) return;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("This browser cannot use the microphone.");
    try{ this.stream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 } }); }
    catch(e){ throw new Error(/NotAllowed|Permission|policy/i.test(String(e))?"NotAllowed: microphone permission denied":"Microphone not available: "+(e&&e.message||e)); }
  }
  resumeAudio(){ try{ if(this.ctx&&this.ctx.state!=="running") return this.ctx.resume(); }catch(e){} }
  checkAudio(){ setTimeout(()=>{ if(this.closed||!this.ctx) return; if(this.ctx.state!=="running"){ this.resumeAudio(); setTimeout(()=>{ if(!this.closed&&this.ctx.state!=="running"&&this.h.onAudioLocked) this.h.onAudioLocked(); },400); } },600); }
  async startMic(){
    const ctx=this.ctx, src=ctx.createMediaStreamSource(this.stream); const sink=ctx.createGain(); sink.gain.value=0; sink.connect(ctx.destination);
    const push=(f32)=>{ if(this.closed) return; const rs=resampleLinear(f32,ctx.sampleRate,PCM_RATE); let sum=0; for(let i=0;i<rs.length;i+=4) sum+=rs[i]*rs[i]; this.h.onLevel(Math.sqrt(sum/(rs.length/4))); this.send({ type:"input_audio_buffer.append", audio:b64FromInt16(floatTo16(rs)) }); };
    if(ctx.audioWorklet){ try{ await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET_SRC],{type:"application/javascript"}))); const node=new AudioWorkletNode(ctx,"cgs-pcm"); node.port.onmessage=e=>push(e.data); src.connect(node); node.connect(sink); this.node=node; this.src=src; return; }catch(e){ console.warn("worklet failed, using ScriptProcessor",e); } }
    const sp=ctx.createScriptProcessor(4096,1,1); sp.onaudioprocess=e=>push(new Float32Array(e.inputBuffer.getChannelData(0))); src.connect(sp); sp.connect(sink); this.node=sp; this.src=src;
  }
  handle(m){
    const h=this.h; this.log(m.type);
    switch(m.type){
      case "session.created": case "session.updated": case "conversation.created": break;
      case "input_audio_buffer.speech_started": this.interrupt(); h.onStatus("listening"); break;
      case "input_audio_buffer.speech_stopped": case "input_audio_buffer.committed": h.onStatus("thinking"); break;
      case "conversation.item.input_audio_transcription.updated": { const t=m.transcript||m.delta||""; if(this.player&&this.player.playing) this.interrupt(); h.onUser(t,false); this.lastUser=t; break; }
      case "conversation.item.input_audio_transcription.completed": h.onUser(m.transcript||this.lastUser||"",true); break;
      case "response.created": this.responding=true; this.catText=""; this.audioGot=false; h.onStatus("thinking"); break;
      case "response.output_audio.delta": case "response.audio.delta": { const b64=m.delta||m.audio; if(b64&&this.player){ this.audioGot=true; this.player.enqueue(int16FromB64(b64)); h.onStatus("speaking"); } break; }
      case "response.output_audio_transcript.delta": case "response.text.delta": case "response.output_text.delta": this.catText+=(m.delta||m.text||""); h.onCat(this.catText,false); break;
      case "response.output_audio_transcript.done": case "response.text.done": case "response.output_text.done": { const t=m.transcript||m.text; if(t) this.catText=t; h.onCat(this.catText,true); break; }
      case "response.function_call_arguments.done": this.toolCall(m); break;
      case "response.done": this.responding=false; if(this.catText) h.onCat(this.catText,true);
        if(!this.audioGot&&this.catText&&this.pendingTools===0&&h.onSpeakFallback) h.onSpeakFallback(this.catText); // API sent words but no sound: say them with the browser's voice
        else if(!this.player||!this.player.playing) h.onStatus(this.pendingTools>0?"thinking":"listening"); break;
      case "error": { const msg=(m.error&&(m.error.message||m.error.code))||m.message||"unknown error"; console.warn("xai error",m); if(!/cancel/i.test(msg)) h.onError(String(msg)); break; }
      default: break;
    }
  }
  interrupt(){ if(this.player) this.player.stop(); this.responding=false; }
  log(t){ (this.events=this.events||[]).push(t); if(this.events.length>60) this.events.shift(); if(window.CGS_DEBUG) console.debug("xai ←",t); }
  async toolCall(m){ let args={}; try{ args=JSON.parse(m.arguments||"{}"); }catch(e){} this.pendingTools++; h_status(this,"thinking"); let out; try{ out=await this.h.onTool(m.name,args); }catch(e){ out={ok:false,msg:"failed"}; } this.pendingTools--;
    this.send({ type:"conversation.item.create", item:{ type:"function_call_output", call_id:m.call_id, output:JSON.stringify(out) } }); this.send({ type:"response.create" }); }
  close(bye){ this.closed=true; try{ this.player&&this.player.stop(); }catch(e){} try{ this.node&&this.node.disconnect(); this.src&&this.src.disconnect(); }catch(e){} try{ this.stream&&this.stream.getTracks().forEach(t=>t.stop()); }catch(e){} try{ this.ws&&this.ws.close(1000,"bye"); }catch(e){} try{ this.ctx&&this.ctx.close(); }catch(e){} }
}
function h_status(v,s){ try{ v.h.onStatus(s); }catch(e){} }


/* ================= 24-voice-browser ================= */
/* =====================================================================
   BROWSER VOICE — no-key fallback: Web Speech recognition + speech synthesis + CatBrain intents.
   Hands-free loop: listen → understand → act → speak → listen again, until the child says bye or taps End.
   ===================================================================== */
class BrowserVoice {
  constructor(o){ this.h=o.hooks; this.brain=o.brain; this.mic=o.mic!==false; this.active=false; this.rec=null; this.speaking=false; this.tts=window.speechSynthesis||null; this.SR=this.mic?(window.SpeechRecognition||window.webkitSpeechRecognition||null):null; this.failures=0; }
  async connect(){
    if(!this.SR&&!this.tts) throw new Error("This browser doesn't support voice chat. Try Chrome, Edge or Safari.");
    if(this.tts){ try{ this.tts.getVoices(); }catch(e){} }
    this.active=true;
    if(!this.SR&&this.mic) UI.toast("🎤 This browser can't hear you, but you can type to chat and your cat will talk back.",3600);
    await this.speak(this.brain.greeting());
  }
  resumeAudio(){ try{ if(this.tts&&this.tts.paused) this.tts.resume(); }catch(e){} }
  listen(){
    if(!this.active||!this.SR||this.speaking) return;
    if(this.rec){ try{ this.rec.onend=null; this.rec.abort(); }catch(e){} }
    const rec=new this.SR(); rec.lang="en-US"; rec.interimResults=true; rec.maxAlternatives=1; rec.continuous=false; this.rec=rec; let finalText="";
    rec.onstart=()=>{ this.failures=0; this.h.onStatus("listening"); };
    rec.onresult=(e)=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText+=r[0].transcript; else interim+=r[0].transcript; } this.h.onUser((finalText+" "+interim).trim(),false); if(this.h.onLevel) this.h.onLevel(0.05+Math.random()*0.05); };
    rec.onerror=(e)=>{ const k=e&&e.error; if(k==="not-allowed"||k==="service-not-allowed"){ this.active=false; this.h.onError("Microphone permission was denied. You can still type to chat."); this.h.onStatus("idle"); } else if(k==="network"){ this.failures++; if(this.failures>2){ this.h.onError("Speech recognition needs an internet connection. You can type instead."); } } };
    rec.onend=()=>{ if(!this.active) return; const text=finalText.trim(); if(text){ this.handleUser(text); } else if(!this.speaking){ this.failures++; setTimeout(()=>this.listen(),this.failures>4?1500:250); } };
    try{ rec.start(); }catch(e){ setTimeout(()=>{ if(this.active&&!this.speaking) this.listen(); },600); }
  }
  async handleUser(text){ this.h.onUser(text,true); this.h.onStatus("thinking"); let r; try{ r=await this.brain.reply(text); }catch(e){ console.error(e); r={text:"Oops, my whiskers got tangled. Say that again?"}; } await this.speak(r.text); }
  pickVoice(){ if(!this.tts) return null; const vs=this.tts.getVoices()||[]; const en=vs.filter(v=>/^en/i.test(v.lang)); const pref=["Google US English","Samantha","Karen","Moira","Microsoft Aria","Microsoft Zira","Microsoft Jenny","Daniel","Google UK English Female","Alex"]; for(const p of pref){ const v=en.find(x=>x.name.includes(p)); if(v) return v; } return en[0]||vs[0]||null; }
  speak(text){
    return new Promise(res=>{
      this.h.onCat(text,true);
      if(!this.tts){ this.h.onStatus(this.SR?"listening":"typing"); this.listen(); res(); return; }
      try{ this.tts.cancel(); }catch(e){}
      const u=new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,"")); const cat=CATS[Game.activeCat().id]; u.pitch=cat.pitch||1.1; u.rate=1.02; u.lang="en-US"; try{ const v=this.pickVoice(); if(v) u.voice=v; }catch(e){}
      this.speaking=true; this.h.onStatus("speaking");
      const done=()=>{ if(!this.speaking) return; this.speaking=false; if(this.active){ this.h.onStatus(this.SR?"listening":"typing"); setTimeout(()=>this.listen(),120); } res(); };
      u.onend=done; u.onerror=done; this.u=u; try{ this.tts.speak(u); }catch(e){ console.warn("tts",e); done(); return; }
      setTimeout(()=>{ if(this.speaking&&!this.tts.speaking) done(); },Math.min(20000,600+text.length*95));
    });
  }
  sendText(text){ if(this.speaking){ try{ this.tts.cancel(); }catch(e){} this.speaking=false; } if(this.rec){ try{ this.rec.onend=null; this.rec.abort(); }catch(e){} } this.handleUser(text); }
  close(bye){ this.active=false; try{ if(this.rec){ this.rec.onend=null; this.rec.abort(); } }catch(e){} if(this.tts){ try{ this.tts.cancel(); }catch(e){} if(bye){ try{ const u=new SpeechSynthesisUtterance(bye.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,"")); u.pitch=(CATS[Game.activeCat().id].pitch||1.1); u.lang="en-US"; try{ const v=this.pickVoice(); if(v) u.voice=v; }catch(e){} this.tts.speak(u); }catch(e){} } } }
}


/* ================= 25-fullwin ================= */
/* =====================================================================
   FULL WINDOW — Google's Apps Script wrapper embeds the game in a sandboxed iframe whose
   permissions policy never grants the microphone, so voice chat cannot run there. When that is
   detected, the game opens itself in its own top-level window (same origin → same save; cloud
   sync and voice tokens are bridged through the opener's google.script.run). The framed copy
   parks itself meanwhile so two copies never write the same save.
   ===================================================================== */
const FullWin=(()=>{
  const FONT_LINK='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">';
  let child=null, pollT=null, parked=false;
  function framed(){ try{ return window.top!==window.self; }catch(e){ return true; } }
  function isChild(){ return !!window.CGS_FULLWIN; }
  function micBlocked(){ // true when this document can never get the microphone (embedded without the permission)
    if(isChild()||!framed()) return false;
    try{ const pp=document.permissionsPolicy||document.featurePolicy; if(pp&&typeof pp.allowsFeature==="function") return !pp.allowsFeature("microphone"); }catch(e){}
    return !!HAS_GAS; // Apps Script's sandbox frame never grants it
  }
  function biggest(list,prop){ let best=null; list.forEach(n=>{ const t=String(n[prop]||""); if(!best||t.length>String(best[prop]||"").length) best=n; }); return best; }
  function pageHtml(){
    const style=document.getElementById("cgs-style")||biggest($$("style"),"textContent");
    const main=document.getElementById("cgs-main")||biggest($$("script:not([src])"),"text");
    const guard=document.getElementById("cgs-guard");
    if(!style||!main||String(main.text||"").length<10000) return null;
    return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#2B1F4A"><title>Cat Glam Studio</title>'+FONT_LINK+
      '<style id="cgs-style">'+style.textContent+'</style></head><body><div id="app"></div><div id="fx"></div><div id="modals"></div><div id="toast" class="toast"></div>'+
      '<script>window.CGS_FULLWIN=true;window.CGS_API_URL='+JSON.stringify(Cloud.url()||"")+';try{Object.defineProperty(window,"google",{configurable:true,get:function(){try{var o=window.opener;return (o&&o.google&&o.google.script&&o.google.script.run)?o.google:undefined;}catch(e){return undefined;}}});}catch(e){}<\/script>'+
      (guard?'<script id="cgs-guard">'+guard.text+'<\/script>':'')+'<script id="cgs-main">'+main.text+'<\/script></body></html>';
  }
  function offer(){
    const name=esc(Game.activeCat().name);
    UI.modal({title:"The mic can't work on this page 🎤",html:`<p>Google's page won't let ${name} hear you here. You can still chat by typing — ${name} talks out loud — or open the game in its own window to talk hands-free.</p><p class="small">Grown-ups: put the game at its own web address (README → "No pop-ups") and the mic works right on the page.</p>`,
      buttons:[{label:"💬 Type & listen here",cls:"pink",act:()=>{ setTimeout(()=>Voice.start({textOnly:true}),260); }},{label:"🚀 Talk in its own window",cls:"sky",act:()=>{ open(); }},{label:"Not now",cls:"ghost"}]});
  }
  function open(){
    if(isChild()) return false;
    const h=pageHtml(); if(!h){ UI.toast("Hmm, I can't open the window from here.",3000); return false; }
    let url=null; try{ url=URL.createObjectURL(new Blob([h],{type:"text/html;charset=utf-8"})); }catch(e){}
    let w=null; try{ w=window.open(url||"about:blank","cgsFullWindow","popup=yes,width=440,height=900"); }catch(e){ w=null; }
    if(!w){ UI.modal({title:"Pop-up blocked 🚫",html:"<p>Your browser blocked the new window. Allow pop-ups for this site (look for the icon at the end of the address bar), then tap the mic again.</p>",buttons:[{label:"OK",cls:"pink"}]}); return false; }
    child=w;
    setTimeout(()=>{ // if the browser refused the blob: URL, write the page into the window directly
      try{ if(w.closed) return; const href=String(w.location.href||""); const has=w.document&&w.document.getElementById("cgs-main"); if(!has&&(href===""||href==="about:blank")){ w.document.open(); w.document.write(h); w.document.close(); } }catch(e){}
    },1500);
    park(); return true;
  }
  function park(){
    parked=true; Save.setParked(true); try{ Voice.stop("closed"); }catch(e){} try{ UI.leaveCurrent(); }catch(e){}
    $("#modals").innerHTML=""; document.body.classList.remove("is-home");
    $("#app").innerHTML=`<div class="parked"><div class="big-emoji">🎤🐱</div><h2>Playing in the new window</h2><p>Cat Glam Studio is open in its own window so ${esc(Game.activeCat().name)} can hear you. Close that window to continue here.</p><button class="bigbtn pink" id="parkedFocus">Show the window</button><button class="bigbtn ghost" id="parkedBack">Continue here instead</button></div>`;
    $("#parkedFocus").addEventListener("click",()=>{ try{ child&&!child.closed&&child.focus(); }catch(e){} });
    $("#parkedBack").addEventListener("click",()=>{ try{ if(child&&!child.closed) child.close(); }catch(e){} resume(); });
    clearInterval(pollT); pollT=setInterval(check,1000);
  }
  function check(){ if(!parked) return; let closed=true; try{ closed=!child||child.closed; }catch(e){} if(closed) resume(); }
  function resume(){ if(!parked) return; clearInterval(pollT); pollT=null; child=null; parked=false; Save.setParked(false); reloadFromStore(); UI.toast("Welcome back! Your progress is here. 🐾",2500); }
  return { framed, isChild, micBlocked, offer, open, check, get parked(){ return parked; } };
})();


/* ================= 99-boot ================= */
/* =====================================================================
   BOOT — load/create save, wire UI, cloud sync, lifecycle
   ===================================================================== */
function newGame(){
  S=Save.defaultState();
  ITEMS.filter(i=>i.src==="start").forEach(i=>S.inv.items[i.id]=true);
  SCENES.filter(s=>s.src==="start").forEach(s=>S.inv.scenes[s.id]=true);
  S.cats.snow=newCatRecord("snow"); S.activeCat="snow";
}
function sanitize(){ // never let a broken save crash the game
  if(!S.cats||!Object.keys(S.cats).length){ S.cats={snow:newCatRecord("snow")}; S.activeCat="snow"; }
  if(!S.cats[S.activeCat]||!S.cats[S.activeCat].owned) S.activeCat=Object.keys(S.cats).find(id=>S.cats[id].owned)||Object.keys(S.cats)[0];
  Object.values(S.cats).forEach(c=>{ SLOTS.forEach(s=>{ if(c.outfit[s]&&!Game.item(c.outfit[s])) c.outfit[s]=null; }); if(!Game.scene(c.scene)) c.scene="bg_studio"; });
  ITEMS.filter(i=>i.src==="start").forEach(i=>{ if(!S.inv.items[i.id]) S.inv.items[i.id]=true; });
  if(!S.inv.scenes.bg_studio) S.inv.scenes.bg_studio=true;
  S.newItems=(S.newItems||[]).filter(id=>Game.item(id)&&S.inv.items[id]);
}
function ensureRoots(){ // the host page may hand us a body without our containers (or insert the script early)
  ["app","fx","modals","toast"].forEach(id=>{ if(!document.getElementById(id)){ const d=document.createElement("div"); d.id=id; if(id==="toast") d.className="toast"; (document.body||document.documentElement).appendChild(d); } });
}
function mountShell(rewire){
  ensureRoots();
  $("#app").innerHTML=`<div id="frame"><div id="hudbar">${UI.hudHtml()}</div><div id="screens"></div></div>`;
  UI.hudBind(); if(rewire!==false) UI.wire();
}
function reloadFromStore(){ // re-read the shared save (another window may have played) and rebuild the UI without re-registering listeners
  const loaded=Save.load(); if(loaded) S=loaded; else newGame();
  sanitize(); Sfx.setMuted(!!S.settings.muted); $("#modals").innerHTML=""; mountShell(false); Game.ensureDaily(); Game.tickAll();
  UI.go(S.onboarding.done?"home":"onboard"); UI.refreshHud();
}
function isFresh(s){ try{ return !s.onboarding.done||(s.player.level<=1&&(s.player.xp||0)<20&&Object.keys(s.cats||{}).length<=1); }catch(e){ return true; } }
function adoptCloud(obj){ const r=Save.importString(JSON.stringify(obj)); if(r.ok){ sanitize(); $$(".screen").forEach(n=>n.remove()); UI.go(S.onboarding.done?"home":"onboard"); UI.refreshHud(); UI.toast("☁️ Progress synced from the cloud",2600); } return r.ok; }
function cloudConnectSync(){ // after a cloud link is entered in Settings: pull, and let the grown-up choose when both sides have progress
  Save.cloudPull(obj=>{
    if(!obj||!obj.player){ Save.persist(); UI.toast("☁️ Connected — this device's progress is now backed up",3000); return; }
    if(isFresh(S)){ adoptCloud(obj); return; }
    const when=t=>t?new Date(t).toLocaleDateString():"?";
    UI.modal({title:"Which progress? ☁️",html:`<p>Both this device and the cloud have progress.</p><p><b>Cloud:</b> level ${obj.player.level||1} · ${obj.player.coins||0} 🪙 · saved ${when(obj.updatedAt)}<br><b>This device:</b> level ${S.player.level} · ${S.player.coins} 🪙</p><p class="small">The one you keep replaces the other.</p>`,
      buttons:[{label:"Use the cloud progress",cls:"sky",act:()=>{ adoptCloud(obj); Save.persist(); }},{label:"Keep this device's",cls:"pink",act:()=>{ Save.persist(); UI.toast("☁️ This device's progress is now in the cloud",2600); }}],static:true});
  });
}
function welcomeBack(lastSeen){
  const away=(Date.now()-(lastSeen||Date.now()))/36e5; if(away<6||!S.onboarding.done) return;
  const c=Game.activeCat(); const mi=Game.moodInfo(c);
  UI.queueModal(()=>UI.modal({cls:"celebrate",html:`${C.catPortrait(c.id,c.outfit,mi.m>=60?"happy":"sad")}<h2>Welcome back!</h2><p>${esc(c.name)} missed you. ${mi.m<60?"A snack or a bath would cheer them up! 🍽️🛁":"They're feeling "+mi.t.toLowerCase()+" 😺"}</p>${Game.streakInfo().claimable?'<p>🔥 Your daily gift is ready to claim!</p>':""}`,buttons:[{label:"Let's play! 🐾",cls:"pink"}]}));
}
function start(){
  const loaded=Save.load(); const lastSeen=loaded?loaded.updatedAt:0; if(loaded){ S=loaded; } else newGame();
  sanitize(); Sfx.setMuted(!!S.settings.muted); mountShell();
  Game.ensureDaily(); Game.tickAll(); Save.persist();
  const first=!S.onboarding.done; UI.go(first?"onboard":"home"); if(!first) welcomeBack(lastSeen);
  if(loaded&&loaded.migratedFromV1&&!S.seen.migrated){ S.seen.migrated=true; Save.save(); UI.queueModal(()=>UI.modal({cls:"celebrate",html:`<div class="big-emoji">🎁</div><h2>Welcome to the new studio!</h2><p>Your cats, coins and unlocked items came along, plus a +40 🪙 welcome bonus. Lots of new rooms to explore!</p>`,buttons:[{label:"Show me! ✨",cls:"pink"}]})); }
  setTimeout(()=>Game.runChecks(),300); Voice.init();
  if(window.CGS_FULLWIN){ setTimeout(()=>{ UI.queueModal(()=>UI.modal({cls:"celebrate",html:`<div class="big-emoji">🎤</div><h2>Ready to talk!</h2><p>${esc(Game.activeCat().name)} can hear you in this window. Your browser will ask to use the microphone — choose Allow.</p>`,buttons:[{label:"Start talking 🐱",cls:"pink",act:()=>{ setTimeout(()=>Voice.start(),200); }},{label:"Later",cls:"ghost"}]})); },700); }
  if(Cloud.available()){ Save.cloudPull(obj=>{ if(!obj||!obj.player) return; const localWins=!!loaded&&!isFresh(S)&&(lastSeen||0)>=(obj.updatedAt||0); if(!localWins) adoptCloud(obj); }); }
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(FullWin.parked){ FullWin.check(); return; } Game.tickAll(); if(Game.ensureDaily()&&UI.current==="home") UI.rebuild("home"); UI.refreshHud(); } });
  window.addEventListener("pointerdown",function once(){ Sfx.unlock(); window.removeEventListener("pointerdown",once); },{once:true});
  document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false}); // no accidental zoom
  window.CGS={ get S(){return S;}, Game, UI, Save, Voice, CatBrain, Wardrobe, Challenges, Shows, Shop, Mystery, School, Art, ITEMS, SCENES, CATS, COLLECTIONS, CHALLENGES, ACHIEVEMENTS, MISSION_POOL, Sfx, FX, FullWin, Cloud, newCatRecord, defaultState, HAS_GAS };
  window.__cgsBooted=true; const gc=document.getElementById("cgs-guard-card"); if(gc) gc.remove();
}
window.addEventListener("error",e=>{ console.error("Game error:",e.message); });
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();

})();
/*CGS-END*/
</script>
